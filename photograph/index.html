<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photograph</title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #f0f0f0;
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        main {
            position: relative;
            width: min(100vw, 75vh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        .ellipseGuide {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(72%, 720px);
            height: min(76%, 1032px);
            border: 2px solid rgba(39, 194, 138, 0.88);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #cameraButton,
        output {
            position: absolute;
            left: 32px;
            padding: 16px 20px;
            border: 0;
            border-radius: 12px;
            background: #1b2026e0;
            color: #f4f7fb;
            font: inherit;
            font-size: 20px;
        }

        #cameraButton {
            top: 32px;
            cursor: pointer;
        }

        .recordButton {
            position: absolute;
            left: 50%;
            bottom: 32px;
            z-index: 2;
            width: 112px;
            height: 112px;
            border: 0;
            border-radius: 999px;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            font: inherit;
            font-size: 18px;
            cursor: pointer;
        }

        output {
            bottom: 32px;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <main>
        <video id="video" autoplay muted playsinline></video>
        <div class="ellipseGuide" aria-hidden="true"></div>
        <button id="cameraButton" type="button">WebCam</button>
        <button id="recordButton" class="recordButton" type="button"></button>
        <output id="status">カメラ起動中...</output>
    </main>

    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        async function startCamera() {
            video.srcObject?.getTracks().forEach((track) => track.stop());
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 4096 },
                        height: { ideal: 4096 },
                        frameRate: { ideal: 60 }
                    },
                    audio: false
                });
                await video.play();
                const track = video.srcObject.getVideoTracks()[0];
                const { width, height, frameRate } = track.getSettings();
                const capabilities = track.getCapabilities?.() || {};
                const maxWidth = Math.round(capabilities.width?.max) || "-";
                const maxHeight = Math.round(capabilities.height?.max) || "-";
                const maxFrameRate = Math.round(capabilities.frameRate?.max) || "-";
                status.textContent = `最大: ${maxWidth}x${maxHeight} / ${maxFrameRate}fps\n録画: ${Math.round(width)}x${Math.round(height)} / ${Math.round(frameRate)}fps`;
            } catch (error) {
                status.textContent = `カメラを開始できません: ${error.message}`;
            }
        }

        document.getElementById("cameraButton").addEventListener("click", startCamera);
        window.addEventListener("pagehide", () => video.srcObject?.getTracks().forEach((track) => track.stop()));
        startCamera();
    </script>
</body>

</html>
