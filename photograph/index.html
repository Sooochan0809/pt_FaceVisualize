<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photograph</title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #f0f0f0;
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        main {
            position: relative;
            width: min(100vw, 75vh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        video {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100dvh;
            height: min(100vw, 75vh);
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1) rotate(90deg);
            display: block;
        }

        .ellipseGuide,
        .countdown {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ellipseGuide {
            width: min(72%, 720px);
            height: min(76%, 1032px);
            border: 2px solid rgba(39, 194, 138, 0.88);
            border-radius: 50%;
        }

        #cameraButton,
        output {
            position: absolute;
            left: 32px;
            padding: 16px 20px;
            border: 0;
            border-radius: 12px;
            background: #1b2026e0;
            color: #f4f7fb;
            font: inherit;
            font-size: 20px;
        }

        #cameraButton {
            top: 32px;
            cursor: pointer;
        }

        .recordButton {
            position: absolute;
            left: 50%;
            bottom: 32px;
            z-index: 2;
            width: 112px;
            aspect-ratio: 1;
            border: 0;
            border-radius: 999px;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            font: inherit;
            font-size: 18px;
            cursor: pointer;
        }

        .recordButton:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .countdown {
            z-index: 3;
            color: #fff;
            font-size: clamp(72px, 10vw, 112px);
            font-weight: 700;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        output {
            bottom: 32px;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <main>
        <video id="video" autoplay muted playsinline></video>
        <div class="ellipseGuide" aria-hidden="true"></div>
        <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
        <button id="cameraButton" type="button">WebCam</button>
        <button id="recordButton" class="recordButton" type="button">録画</button>
        <output id="status">カメラ起動中...</output>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const video = $("video");
        const status = $("status");
        const cameraButton = $("cameraButton");
        const recordButton = $("recordButton");
        const countdown = $("countdown");
        const VIDEO_BITRATE = 60_000_000;
        const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
        const stopStream = (stream) => stream?.getTracks().forEach((track) => track.stop());
        let recorder = null;
        let statusFrameCallback = 0;

        function downloadRecording(blob) {
            const extension = blob.type.includes("mp4") ? "mp4" : "webm";
            const now = new Date();
            const pad = (number) => String(number).padStart(2, "0");
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `rec_${now.getFullYear()}-${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.${extension}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function getRecordingSize() {
            return {
                width: Math.round(video.videoHeight / 2) * 2,
                height: Math.round(video.videoWidth / 2) * 2
            };
        }

        function measureStatus(maximum) {
            const size = getRecordingSize();
            status.textContent = `${maximum}\n実測: ${size.width}x${size.height} / 計測中`;
            let startedAt = null;
            let frames = 0;

            const measure = (now) => {
                if (startedAt !== null) frames += 1;
                else startedAt = now;

                const elapsed = now - startedAt;
                if (elapsed >= 1000) {
                    const current = getRecordingSize();
                    if (status.textContent.startsWith("最大:")) {
                        status.textContent = `${maximum}\n実測: ${current.width}x${current.height} / ${Math.round(frames * 1000 / elapsed)}fps`;
                    }
                    statusFrameCallback = 0;
                    return;
                }
                statusFrameCallback = video.requestVideoFrameCallback(measure);
            };

            statusFrameCallback = video.requestVideoFrameCallback(measure);
        }

        function createRecordingStream() {
            if (typeof video.requestVideoFrameCallback !== "function") {
                throw new Error("このブラウザは実フレーム同期録画に対応していません");
            }
            const { width: recordingWidth, height: recordingHeight } = getRecordingSize();
            const canvas = document.createElement("canvas");
            canvas.width = recordingWidth;
            canvas.height = recordingHeight;
            const context = canvas.getContext("2d");
            const stream = canvas.captureStream(0);
            const canvasTrack = stream.getVideoTracks()[0];
            if (typeof canvasTrack.requestFrame !== "function") {
                stopStream(stream);
                throw new Error("このブラウザは実フレーム同期録画に対応していません");
            }
            let frameCallback;

            const drawFrame = () => {
                context.setTransform(0, 1, 1, 0, 0, 0);
                context.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
                canvasTrack.requestFrame();
                frameCallback = video.requestVideoFrameCallback(drawFrame);
            };

            frameCallback = video.requestVideoFrameCallback(drawFrame);
            return {
                stream,
                stop: () => {
                    video.cancelVideoFrameCallback(frameCallback);
                    stopStream(stream);
                }
            };
        }

        async function startCamera() {
            if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
            stopStream(video.srcObject);
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 3840 },
                        height: { ideal: 2160 },
                        frameRate: { ideal: 60 }
                    },
                    audio: false
                });
                await video.play();
                const track = video.srcObject.getVideoTracks()[0];
                const capabilities = track.getCapabilities?.() || {};
                const max = (name) => Math.round(capabilities[name]?.max) || "-";
                measureStatus(`最大: ${max("width")}x${max("height")} / ${max("frameRate")}fps`);
            } catch (error) {
                status.textContent = `カメラを開始できません: ${error.message}`;
            }
        }

        async function toggleRecording() {
            if (recorder?.state === "recording") {
                recordButton.disabled = true;
                recorder.stop();
                return;
            }
            if (!(video.srcObject instanceof MediaStream)) {
                status.textContent = "先にWebcamを起動してください";
                return;
            }

            recordButton.disabled = true;
            try {
                const chunks = [];
                const recording = createRecordingStream();
                const activeRecorder = new MediaRecorder(recording.stream, {
                    videoBitsPerSecond: VIDEO_BITRATE
                });
                recorder = activeRecorder;
                activeRecorder.addEventListener("dataavailable", (event) => {
                    if (event.data.size) chunks.push(event.data);
                });
                activeRecorder.addEventListener("stop", () => {
                    recording.stop();
                    downloadRecording(new Blob(chunks, { type: activeRecorder.mimeType }));
                    recorder = null;
                    recordButton.textContent = "録画";
                    recordButton.disabled = false;
                }, { once: true });
                activeRecorder.start();
                recordButton.textContent = "停止";

                countdown.hidden = false;
                for (let count = 3; count >= 1; count -= 1) {
                    countdown.textContent = count;
                    await wait(1000);
                }
            } catch (error) {
                status.textContent = `録画を開始できません: ${error.message}`;
            } finally {
                countdown.hidden = true;
                recordButton.disabled = false;
            }
        }

        cameraButton.addEventListener("click", startCamera);
        recordButton.addEventListener("click", toggleRecording);
        window.addEventListener("pagehide", () => {
            if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
            stopStream(video.srcObject);
        });
        startCamera();
    </script>
</body>

</html>
