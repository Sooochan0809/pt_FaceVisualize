<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Incomplete Deformation</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <script defer src="app.js?v=20260926-7"></script>
    <style>
        :root {
            --bg: #f2f1ee;
            --panel: #fff;
            --ink: #171a1d;
            --muted: #74797e;
            --line: #dcdedc;
            --accent: #ff6b45;
            --mint: #42d392;
            --violet: #8b6fc0;
            --danger: #c94c4c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", system-ui, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
        }

        button {
            padding: 0 12px;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .app {
            width: min(1900px, 100%);
            min-height: 100dvh;
            margin: auto;
            display: grid;
            grid-template-columns: minmax(260px, .7fr) minmax(480px, 520px) minmax(0, 1.3fr);
        }

        .rawPreview,
        .workspace,
        .sidebar {
            min-width: 0;
            padding: 18px;
        }

        .sidebar {
            grid-column: 2;
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            background: rgba(255, 255, 255, .68);
        }

        .rawPreview {
            grid-column: 1;
            grid-row: 1;
        }

        .workspace {
            grid-column: 3;
            grid-row: 1;
        }

        @media (min-width: 1181px) {

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .app {
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
            }

            .rawPreview,
            .workspace {
                height: 100dvh;
                overflow: hidden;
            }

            .sidebar {
                height: 100dvh;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-gutter: stable;
            }
        }

        .stack {
            display: grid;
            align-content: start;
            gap: 14px;
        }

        .rawStage {
            aspect-ratio: 9 / 16;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 9px;
            background: #111416;
        }

        #clipPreviewVideo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .rawMeta {
            margin-top: 9px;
            overflow: hidden;
            color: var(--muted);
            font: .66rem ui-monospace, monospace;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel {
            min-width: 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--panel);
        }

        .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .compactButton {
            min-height: 28px;
            padding: 0 9px;
            border-radius: 6px;
            font-size: .66rem;
            white-space: nowrap;
        }

        h2,
        p {
            margin: 0;
        }

        h2 {
            font-size: .88rem;
        }

        .stage {
            position: relative;
            min-height: 360px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 9px;
            background: #111416;
        }

        #outputCanvas {
            display: block;
            width: 100%;
            max-height: 62dvh;
            object-fit: contain;
        }

        #sourceVideo,
        #transitionVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .stageOverlay {
            position: absolute;
            inset: auto 12px 12px 12px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 1px 3px #000;
        }

        .stageTitle {
            font-size: .78rem;
        }

        .stagePhase {
            color: rgba(255, 255, 255, .72);
            font: .67rem ui-monospace, monospace;
        }

        .transport {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 10px;
            margin-top: 11px;
        }

        .transportLoop {
            min-height: 0;
            white-space: nowrap;
        }

        .transport button {
            width: 44px;
            padding: 0;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .time {
            min-width: 92px;
            color: var(--muted);
            font: .7rem ui-monospace, monospace;
            text-align: right;
        }

        .sequenceTimeline {
            --timeline-progress: 0%;
            position: relative;
            display: flex;
            min-height: 58px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #eee;
        }

        .sequenceTimeline::before,
        .sequenceTimeline::after {
            content: "";
            position: absolute;
            z-index: 5;
            bottom: 0;
            left: 0;
            height: 4px;
            pointer-events: none;
        }

        .sequenceTimeline::before {
            width: 100%;
            background: rgba(23, 26, 29, .18);
        }

        .sequenceTimeline::after {
            width: var(--timeline-progress);
            background: var(--accent);
            transition: width 60ms linear;
        }

        .timelineClip {
            position: relative;
            min-width: 4px;
            display: grid;
            grid-template-rows: 20px 38px;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, .8);
        }

        .timelineClipLabel {
            grid-column: 1;
            min-width: 0;
            overflow: hidden;
            padding: 3px 5px 0;
            background: rgba(255, 255, 255, .82);
            color: var(--muted);
            font: .58rem ui-monospace, monospace;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timelineMeaning,
        .timelineComposition {
            position: relative;
            min-width: 0;
            display: flex;
            overflow: hidden;
        }

        .timelineMeaning {
            grid-column: 1;
            grid-row: 2;
        }

        .timelineComposition {
            z-index: 2;
            grid-column: 1;
            grid-row: 2;
            pointer-events: none;
        }

        .timelinePhase {
            min-width: 0;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, .72);
        }

        .timelinePhase.intro {
            background: #dce8f4;
        }

        .timelinePhase.expression {
            background: #f7d8ca;
        }

        .timelinePhase.skip {
            background: #ddd3ee;
        }

        .timelinePhase.decay {
            background: #d4eadc;
        }

        .timelinePhase.hold {
            background: #c9ced2;
        }

        .timelineSource {
            min-width: 0;
            overflow: hidden;
        }

        .timelineSource.single {
            background: transparent;
        }

        .timelineSource.home {
            background: rgba(88, 96, 104, .08);
        }

        .timelineSource.morph {
            background: repeating-linear-gradient(135deg, rgba(255, 107, 69, .72) 0 4px, rgba(255, 255, 255, .12) 4px 8px);
        }

        .timelineEvent {
            position: absolute;
            z-index: 3;
            top: 20px;
            bottom: 0;
            width: 1px;
            pointer-events: none;
        }

        .timelineEvent.onset {
            background: var(--mint);
        }

        .timelineEvent.skipPoint {
            width: 2px;
            background: var(--ink);
        }

        .timelineClip.active {
            outline: 2px solid var(--ink);
            outline-offset: -2px;
        }

        .timelineLegend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 7px;
            color: var(--muted);
            font-size: .62rem;
        }

        .timelineLegend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .timelineLegend i {
            width: 18px;
            height: 7px;
            border-radius: 2px;
        }

        .timelineLegend .intro {
            background: #dce8f4;
        }

        .timelineLegend .expression {
            background: #f7d8ca;
        }

        .timelineLegend .skip {
            background: #ddd3ee;
        }

        .timelineLegend .decay {
            background: #d4eadc;
        }

        .timelineLegend .hold {
            background: #c9ced2;
        }

        .timelineLegend .morph {
            background: repeating-linear-gradient(135deg, rgba(255, 107, 69, .72) 0 3px, rgba(255, 180, 151, .42) 3px 6px);
        }

        .timelineLegend .onset {
            width: 2px;
            height: 11px;
            margin: 0 8px;
            background: var(--mint);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .8);
        }

        .previewExportRow,
        .sequenceHeaderActions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .previewExportRow {
            justify-content: flex-end;
            margin-top: 12px;
        }

        .accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #21100b;
        }

        .dark {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }

        .status {
            flex: 1;
            min-width: 180px;
            color: var(--muted);
            font-size: .72rem;
        }

        .status.error {
            color: var(--danger);
        }

        .sidebar .status {
            display: block;
            margin-bottom: 8px;
        }

        .previewProgress {
            margin: 0 0 9px;
        }

        progress {
            width: 100%;
            height: 7px;
            margin-top: 9px;
            accent-color: var(--accent);
        }

        progress[hidden] {
            display: none;
        }

        .settingsGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .settingsGroupLabel {
            grid-column: 1 / -1;
            margin-top: 2px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: .7rem;
            font-weight: 600;
        }

        .field {
            min-width: 0;
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: .7rem;
        }

        .fieldHint {
            min-height: 2.5em;
            color: var(--muted);
            font-size: .58rem;
            line-height: 1.25;
        }

        .field input[type="number"],
        .field select {
            width: 100%;
            height: 36px;
            min-width: 0;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
            color: var(--ink);
        }

        .checkField {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 36px;
            color: var(--muted);
            font-size: .72rem;
        }

        .clipList {
            display: grid;
            gap: 8px;
        }

        .clipEmpty {
            width: 100%;
            min-height: 74px;
            display: grid;
            place-items: center;
            gap: 3px;
            padding: 22px 10px;
            color: var(--muted);
            font-size: .75rem;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: transparent;
        }

        .clipEmpty:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(255, 107, 69, .04);
        }

        .clipEmpty img {
            width: 40px;
            height: 40px;
            display: block;
            object-fit: contain;
        }

        .clipCard {
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .clipCard.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .clipEditorDisclosure {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
            cursor: default;
        }

        .clipEditorDisclosure>summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--ink);
            font-size: .7rem;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
        }

        .clipEditorDisclosure>summary::-webkit-details-marker {
            display: none;
        }

        .clipEditorDisclosure>summary::before {
            content: "›";
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            transform: rotate(0deg);
            transition: transform .15s ease;
        }

        .clipEditorDisclosure[open]>summary::before {
            transform: rotate(90deg);
        }

        .clipEditorDisclosure>summary .badge {
            margin-left: auto;
            font-weight: 400;
        }

        .clipEditorBody {
            padding-top: 10px;
        }

        .rangeWrap {
            position: relative;
            height: 24px;
            margin: 8px 2px 2px;
        }

        .rangeWrap input {
            position: absolute;
            inset: 0;
            width: 100%;
            margin: 0;
            pointer-events: none;
            background: transparent;
            accent-color: var(--accent);
        }

        .rangeWrap input::-webkit-slider-thumb {
            pointer-events: auto;
        }

        .rangeWrap input::-moz-range-thumb {
            pointer-events: auto;
        }

        #analyzeAllButton {
            width: 100%;
            margin-bottom: 10px;
        }

        .clipTop {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }

        .clipIndex {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #f0f1f1;
            font: .69rem ui-monospace, monospace;
        }

        .clipName {
            overflow: hidden;
            font-size: .76rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipMeta {
            margin-top: 2px;
            color: var(--muted);
            font: .63rem ui-monospace, monospace;
        }

        .iconButton {
            min-width: 30px;
            min-height: 30px;
            padding: 0 7px;
        }

        .clipActions {
            display: flex;
            gap: 4px;
        }

        .phaseBar {
            display: flex;
            height: 7px;
            overflow: hidden;
            margin-top: 9px;
            border-radius: 4px;
            background: #eee;
        }

        .phaseBar i {
            display: block;
            min-width: 1px;
        }

        .before {
            background: #8b949d;
        }

        .rise {
            background: var(--mint);
        }

        .settle {
            background: var(--violet);
        }

        .phaseLabels {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-top: 5px;
            color: var(--muted);
            font: .59rem ui-monospace, monospace;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 21px;
            padding: 0 7px;
            border-radius: 10px;
            background: #f0f1f1;
            color: var(--muted);
            font-size: .62rem;
        }

        .badge.ready {
            background: #dff7eb;
            color: #267353;
        }

        .editor[hidden] {
            display: none;
        }

        .boundaryGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-top: 10px;
        }

        .boundary {
            padding: 8px;
            border-radius: 7px;
            background: #f5f5f3;
        }

        .boundary label {
            display: grid;
            gap: 4px;
            color: var(--muted);
            font-size: .62rem;
        }

        .boundary input {
            width: 100%;
            min-width: 0;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            font: .78rem ui-monospace, monospace;
        }

        .boundaryValue {
            margin-top: 5px;
            color: var(--muted);
            font: .6rem ui-monospace, monospace;
        }

        .editorRow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
            gap: 8px;
            align-items: end;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .miniCanvas {
            width: 100%;
            height: 104px;
            display: block;
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
        }

        .legend {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
            color: var(--muted);
            font-size: .62rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .legend i {
            width: 14px;
            height: 3px;
            border-radius: 2px;
        }

        @media (max-width: 1180px) {
            .app {
                grid-template-columns: 1fr;
            }

            .rawPreview,
            .workspace,
            .sidebar {
                grid-column: 1;
                grid-row: auto;
            }

            .rawPreview {
                grid-row: 1;
            }

            .sidebar {
                grid-row: 2;
            }

            .workspace {
                grid-row: 3;
            }

            .sidebar {
                border-left: 0;
                border-right: 0;
                border-top: 1px solid var(--line);
            }
        }

        @media (max-width: 560px) {

            .rawPreview,
            .workspace,
            .sidebar {
                padding: 10px;
            }

            .stage {
                min-height: 240px;
            }

            .settingsGrid,
            .boundaryGrid,
            .editorRow {
                grid-template-columns: 1fr;
            }

            .transport {
                grid-template-columns: auto minmax(0, 1fr) auto;
            }

            .transportLoop {
                grid-column: 2 / -1;
                justify-self: end;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="rawPreview stack">
            <section class="panel">
                <div class="panelHeader">
                    <h2>素材プレビュー</h2>
                </div>
                <div class="rawStage">
                    <video id="clipPreviewVideo" playsinline muted controls preload="metadata"></video>
                </div>
                <div class="rawMeta" id="clipPreviewMeta">素材を選択してください</div>
            </section>
        </section>

        <section class="workspace stack">
            <section class="panel">
                <div class="stage">
                    <canvas id="outputCanvas" width="1280" height="720"></canvas>
                    <video id="sourceVideo" playsinline muted preload="auto"></video>
                    <video id="transitionVideo" playsinline muted preload="auto"></video>
                    <div class="stageOverlay">
                        <div>
                            <div class="stageTitle" id="stageTitle"></div>
                            <div class="stagePhase" id="stagePhase"></div>
                        </div>
                    </div>
                </div>
                <div class="transport">
                    <button id="playButton" type="button" disabled aria-label="プレビュー再生">▶</button>
                    <input id="playhead" type="range" min="0" max="1" value="0" step="0.001" disabled>
                    <output id="timeOutput" class="time">0.00 / 0.00s</output>
                    <label class="checkField transportLoop"><input id="loopToggle" type="checkbox" checked>
                        ループ再生</label>
                </div>
                <div class="sequenceTimeline" id="sequenceTimeline" aria-label="シーケンスタイムライン"></div>
                <div class="timelineLegend" aria-label="タイムライン凡例">
                    <span><i class="intro"></i>導入</span>
                    <span><i class="expression"></i>表情化</span>
                    <span><i class="skip"></i>スキップ</span>
                    <span><i class="decay"></i>自然収束</span>
                    <span><i class="hold"></i>保持</span>
                    <span><i class="morph"></i>素材が重なるモーフ</span>
                    <span><i class="onset"></i>表情発生</span>
                </div>
                <div class="previewExportRow">
                    <button id="exportButton" class="dark" type="button" disabled>書き出し</button>
                </div>
            </section>

        </section>

        <aside class="sidebar stack">
            <section class="panel">
                <div class="panelHeader">
                    <h2>素材</h2>
                    <span class="badge" id="clipCount">0 clips</span>
                </div>
                <input id="fileInput" type="file" accept="video/*" multiple hidden>
                <button id="analyzeAllButton" class="accent" type="button" disabled>すべて解析</button>
                <span class="status" id="status">MediaPipe / Face APIモデルを読み込んでいます</span>
                <progress id="progress" class="previewProgress" min="0" max="1" value="0" hidden></progress>
                <div class="clipList" id="clipList"></div>
                <details id="clipEditor" class="editor clipEditorDisclosure" hidden>
                    <summary><span>個別解析・境界調整</span><span class="badge" id="detectionBadge">未解析</span></summary>
                    <div class="clipEditorBody">
                        <div class="editorRow">
                            <label class="field">対象の表情
                                <select id="emotionSelect"></select>
                            </label>
                            <button id="analyzeClipButton" class="accent" type="button">再解析</button>
                        </div>
                        <div class="legend">
                            <span><i style="background:#7f8993"></i>無表情</span>
                            <span><i style="background:var(--accent)"></i><b id="emotionLegend">喜び</b></span>
                            <span><i style="background:#3478d4"></i>顔形状変位</span>
                            <span><i style="background:#171a1d"></i>合成進行度</span>
                        </div>
                        <canvas id="analysisChart" class="miniCanvas"></canvas>
                        <div class="rangeWrap">
                            <input id="skipOutRange" type="range" min="0" max="1" value="0" step="0.01"
                                aria-label="切り取り開始">
                            <input id="skipInRange" type="range" min="0" max="1" value="1" step="0.01"
                                aria-label="切り取り終了">
                        </div>
                        <div class="boundaryGrid">
                            <div class="boundary">
                                <label>切り取り開始<input id="skipOutInput" type="number" min="0" step="0.01"></label>
                                <div class="boundaryValue" id="skipOutDuration">上昇側</div>
                            </div>
                            <div class="boundary">
                                <label>切り取り終了<input id="skipInInput" type="number" min="0" step="0.01"></label>
                                <div class="boundaryValue" id="skipDuration">下降側</div>
                            </div>
                        </div>
                    </div>
                </details>
            </section>

            <section class="panel">
                <div class="panelHeader">
                    <h2>シーケンス</h2>
                    <div class="sequenceHeaderActions">
                        <button id="importJsonButton" class="compactButton" type="button">設定を読み込む</button>
                        <button id="exportJsonButton" class="compactButton" type="button" disabled>設定を書き出す</button>
                    </div>
                    <input id="jsonInput" type="file" accept="application/json,.json" hidden>
                </div>
                <div class="settingsGrid">
                    <div class="settingsGroupLabel">再生テンポ</div>
                    <label class="field">表情化：発生→上昇終了（秒）
                        <input id="risePlaybackDuration" type="number" min="0.05" max="5" step="0.05" value="0.45">
                        <span class="fieldHint">素材ごとの上昇区間をこの長さに揃える</span>
                    </label>
                    <label class="field">ピークスキップ・モーフ（秒）
                        <input id="skipDurationSetting" type="number" min="0.05" max="1" step="0.05" value="0.20">
                        <span class="fieldHint">上昇側から形状の近い下降側へ重ねる</span>
                    </label>
                    <label class="field">自然収束（秒）
                        <input id="decayDuration" type="number" min="0.05" max="5" step="0.05" value="0.60">
                        <span class="fieldHint">下降側の再開位置から無表情まで</span>
                    </label>
                    <div class="settingsGroupLabel">素材間の接続</div>
                    <label class="field">初回導入／次素材へのモーフ（秒）
                        <input id="morphDuration" type="number" min="0" max="1" step="0.05" value="0.20">
                        <span class="fieldHint">1本目は冒頭尺、以降は前素材の無表情→次素材の発生</span>
                    </label>
                    <label class="field">無表情の保持（秒）
                        <input id="holdDuration" type="number" min="0" max="5" step="0.05" value="0.10">
                        <span class="fieldHint">次の素材へ移る前に無表情を見せる時間</span>
                    </label>
                </div>
            </section>

        </aside>
    </main>
</body>

</html>
