<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Incomplete Deformation</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <script defer src="app.js?v=20260922-12"></script>
    <style>
        :root {
            --bg: #f2f1ee;
            --panel: #fff;
            --ink: #171a1d;
            --muted: #74797e;
            --line: #dcdedc;
            --accent: #ff6b45;
            --mint: #42d392;
            --violet: #8b6fc0;
            --danger: #c94c4c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", system-ui, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
        }

        button {
            padding: 0 12px;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .app {
            width: min(1560px, 100%);
            min-height: 100dvh;
            margin: auto;
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(390px, .85fr);
        }

        .workspace,
        .sidebar {
            min-width: 0;
            padding: 18px;
        }

        .sidebar {
            border-left: 1px solid var(--line);
            background: rgba(255, 255, 255, .68);
        }

        @media (min-width: 941px) {

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .app {
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
            }

            .workspace {
                position: sticky;
                top: 0;
                height: 100dvh;
                overflow: hidden;
            }

            .sidebar {
                height: 100dvh;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-gutter: stable;
            }
        }

        .stack {
            display: grid;
            align-content: start;
            gap: 14px;
        }

        .panel {
            min-width: 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--panel);
        }

        .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .compactButton {
            min-height: 28px;
            padding: 0 9px;
            border-radius: 6px;
            font-size: .66rem;
            white-space: nowrap;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 1rem;
            letter-spacing: .04em;
        }

        h2 {
            font-size: .88rem;
        }

        .stage {
            position: relative;
            min-height: 360px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 9px;
            background: #111416;
        }

        #outputCanvas {
            display: block;
            width: 100%;
            max-height: 62dvh;
            object-fit: contain;
        }

        #sourceVideo,
        #transitionVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .stageOverlay {
            position: absolute;
            inset: auto 12px 12px 12px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 1px 3px #000;
        }

        .stageTitle {
            font-size: .78rem;
        }

        .stagePhase {
            color: rgba(255, 255, 255, .72);
            font: .67rem ui-monospace, monospace;
        }

        .transport {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 10px;
            margin-top: 11px;
        }

        .transportLoop {
            min-height: 0;
            white-space: nowrap;
        }

        .transport button {
            width: 44px;
            padding: 0;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .time {
            min-width: 92px;
            color: var(--muted);
            font: .7rem ui-monospace, monospace;
            text-align: right;
        }

        .sequenceTimeline {
            --timeline-progress: 0%;
            position: relative;
            display: flex;
            min-height: 58px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #eee;
        }

        .sequenceTimeline::before,
        .sequenceTimeline::after {
            content: "";
            position: absolute;
            z-index: 5;
            bottom: 0;
            left: 0;
            height: 4px;
            pointer-events: none;
        }

        .sequenceTimeline::before {
            width: 100%;
            background: rgba(23, 26, 29, .18);
        }

        .sequenceTimeline::after {
            width: var(--timeline-progress);
            background: var(--accent);
            transition: width 60ms linear;
        }

        .timelineClip {
            position: relative;
            min-width: 4px;
            display: grid;
            grid-template-rows: 20px 38px;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, .8);
        }

        .timelineClipLabel {
            grid-column: 1;
            min-width: 0;
            overflow: hidden;
            padding: 3px 5px 0;
            background: rgba(255, 255, 255, .82);
            color: var(--muted);
            font: .58rem ui-monospace, monospace;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timelineMeaning,
        .timelineComposition {
            position: relative;
            min-width: 0;
            display: flex;
            overflow: hidden;
        }

        .timelineMeaning {
            grid-column: 1;
            grid-row: 2;
        }

        .timelineComposition {
            z-index: 2;
            grid-column: 1;
            grid-row: 2;
            pointer-events: none;
        }

        .timelinePhase {
            min-width: 0;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, .72);
        }

        .timelinePhase.intro {
            background: #dce8f4;
        }

        .timelinePhase.expression {
            background: #f7d8ca;
        }

        .timelinePhase.rewind {
            background: #ddd3ee;
        }

        .timelinePhase.returnHome {
            background: #d4eadc;
        }

        .timelinePhase.hold {
            background: #c9ced2;
        }

        .timelineSource {
            min-width: 0;
            overflow: hidden;
        }

        .timelineSource.single {
            background: transparent;
        }

        .timelineSource.home {
            background: rgba(88, 96, 104, .08);
        }

        .timelineSource.morph {
            background: repeating-linear-gradient(135deg, rgba(255, 107, 69, .72) 0 4px, rgba(255, 255, 255, .12) 4px 8px);
        }

        .timelineEvent {
            position: absolute;
            z-index: 3;
            top: 20px;
            bottom: 0;
            width: 1px;
            pointer-events: none;
        }

        .timelineEvent.onset {
            background: var(--mint);
        }

        .timelineEvent.fold {
            width: 2px;
            background: var(--ink);
        }

        .timelineClip.active {
            outline: 2px solid var(--ink);
            outline-offset: -2px;
        }

        .timelineLegend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 7px;
            color: var(--muted);
            font-size: .62rem;
        }

        .timelineLegend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .timelineLegend i {
            width: 18px;
            height: 7px;
            border-radius: 2px;
        }

        .timelineLegend .intro {
            background: #dce8f4;
        }

        .timelineLegend .expression {
            background: #f7d8ca;
        }

        .timelineLegend .rewind {
            background: #ddd3ee;
        }

        .timelineLegend .returnHome {
            background: #d4eadc;
        }

        .timelineLegend .hold {
            background: #c9ced2;
        }

        .timelineLegend .morph {
            background: repeating-linear-gradient(135deg, rgba(255, 107, 69, .72) 0 3px, rgba(255, 180, 151, .42) 3px 6px);
        }

        .timelineLegend .onset {
            width: 2px;
            height: 11px;
            margin: 0 8px;
            background: var(--mint);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .8);
        }

        .timelineLegend .fold {
            width: 2px;
            height: 11px;
            margin: 0 8px;
            background: var(--ink);
        }

        .previewExportRow,
        .sequenceHeaderActions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .previewExportRow {
            justify-content: space-between;
            margin-top: 12px;
        }

        .previewExportRow .status {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .previewExportRow button {
            flex: 0 0 auto;
        }

        .accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #21100b;
        }

        .dark {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }

        .status {
            flex: 1;
            min-width: 180px;
            color: var(--muted);
            font-size: .72rem;
        }

        .status.error {
            color: var(--danger);
        }

        .previewProgress {
            margin: 0 0 9px;
        }

        progress {
            width: 100%;
            height: 7px;
            margin-top: 9px;
            accent-color: var(--accent);
        }

        progress[hidden] {
            display: none;
        }

        .settingsGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .settingsGroupLabel {
            grid-column: 1 / -1;
            margin-top: 2px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: .7rem;
            font-weight: 600;
        }

        .field {
            min-width: 0;
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: .7rem;
        }

        .fieldHint {
            min-height: 2.5em;
            color: var(--muted);
            font-size: .58rem;
            line-height: 1.25;
        }

        .field input[type="number"],
        .field select {
            width: 100%;
            height: 36px;
            min-width: 0;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
            color: var(--ink);
        }

        .checkField {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 36px;
            color: var(--muted);
            font-size: .72rem;
        }

        .clipList {
            display: grid;
            gap: 8px;
        }

        .clipEmpty {
            width: 100%;
            min-height: 74px;
            display: grid;
            place-items: center;
            gap: 3px;
            padding: 22px 10px;
            color: var(--muted);
            font-size: .75rem;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: transparent;
        }

        .clipEmpty:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(255, 107, 69, .04);
        }

        .clipEmpty img {
            width: 40px;
            height: 40px;
            display: block;
            object-fit: contain;
        }

        .clipCard {
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .clipCard.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .clipEditorDisclosure {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
            cursor: default;
        }

        .clipEditorDisclosure>summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--ink);
            font-size: .7rem;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
        }

        .clipEditorDisclosure>summary::-webkit-details-marker {
            display: none;
        }

        .clipEditorDisclosure>summary::before {
            content: "›";
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            transform: rotate(0deg);
            transition: transform .15s ease;
        }

        .clipEditorDisclosure[open]>summary::before {
            transform: rotate(90deg);
        }

        .clipEditorDisclosure>summary .badge {
            margin-left: auto;
            font-weight: 400;
        }

        .clipEditorBody {
            padding-top: 10px;
        }

        .materialAnalysisSetting {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: auto 36px auto;
            column-gap: 8px;
            row-gap: 5px;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: .7rem;
        }

        .materialAnalysisSetting>label {
            grid-column: 1 / -1;
        }

        .materialAnalysisSetting>input {
            width: 100%;
            height: 36px;
            min-width: 0;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
            color: var(--ink);
            align-self: center;
        }

        .materialAnalysisSetting>button {
            grid-column: 2;
            grid-row: 2;
        }

        #analyzeAllButton {
            width: 100%;
        }

        .materialAnalysisSetting .fieldHint {
            grid-column: 1 / -1;
            min-height: 0;
        }

        .clipTop {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }

        .clipIndex {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #f0f1f1;
            font: .69rem ui-monospace, monospace;
        }

        .clipName {
            overflow: hidden;
            font-size: .76rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipMeta {
            margin-top: 2px;
            color: var(--muted);
            font: .63rem ui-monospace, monospace;
        }

        .iconButton {
            min-width: 30px;
            min-height: 30px;
            padding: 0 7px;
        }

        .clipActions {
            display: flex;
            gap: 4px;
        }

        .phaseBar {
            display: flex;
            height: 7px;
            overflow: hidden;
            margin-top: 9px;
            border-radius: 4px;
            background: #eee;
        }

        .phaseBar i {
            display: block;
            min-width: 1px;
        }

        .before {
            background: #8b949d;
        }

        .rise {
            background: var(--mint);
        }

        .settle {
            background: var(--violet);
        }

        .phaseLabels {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-top: 5px;
            color: var(--muted);
            font: .59rem ui-monospace, monospace;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 21px;
            padding: 0 7px;
            border-radius: 10px;
            background: #f0f1f1;
            color: var(--muted);
            font-size: .62rem;
        }

        .badge.ready {
            background: #dff7eb;
            color: #267353;
        }

        .editor[hidden] {
            display: none;
        }

        .boundaryGrid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
            margin-top: 10px;
        }

        .boundary {
            padding: 8px;
            border-radius: 7px;
            background: #f5f5f3;
        }

        .boundary label {
            display: grid;
            gap: 4px;
            color: var(--muted);
            font-size: .62rem;
        }

        .boundary input {
            width: 100%;
            min-width: 0;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            font: .78rem ui-monospace, monospace;
        }

        .boundaryValue {
            margin-top: 5px;
            color: var(--muted);
            font: .6rem ui-monospace, monospace;
        }

        .editorRow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
            gap: 8px;
            align-items: end;
            margin-top: 10px;
        }

        .miniCanvas {
            width: 100%;
            height: 104px;
            display: block;
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--muted);
            font-size: .62rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .legend i {
            width: 14px;
            height: 3px;
            border-radius: 2px;
        }

        @media (max-width: 940px) {
            .app {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-left: 0;
                border-top: 1px solid var(--line);
            }
        }

        @media (max-width: 560px) {

            .workspace,
            .sidebar {
                padding: 10px;
            }

            .stage {
                min-height: 240px;
            }

            .settingsGrid,
            .boundaryGrid,
            .editorRow {
                grid-template-columns: 1fr;
            }

            .transport {
                grid-template-columns: auto minmax(0, 1fr) auto;
            }

            .transportLoop {
                grid-column: 2 / -1;
                justify-self: end;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="workspace stack">
            <section class="panel">
                <progress id="progress" class="previewProgress" min="0" max="1" value="0" hidden></progress>
                <div class="stage">
                    <canvas id="outputCanvas" width="1280" height="720"></canvas>
                    <video id="sourceVideo" playsinline muted preload="auto"></video>
                    <video id="transitionVideo" playsinline muted preload="auto"></video>
                    <div class="stageOverlay">
                        <div>
                            <div class="stageTitle" id="stageTitle"></div>
                            <div class="stagePhase" id="stagePhase"></div>
                        </div>
                    </div>
                </div>
                <div class="transport">
                    <button id="playButton" type="button" disabled aria-label="プレビュー再生">▶</button>
                    <input id="playhead" type="range" min="0" max="1" value="0" step="0.001" disabled>
                    <output id="timeOutput" class="time">0.00 / 0.00s</output>
                    <label class="checkField transportLoop"><input id="loopToggle" type="checkbox" checked>
                        ループ再生</label>
                </div>
                <div class="sequenceTimeline" id="sequenceTimeline" aria-label="シーケンスタイムライン"></div>
                <div class="timelineLegend" aria-label="タイムライン凡例">
                    <span><i class="intro"></i>導入</span>
                    <span><i class="expression"></i>表情化</span>
                    <span><i class="rewind"></i>巻戻し</span>
                    <span><i class="returnHome"></i>ホーム復帰</span>
                    <span><i class="hold"></i>保持</span>
                    <span><i class="morph"></i>素材が重なるモーフ</span>
                    <span><i class="onset"></i>表情発生</span>
                    <span><i class="fold"></i>折返し</span>
                </div>
                <div class="previewExportRow">
                    <span class="status" id="status">MediaPipe / Face APIモデルを読み込んでいます</span>
                    <button id="exportButton" class="dark" type="button" disabled>書き出し</button>
                </div>
            </section>

        </section>

        <aside class="sidebar stack">
            <section class="panel">
                <div class="panelHeader">
                    <h2>素材</h2>
                    <span class="badge" id="clipCount">0 clips</span>
                </div>
                <input id="fileInput" type="file" accept="video/*" multiple hidden>
                <div class="materialAnalysisSetting">
                    <label for="sampleInterval">解析サンプル間隔（秒）</label>
                    <input id="sampleInterval" type="number" min="0.04" max="1" step="0.01" value="0.08">
                    <button id="analyzeAllButton" class="accent" type="button" disabled>すべて解析</button>
                    <span class="fieldHint">小さいほど高精度になり、解析時間が増加</span>
                </div>
                <div class="clipList" id="clipList"></div>
                <details id="clipEditor" class="editor clipEditorDisclosure" hidden>
                    <summary><span>個別解析・境界調整</span><span class="badge" id="detectionBadge">未解析</span></summary>
                    <div class="clipEditorBody">
                        <div class="editorRow">
                            <label class="field">対象の表情
                                <select id="emotionSelect"></select>
                            </label>
                            <label class="field">ピーク前の折返し位置（%）
                                <input id="clipCutRatio" type="number" min="10" max="99" step="1" value="85">
                            </label>
                            <button id="analyzeClipButton" class="accent" type="button">再解析</button>
                        </div>
                        <canvas id="analysisChart" class="miniCanvas"></canvas>
                        <div class="legend">
                            <span><i style="background:#7f8993"></i>無表情</span>
                            <span><i style="background:var(--accent)"></i><b id="emotionLegend">喜び</b></span>
                            <span><i style="background:#3478d4"></i>ランドマーク変位</span>
                            <span><i style="background:#171a1d"></i>合成進行度</span>
                            <span><i style="background:var(--mint)"></i>発生</span>
                            <span><i style="background:var(--violet)"></i>ピーク / 収束</span>
                        </div>
                        <div class="boundaryGrid">
                            <div class="boundary">
                                <label>表情が発生するまで<input id="onsetInput" type="number" min="0" step="0.01"></label>
                                <div class="boundaryValue" id="onsetDuration">0.00s</div>
                            </div>
                            <div class="boundary">
                                <label>発生からピーク<input id="peakInput" type="number" min="0" step="0.01"></label>
                                <div class="boundaryValue" id="riseDuration">0.00s</div>
                            </div>
                            <div class="boundary">
                                <label>ピークから収束<input id="settleInput" type="number" min="0" step="0.01"></label>
                                <div class="boundaryValue" id="settleDuration">0.00s</div>
                            </div>
                        </div>
                    </div>
                </details>
            </section>

            <section class="panel">
                <div class="panelHeader">
                    <h2>シーケンス</h2>
                    <div class="sequenceHeaderActions">
                        <button id="importJsonButton" class="compactButton" type="button">設定を読み込む</button>
                        <button id="exportJsonButton" class="compactButton" type="button" disabled>設定を書き出す</button>
                    </div>
                    <input id="jsonInput" type="file" accept="application/json,.json" hidden>
                </div>
                <div class="settingsGrid">
                    <div class="settingsGroupLabel">再生テンポ</div>
                    <label class="field">表情化：発生→折返し（秒）
                        <input id="risePlaybackDuration" type="number" min="0.05" max="5" step="0.05" value="0.45">
                        <span class="fieldHint">発生点から手動の折返し位置まで</span>
                    </label>
                    <label class="field">巻戻し：折返し→発生（秒）
                        <input id="rewindDuration" type="number" min="0.05" max="5" step="0.05" value="0.45">
                        <span class="fieldHint">折返し位置から発生点へ戻るまで</span>
                    </label>
                    <div class="settingsGroupLabel">ホームとの接続</div>
                    <label class="field">初回導入／表情へのモーフ（秒）
                        <input id="morphDuration" type="number" min="0" max="1" step="0.05" value="0.20">
                        <span class="fieldHint">1本目は導入尺、以降はHOME→素材のモーフ尺</span>
                    </label>
                    <label class="field">ホーム復帰＋モーフ（秒）
                        <input id="returnDuration" type="number" min="0.05" max="5" step="0.05" value="0.30">
                        <span class="fieldHint">発生点からHOMEまで。区間全体でモーフ</span>
                    </label>
                    <label class="field">ホーム位置：発生の何秒前
                        <input id="preOnsetReturn" type="number" min="0" max="2" step="0.05" value="0.30">
                        <span class="fieldHint">各素材内で、発生点より前へ戻す量</span>
                    </label>
                    <label class="field">ホーム保持（秒）
                        <input id="holdDuration" type="number" min="0" max="5" step="0.05" value="0.10">
                        <span class="fieldHint">次の素材へ移る前にHOMEを見せる時間</span>
                    </label>
                </div>
            </section>

        </aside>
    </main>
</body>

</html>
