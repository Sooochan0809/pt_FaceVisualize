<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenticular Image Maker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #171717;
      --muted: #666;
      --border: #d7d7d7;
      --accent: #222;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --panel: #222;
        --text: #f1f1f1;
        --muted: #aaa;
        --border: #444;
        --accent: #fff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .controls {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    fieldset {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    #generatePitchTest {
      margin-top: 8px;
    }

    legend {
      padding: 0 6px;
      font-weight: 700;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
    }

    input[type="checkbox"] {
      width: auto;
      min-height: auto;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      background: var(--accent);
      color: var(--panel);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .button-row.spaced {
      margin-top: 10px;
    }

    .images-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .image-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 34px 34px;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px;
    }

    .thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 4px;
      background: #ccc;
    }

    .image-meta {
      min-width: 0;
    }

    .image-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .image-size {
      color: var(--muted);
      font-size: 11px;
    }

    .icon-button {
      padding: 0;
      min-height: 34px;
      font-size: 16px;
    }

    .preview-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(300px, 1fr) auto;
      gap: 12px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .preview-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .canvas-wrap {
      min-height: 300px;
      display: grid;
      place-items: center;
      overflow: auto;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #bbb 25%, transparent 25%),
        linear-gradient(-45deg, #bbb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #bbb 75%),
        linear-gradient(-45deg, transparent 75%, #bbb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    canvas {
      max-width: 100%;
      max-height: 75vh;
      display: block;
      background: white;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Lenticular Image Maker</h1>
  </header>

  <main>
    <section class="panel controls">
      <fieldset>
        <legend>1. 画像</legend>
        <input id="fileInput" type="file" accept="image/*" multiple />
        <div id="imagesList" class="images-list"></div>
        <div class="button-row spaced">
          <button id="reverseImages" type="button">順番を反転</button>
          <button id="clearImages" type="button">すべて削除</button>
        </div>
        <label class="check-label">
          <input id="headAlignment" type="checkbox" checked />
          頭部位置を自動で合わせる
        </label>
      </fieldset>

      <fieldset>
        <legend>2. 用紙・出力</legend>
        <div class="grid">
          <label>
            用紙プリセット
            <select id="paperPreset">
              <option value="custom" selected>カスタム</option>
              <option value="a4">A4</option>
              <option value="a3">A3</option>
              <option value="postcard">はがき</option>
            </select>
          </label>
          <label>
            向き
            <select id="orientation">
              <option value="portrait" selected>縦</option>
              <option value="landscape">横</option>
            </select>
          </label>
          <label>
            幅（mm）
            <input id="paperWidth" type="number" min="1" step="0.1" value="29.25" />
          </label>
          <label>
            高さ（mm）
            <input id="paperHeight" type="number" min="1" step="0.1" value="39" />
          </label>
          <label>
            出力PPI
            <input id="ppi" type="number" min="72" max="1200" step="1" value="600" />
          </label>
          <label>
            画像の配置
            <select id="fitMode">
              <option value="cover" selected>余白なし（中央トリミング）</option>
              <option value="contain">全体を表示</option>
              <option value="stretch">引き伸ばす</option>
            </select>
          </label>
          <label>
            画像の明るさ（%）
            <input id="brightness" type="number" min="50" max="200" step="5" value="160" />
          </label>
        </div>
        <label class="check-label">
          <input id="registrationMarks" type="checkbox" checked />
          四隅に6点位置合わせマークを重ねる
        </label>
      </fieldset>

      <fieldset>
        <legend>3. レンチキュラー</legend>
        <div class="grid">
          <label>
            LPI
            <input id="lpi" type="number" min="1" max="200" step="0.001" value="50.000" />
          </label>
          <label>
            レンズ方向
            <select id="lensDirection">
              <option value="vertical">縦レンズ</option>
              <option value="horizontal" selected>横レンズ</option>
            </select>
          </label>
          <label>
            位相（0〜1）
            <input id="phase" type="number" min="-10" max="10" step="0.001" value="0.000" />
          </label>
          <label>
            プレビュー倍率
            <select id="previewScale">
              <option value="0.05">5%</option>
              <option value="0.1">10%</option>
              <option value="0.2">20%</option>
              <option value="0.3" selected>30%</option>
            </select>
          </label>
        </div>
        <label class="check-label">
          <input id="reverseOrder" type="checkbox" />
          画像インターレース順を反転
        </label>
      </fieldset>

      <fieldset>
        <legend>4. ピッチテスト</legend>
        <div class="grid three">
          <label>
            中心LPI
            <input id="testCenter" type="number" step="0.001" value="50.000" />
          </label>
          <label>
            ±範囲
            <input id="testRange" type="number" min="0" step="0.001" value="0.200" />
          </label>
          <label>
            刻み
            <input id="testStep" type="number" min="0.001" step="0.001" value="0.025" />
          </label>
        </div>
        <button id="generatePitchTest" type="button">ピッチテストを生成</button>
      </fieldset>

      <div class="button-row">
        <button id="generatePreview" type="button">更新</button>
        <button id="exportPng" class="primary" type="button">書き出し</button>
      </div>
    </section>

    <section class="panel preview-panel">
      <div class="preview-header">
        <h2>プレビュー</h2>
        <div id="status" class="status">画像を読み込んでください。</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="previewCanvas" width="800" height="600"></canvas>
      </div>
      <p id="detail"></p>
    </section>
  </main>

  <script>
    "use strict";

    const MAX_IMAGES = 7;
    const MAX_CANVAS_PIXELS = 150_000_000;
    const MAX_PITCH_VALUES = 60;
    const PREVIEW_DELAY_MS = 250;
    const MM_PER_INCH = 25.4;
    const MEDIAPIPE_TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";
    const FACE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
    const MEDIAPIPE_WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm";
    const ALIGN_LANDMARKS = [
      33, 133, 362, 263, 1, 4, 61, 291, 199, 152
    ];

    const state = {
      images: [],
      lastRenderMode: "interlace"
    };
    let faceLandmarkerPromise = null;

    const $ = (id) => document.getElementById(id);

    const els = {
      fileInput: $("fileInput"),
      imagesList: $("imagesList"),
      reverseImages: $("reverseImages"),
      clearImages: $("clearImages"),
      headAlignment: $("headAlignment"),
      paperPreset: $("paperPreset"),
      orientation: $("orientation"),
      paperWidth: $("paperWidth"),
      paperHeight: $("paperHeight"),
      ppi: $("ppi"),
      fitMode: $("fitMode"),
      brightness: $("brightness"),
      registrationMarks: $("registrationMarks"),
      lpi: $("lpi"),
      lensDirection: $("lensDirection"),
      phase: $("phase"),
      previewScale: $("previewScale"),
      reverseOrder: $("reverseOrder"),
      testCenter: $("testCenter"),
      testRange: $("testRange"),
      testStep: $("testStep"),
      generatePitchTest: $("generatePitchTest"),
      generatePreview: $("generatePreview"),
      exportPng: $("exportPng"),
      previewCanvas: $("previewCanvas"),
      status: $("status"),
      detail: $("detail")
    };

    const PAPER_PRESETS = {
      a4: [210, 297],
      a3: [297, 420],
      postcard: [100, 148]
    };

    function mod(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function mmToPixels(mm, ppi) {
      return Math.max(1, Math.round((mm / MM_PER_INCH) * ppi));
    }

    function getSettings() {
      const widthMm = Number(els.paperWidth.value);
      const heightMm = Number(els.paperHeight.value);
      const ppi = Number(els.ppi.value);
      const lpi = Number(els.lpi.value);
      const phase = Number(els.phase.value);
      const previewScale = Number(els.previewScale.value);
      const brightness = Number(els.brightness.value);

      if (![widthMm, heightMm, ppi, lpi, phase, previewScale, brightness].every(Number.isFinite)) {
        throw new Error("数値設定に不正な値があります。");
      }
      if (widthMm <= 0 || heightMm <= 0 || ppi <= 0 || lpi <= 0) {
        throw new Error("幅・高さ・PPI・LPIは0より大きくしてください。");
      }
      if (brightness < 50 || brightness > 200) {
        throw new Error("画像の明るさは50〜200%で指定してください。");
      }

      return {
        widthMm,
        heightMm,
        ppi,
        lpi,
        phase,
        previewScale,
        fitMode: els.fitMode.value,
        brightness,
        headAlignment: els.headAlignment.checked,
        registrationMarks: els.registrationMarks.checked,
        lensDirection: els.lensDirection.value,
        reverseOrder: els.reverseOrder.checked
      };
    }

    function getOutputDimensions(settings, scale = 1) {
      return {
        width: Math.max(1, Math.round(mmToPixels(settings.widthMm, settings.ppi) * scale)),
        height: Math.max(1, Math.round(mmToPixels(settings.heightMm, settings.ppi) * scale))
      };
    }

    function getInterlacePreviewScale(settings) {
      const scaleForEveryImage = settings.lpi * state.images.length / settings.ppi;
      return Math.min(1, Math.max(settings.previewScale, scaleForEveryImage));
    }

    async function getFaceLandmarker() {
      if (!faceLandmarkerPromise) {
        faceLandmarkerPromise = import(MEDIAPIPE_TASKS_URL)
          .then(({ FaceLandmarker, FilesetResolver }) => FilesetResolver
            .forVisionTasks(MEDIAPIPE_WASM_URL)
            .then((vision) => FaceLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: FACE_MODEL_URL
              },
              runningMode: "IMAGE",
              numFaces: 1
            })))
          .catch((error) => {
            faceLandmarkerPromise = null;
            throw error;
          });
      }
      return faceLandmarkerPromise;
    }

    async function detectFaceLandmarks(image) {
      try {
        const faceLandmarker = await getFaceLandmarker();
        const result = faceLandmarker.detect(image);
        const landmarks = result.faceLandmarks?.[0];
        if (!landmarks) return null;
        return landmarks.map((point) => ({
          x: point.x * image.naturalWidth,
          y: point.y * image.naturalHeight
        }));
      } catch (error) {
        console.warn("Face landmark detection failed.", error);
        return null;
      }
    }

    async function loadImageFile(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.decoding = "async";
        image.src = url;
        await image.decode();
        const landmarks = await detectFaceLandmarks(image);
        return {
          name: file.name,
          image,
          width: image.naturalWidth,
          height: image.naturalHeight,
          landmarks,
          thumbUrl: url
        };
      } catch (error) {
        URL.revokeObjectURL(url);
        throw error;
      }
    }

    function releaseImage(item) {
      URL.revokeObjectURL(item.thumbUrl);
    }

    async function loadImageFiles(files) {
      const loaded = [];
      try {
        for (const file of files) loaded.push(await loadImageFile(file));
        return loaded;
      } catch (error) {
        loaded.forEach(releaseImage);
        throw error;
      }
    }

    function createIconButton(text, title, onClick, disabled = false) {
      const button = document.createElement("button");
      button.className = "icon-button";
      button.type = "button";
      button.textContent = text;
      button.title = title;
      button.disabled = disabled;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderImageList() {
      els.imagesList.replaceChildren();

      state.images.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "image-row";

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.src = item.thumbUrl;
        thumb.alt = "";

        const meta = document.createElement("div");
        meta.className = "image-meta";
        const name = document.createElement("div");
        name.className = "image-name";
        name.textContent = `${index + 1}. ${item.name}`;
        const size = document.createElement("div");
        size.className = "image-size";
        size.textContent = `${item.width} × ${item.height}px`;
        meta.append(name, size);

        const up = createIconButton("↑", "上へ", () => moveImage(index, index - 1), index === 0);
        const remove = createIconButton("×", "削除", () => removeImage(index));

        row.append(thumb, meta, up, remove);
        els.imagesList.appendChild(row);
      });
    }

    function moveImage(from, to) {
      if (to < 0 || to >= state.images.length) return;
      const [item] = state.images.splice(from, 1);
      state.images.splice(to, 0, item);
      renderImageList();
      schedulePreview();
    }

    function removeImage(index) {
      const [item] = state.images.splice(index, 1);
      if (item) releaseImage(item);
      renderImageList();
      schedulePreview();
    }

    function clearImages() {
      state.images.forEach(releaseImage);
      state.images = [];
      renderImageList();
      clearCanvas();
      updateStatus("画像を読み込んでください。", "");
    }

    function clearCanvas() {
      const ctx = els.previewCanvas.getContext("2d");
      ctx.clearRect(0, 0, els.previewCanvas.width, els.previewCanvas.height);
    }

    function updateStatus(status, detail = "") {
      els.status.textContent = status;
      els.detail.textContent = detail;
    }

    function setBusy(isBusy, message = "処理中…") {
      els.generatePreview.disabled = isBusy;
      els.generatePitchTest.disabled = isBusy;
      els.exportPng.disabled = isBusy;
      if (isBusy) els.status.textContent = message;
    }

    async function runBusyTask(message, failureStatus, task) {
      setBusy(true, message);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      try {
        await task();
      } catch (error) {
        console.error(error);
        updateStatus(failureStatus, error.message);
      } finally {
        setBusy(false);
      }
    }

    function applyPaperPreset() {
      const preset = PAPER_PRESETS[els.paperPreset.value];
      if (!preset) return;
      let [width, height] = preset;
      if (els.orientation.value === "landscape") [width, height] = [height, width];
      els.paperWidth.value = width;
      els.paperHeight.value = height;
      schedulePreview();
    }

    function applyOrientation() {
      const width = Number(els.paperWidth.value);
      const height = Number(els.paperHeight.value);
      const wantsLandscape = els.orientation.value === "landscape";
      if (wantsLandscape && width < height) {
        els.paperWidth.value = height;
        els.paperHeight.value = width;
      } else if (!wantsLandscape && width > height) {
        els.paperWidth.value = height;
        els.paperHeight.value = width;
      }
      schedulePreview();
    }

    function getFittedImageTransform(image, targetWidth, targetHeight, fitMode) {
      const sourceWidth = image.naturalWidth;
      const sourceHeight = image.naturalHeight;

      if (fitMode === "stretch") {
        return {
          a: targetWidth / sourceWidth,
          b: 0,
          c: 0,
          d: targetHeight / sourceHeight,
          e: 0,
          f: 0
        };
      }

      const scale = fitMode === "contain"
        ? Math.min(targetWidth / sourceWidth, targetHeight / sourceHeight)
        : Math.max(targetWidth / sourceWidth, targetHeight / sourceHeight);

      return {
        a: scale,
        b: 0,
        c: 0,
        d: scale,
        e: (targetWidth - sourceWidth * scale) / 2,
        f: (targetHeight - sourceHeight * scale) / 2
      };
    }

    function transformPoint(point, transform) {
      return {
        x: transform.a * point.x + transform.c * point.y + transform.e,
        y: transform.b * point.x + transform.d * point.y + transform.f
      };
    }

    function averagePoint(points) {
      const sum = points.reduce((total, point) => ({
        x: total.x + point.x,
        y: total.y + point.y
      }), { x: 0, y: 0 });
      return {
        x: sum.x / points.length,
        y: sum.y / points.length
      };
    }

    function getSimilarityTransform(sourceLandmarks, targetLandmarks) {
      const pairs = ALIGN_LANDMARKS
        .filter((index) => sourceLandmarks[index] && targetLandmarks[index])
        .map((index) => ({
          source: sourceLandmarks[index],
          target: targetLandmarks[index]
        }));
      if (pairs.length < 2) return null;

      const sourceCenter = averagePoint(pairs.map((pair) => pair.source));
      const targetCenter = averagePoint(pairs.map((pair) => pair.target));
      const fit = pairs.reduce((sum, pair) => {
        const sx = pair.source.x - sourceCenter.x;
        const sy = pair.source.y - sourceCenter.y;
        const tx = pair.target.x - targetCenter.x;
        const ty = pair.target.y - targetCenter.y;
        return {
          dot: sum.dot + sx * tx + sy * ty,
          cross: sum.cross + sx * ty - sy * tx,
          size: sum.size + sx * sx + sy * sy
        };
      }, { dot: 0, cross: 0, size: 0 });
      if (fit.size === 0) return null;

      const a = fit.dot / fit.size;
      const b = fit.cross / fit.size;
      return {
        a,
        b,
        c: -b,
        d: a,
        e: targetCenter.x - a * sourceCenter.x + b * sourceCenter.y,
        f: targetCenter.y - b * sourceCenter.x - a * sourceCenter.y
      };
    }

    function getImageTransforms(settings, targetWidth, targetHeight) {
      const fittedTransforms = state.images.map((item) => (
        getFittedImageTransform(item.image, targetWidth, targetHeight, settings.fitMode)
      ));
      if (!settings.headAlignment) return fittedTransforms;

      const referenceIndex = state.images.findIndex((item) => item.landmarks);
      if (referenceIndex < 0) return fittedTransforms;

      const reference = state.images[referenceIndex];
      const referenceLandmarks = reference.landmarks.map((point) => (
        transformPoint(point, fittedTransforms[referenceIndex])
      ));
      return state.images.map((item, index) => {
        if (index === referenceIndex || !item.landmarks) return fittedTransforms[index];
        return getSimilarityTransform(item.landmarks, referenceLandmarks) || fittedTransforms[index];
      });
    }

    function drawTransformedImage(ctx, image, transform) {
      ctx.save();
      ctx.transform(
        transform.a,
        transform.b,
        transform.c,
        transform.d,
        transform.e,
        transform.f
      );
      ctx.drawImage(image, 0, 0);
      ctx.restore();
    }

    function prepareCanvas(canvas, width, height) {
      if (width * height > MAX_CANVAS_PIXELS) {
        throw new Error("出力サイズが大きすぎます。PPIまたは用紙サイズを下げてください。");
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, width, height);
      return ctx;
    }

    function drawSixDotMark(ctx, centerX, centerY, radius) {
      const columnOffset = radius * 0.36;
      const rowOffset = radius * 0.42;
      const dotRadius = radius * 0.16;
      const offsets = [
        [-columnOffset, -rowOffset],
        [columnOffset, -rowOffset],
        [-columnOffset, 0],
        [columnOffset, 0],
        [-columnOffset, rowOffset],
        [columnOffset, rowOffset]
      ];

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = "black";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.78, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();

      ctx.beginPath();
      offsets.forEach(([offsetX, offsetY]) => {
        ctx.moveTo(centerX + offsetX + dotRadius, centerY + offsetY);
        ctx.arc(centerX + offsetX, centerY + offsetY, dotRadius, 0, Math.PI * 2);
      });
      ctx.fillStyle = "black";
      ctx.fill();
    }

    function drawRegistrationMarks(ctx, width, height, effectivePpi, lpi, axisMap, vertical, imageCount) {
      const pixelsPerMm = effectivePpi / MM_PER_INCH;
      const inset = Math.min(1.6 * pixelsPerMm, width / 4, height / 4);
      const lensPitch = effectivePpi / lpi;
      const radius = Math.min(
        Math.max(1.05 * pixelsPerMm, lensPitch * 1.5),
        1.4 * pixelsPerMm,
        inset * 0.75,
        width / 8,
        height / 8
      );
      const referenceImageIndex = Math.floor((imageCount - 1) / 2);
      const positions = [
        [inset, inset],
        [width - inset, inset],
        [inset, height - inset],
        [width - inset, height - inset]
      ];

      positions.forEach(([x, y]) => {
        const left = Math.max(0, Math.floor(x - radius));
        const right = Math.min(width, Math.ceil(x + radius));
        const top = Math.max(0, Math.floor(y - radius));
        const bottom = Math.min(height, Math.ceil(y + radius));

        ctx.save();
        ctx.beginPath();
        addMappedRunsToPath(
          ctx,
          axisMap,
          referenceImageIndex,
          vertical,
          left,
          right,
          top,
          bottom
        );
        ctx.clip();

        drawSixDotMark(ctx, x, y, radius);
        ctx.restore();
      });
    }

    function createAxisImageMap(length, settings, effectivePpi, imageCount) {
      const map = new Uint8Array(length);
      for (let axis = 0; axis < length; axis++) {
        const lensPosition = (axis + 0.5) * settings.lpi / effectivePpi;
        const phase = mod(lensPosition + settings.phase, 1);
        let imageIndex = Math.min(imageCount - 1, Math.floor(phase * imageCount));
        if (settings.reverseOrder) imageIndex = imageCount - 1 - imageIndex;
        map[axis] = imageIndex;
      }
      return map;
    }

    function addMappedRunsToPath(
      targetCtx,
      axisMap,
      imageIndex,
      vertical,
      xStart,
      xEnd,
      yStart,
      yEnd
    ) {
      const axisStart = vertical ? xStart : yStart;
      const axisEnd = vertical ? xEnd : yEnd;
      let start = -1;

      for (let axis = axisStart; axis <= axisEnd; axis++) {
        const matches = axis < axisEnd && axisMap[axis] === imageIndex;

        if (matches && start < 0) {
          start = axis;
        } else if (!matches && start >= 0) {
          const runLength = axis - start;
          if (vertical) {
            targetCtx.rect(start, yStart, runLength, yEnd - yStart);
          } else {
            targetCtx.rect(xStart, start, xEnd - xStart, runLength);
          }
          start = -1;
        }
      }
    }

    function renderInterlacedCanvas(targetCanvas, settings, scale = 1) {
      if (state.images.length < 2) {
        throw new Error("画像を2枚以上読み込んでください。");
      }
      if (state.images.length > MAX_IMAGES) {
        throw new Error(`画像は最大${MAX_IMAGES}枚です。`);
      }

      const { width, height } = getOutputDimensions(settings, scale);
      const effectivePpi = settings.ppi * scale;
      const ctx = prepareCanvas(targetCanvas, width, height);
      ctx.imageSmoothingEnabled = false;

      const count = state.images.length;
      const vertical = settings.lensDirection === "vertical";
      const axisLength = vertical ? width : height;
      const axisMap = createAxisImageMap(axisLength, settings, effectivePpi, count);
      const imageTransforms = getImageTransforms(settings, width, height);

      // 画像ごとの縞領域をクリップし、元画像を1回だけ描画する。
      // 出力Canvas以外の巨大なCanvasやImageDataを保持しない。
      state.images.forEach((item, imageIndex) => {
        ctx.save();
        ctx.beginPath();
        addMappedRunsToPath(ctx, axisMap, imageIndex, vertical, 0, width, 0, height);
        ctx.clip();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.filter = `brightness(${settings.brightness / 100})`;
        drawTransformedImage(ctx, item.image, imageTransforms[imageIndex]);
        ctx.restore();
      });

      if (settings.registrationMarks) {
        drawRegistrationMarks(ctx, width, height, effectivePpi, settings.lpi, axisMap, vertical, count);
      }

      return { width, height };
    }

    function getPitchTestValues() {
      const center = Number(els.testCenter.value);
      const range = Number(els.testRange.value);
      const step = Number(els.testStep.value);

      if (![center, range, step].every(Number.isFinite) || center <= 0 || range < 0 || step <= 0) {
        throw new Error("ピッチテスト設定を確認してください。");
      }

      const values = [];
      for (let value = center - range; value <= center + range + step * 0.1; value += step) {
        values.push(Number(value.toFixed(6)));
      }
      if (values.length > MAX_PITCH_VALUES) {
        throw new Error("ピッチテストの候補数が多すぎます。範囲か刻みを調整してください。");
      }
      return values;
    }

    function drawPitchStripes(ctx, lpi, effectivePpi, vertical, xStart, xEnd, yStart, yEnd) {
      const axisStart = vertical ? xStart : yStart;
      const axisEnd = vertical ? xEnd : yEnd;
      ctx.fillStyle = "black";

      for (let axis = axisStart; axis < axisEnd; axis++) {
        if (mod((axis - axisStart) * lpi / effectivePpi, 1) >= 0.5) continue;

        const remaining = Math.min(1, axisEnd - axis);
        if (vertical) {
          ctx.fillRect(axis, yStart, remaining, yEnd - yStart);
        } else {
          ctx.fillRect(xStart, axis, xEnd - xStart, remaining);
        }
      }
    }

    function drawPitchBand(ctx, lpi, effectivePpi, vertical, xStart, xEnd, yStart, yEnd) {
      drawPitchStripes(ctx, lpi, effectivePpi, vertical, xStart, xEnd, yStart, yEnd);
      ctx.strokeStyle = "#888";
      ctx.strokeRect(xStart, yStart, xEnd - xStart, yEnd - yStart);
    }

    function getPitchBandLayout(length, margin, count, effectivePpi) {
      const usableLength = Math.max(1, length - margin * 2);
      const desiredGap = Math.max(4, Math.round(effectivePpi * 0.04));
      const gapRoom = Math.max(0, usableLength - count);
      const gap = count > 1
        ? Math.min(desiredGap, gapRoom / (count - 1), usableLength / count * 0.2)
        : 0;
      return {
        gap,
        bandSize: (usableLength - gap * (count - 1)) / count
      };
    }

    function setPitchLabelFont(ctx, labels, desiredSize, maxWidth, maxHeight) {
      let fontSize = Math.max(1, Math.min(desiredSize, maxHeight));
      ctx.font = `${fontSize}px sans-serif`;
      const measuredWidth = Math.max(...labels.map((label) => ctx.measureText(label).width));
      if (measuredWidth > maxWidth) {
        fontSize = Math.max(1, fontSize * maxWidth / measuredWidth);
        ctx.font = `${fontSize}px sans-serif`;
      }
      return {
        fontSize,
        labelWidth: Math.max(...labels.map((label) => ctx.measureText(label).width))
      };
    }

    function drawVerticalPitchTest(ctx, values, labels, width, height, effectivePpi, margin) {
      const { gap, bandSize: bandHeight } = getPitchBandLayout(
        height,
        margin,
        values.length,
        effectivePpi
      );
      const desiredFontSize = Math.max(11, Math.round(effectivePpi * 0.08));
      const { labelWidth } = setPitchLabelFont(
        ctx,
        labels,
        desiredFontSize,
        Math.max(1, (width - margin * 2) * 0.35),
        bandHeight * 0.7
      );
      ctx.textAlign = "start";
      ctx.textBaseline = "middle";

      const desiredStripeGap = Math.max(6, Math.round(effectivePpi * 0.04));
      const stripeGap = Math.min(desiredStripeGap, Math.max(1, (width - margin * 2) * 0.03));
      const xEnd = width - margin;
      const xStart = Math.max(0, Math.min(xEnd - 1, margin + labelWidth + stripeGap));

      values.forEach((lpi, index) => {
        const yStart = margin + index * (bandHeight + gap);
        const yEnd = Math.min(height - margin, yStart + bandHeight);

        ctx.fillStyle = "black";
        ctx.fillText(labels[index], margin, yStart + bandHeight / 2);
        drawPitchBand(ctx, lpi, effectivePpi, true, xStart, xEnd, yStart, yEnd);
      });
    }

    function drawHorizontalPitchTest(ctx, values, labels, width, height, effectivePpi, margin) {
      const { gap, bandSize: bandWidth } = getPitchBandLayout(
        width,
        margin,
        values.length,
        effectivePpi
      );
      const desiredFontSize = Math.max(11, Math.round(effectivePpi * 0.08));
      const { fontSize } = setPitchLabelFont(
        ctx,
        labels,
        desiredFontSize,
        bandWidth * 0.86,
        Math.max(1, height * 0.08)
      );
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      const labelGap = Math.max(2, Math.round(effectivePpi * 0.02));
      const yStart = Math.min(height - margin - 1, margin + fontSize + labelGap);
      const yEnd = height - margin;

      values.forEach((lpi, index) => {
        const xStart = margin + index * (bandWidth + gap);
        const xEnd = Math.min(width - margin, xStart + bandWidth);

        ctx.fillStyle = "black";
        ctx.fillText(labels[index], xStart + bandWidth / 2, margin);
        drawPitchBand(ctx, lpi, effectivePpi, false, xStart, xEnd, yStart, yEnd);
      });
    }

    function renderPitchTestCanvas(targetCanvas, settings, scale = 1) {
      const values = getPitchTestValues();

      const { width, height } = getOutputDimensions(settings, scale);
      const effectivePpi = settings.ppi * scale;
      const ctx = prepareCanvas(targetCanvas, width, height);

      const desiredMargin = Math.max(8, Math.round(effectivePpi * 0.12));
      const margin = Math.min(desiredMargin, Math.floor(Math.min(width, height) / 20));
      const vertical = settings.lensDirection === "vertical";
      const labels = values.map((lpi) => lpi.toFixed(3));
      if (vertical) {
        drawVerticalPitchTest(ctx, values, labels, width, height, effectivePpi, margin);
      } else {
        drawHorizontalPitchTest(ctx, values, labels, width, height, effectivePpi, margin);
      }

      return { width, height, values };
    }

    function renderCanvas(targetCanvas, settings, mode, scale = 1) {
      return mode === "pitch"
        ? renderPitchTestCanvas(targetCanvas, settings, scale)
        : renderInterlacedCanvas(targetCanvas, settings, scale);
    }

    async function generatePreview(mode = "interlace") {
      return runBusyTask(
        mode === "pitch" ? "ピッチテストを生成中…" : "プレビューを生成中…",
        "生成できませんでした。",
        () => {
          const settings = getSettings();
          const scale = mode === "pitch"
            ? settings.previewScale
            : getInterlacePreviewScale(settings);
          const result = renderCanvas(els.previewCanvas, settings, mode, scale);
          state.lastRenderMode = mode;

          if (mode === "pitch") {
            updateStatus(
              `ピッチテスト ${result.width} × ${result.height}px`,
              `${result.values.length}候補。プレビュー倍率 ${Math.round(scale * 100)}%。`
            );
          } else {
            const full = getOutputDimensions(settings, 1);
            const pixelsPerLens = settings.ppi / settings.lpi;
            updateStatus(
              `プレビュー ${result.width} × ${result.height}px`,
              `実寸 ${full.width} × ${full.height}px／内部倍率 ${Math.round(scale * 100)}%／明るさ ${settings.brightness}%／${settings.lpi.toFixed(3)} LPI／1レンズ ${pixelsPerLens.toFixed(4)}px／画像 ${state.images.length}枚`
            );
          }
        }
      );
    }

    function canvasToPngBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => blob ? resolve(blob) : reject(new Error("PNG変換に失敗しました。")),
          "image/png"
        );
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function exportPng() {
      return runBusyTask("実寸PNGを生成中…", "書き出しできませんでした。", async () => {
        const settings = getSettings();
        const exportCanvas = document.createElement("canvas");
        const mode = state.lastRenderMode;
        const result = renderCanvas(exportCanvas, settings, mode);
        const filename = mode === "pitch"
          ? `pitch-test_${Number(els.testCenter.value).toFixed(3)}LPI_${settings.ppi}PPI.png`
          : `lenticular_${settings.lpi.toFixed(3)}LPI_${settings.ppi}PPI_${result.width}x${result.height}.png`;
        const blob = await canvasToPngBlob(exportCanvas);
        downloadBlob(blob, filename);

        updateStatus(`書き出し完了 ${result.width} × ${result.height}px`, filename);
      });
    }

    let previewTimer = null;
    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        if (state.images.length >= 2 && state.lastRenderMode === "interlace") {
          generatePreview("interlace");
        }
      }, PREVIEW_DELAY_MS);
    }

    els.fileInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const remaining = MAX_IMAGES - state.images.length;
      if (remaining <= 0) {
        updateStatus(`画像は最大${MAX_IMAGES}枚です。`, "既存画像を削除してから追加してください。");
        event.target.value = "";
        return;
      }

      setBusy(true, "画像を読み込み中…");
      try {
        const selected = files.slice(0, remaining);
        const loaded = await loadImageFiles(selected);
        state.images.push(...loaded);
        renderImageList();
        state.lastRenderMode = "interlace";
        if (state.images.length >= 2) await generatePreview("interlace");
        else updateStatus("もう1枚追加してください。", `現在 ${state.images.length}枚。`);
      } catch (error) {
        console.error(error);
        updateStatus("画像を読み込めませんでした。", error.message);
      } finally {
        setBusy(false);
        event.target.value = "";
      }
    });

    els.reverseImages.addEventListener("click", () => {
      state.images.reverse();
      renderImageList();
      schedulePreview();
    });
    els.clearImages.addEventListener("click", clearImages);
    els.paperPreset.addEventListener("change", applyPaperPreset);
    els.orientation.addEventListener("change", applyOrientation);
    els.generatePreview.addEventListener("click", () => generatePreview("interlace"));
    els.generatePitchTest.addEventListener("click", () => generatePreview("pitch"));
    els.exportPng.addEventListener("click", exportPng);

    [
      els.paperWidth,
      els.paperHeight,
      els.ppi,
      els.fitMode,
      els.brightness,
      els.headAlignment,
      els.registrationMarks,
      els.lpi,
      els.lensDirection,
      els.phase,
      els.previewScale,
      els.reverseOrder
    ].forEach((element) => element.addEventListener("change", schedulePreview));

    applyPaperPreset();
    clearCanvas();
  </script>
</body>

</html>
