<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correlation of Movements</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --panel-bg: #1b2026e0;
            --accent: #42d392;
        }

        body {
            margin: 0;
            height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #f0f0f0;
            color: #f4f7fb;
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        main {
            position: relative;
            width: min(100dvw, 900px);
            height: 100dvh;
            display: grid;
            grid-template-rows: minmax(260px, 48dvh) minmax(0, 1fr);
            overflow: hidden;
            background: #111;
        }

        .media-stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        .media-view {
            position: absolute;
            inset-block: 0;
            left: 50%;
            height: 100%;
            aspect-ratio: 3 / 4;
            max-width: 100%;
            overflow: hidden;
            transform: translateX(-50%);
        }

        .media-view video,
        .media-view img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        video {
            transform: scaleX(-1);
        }

        video[hidden],
        img[hidden] {
            display: none;
        }

        main.file-source .media-view video,
        main.file-source .media-view img {
            object-fit: contain;
            transform: none;
        }

        .panel,
        .blendshape-panel,
        .source-controls button,
        .source-controls label {
            background: var(--panel-bg);
            color: #f4f7fb;
        }

        .panel,
        .blendshape-panel {
            position: absolute;
            width: max-content;
            padding: 7px;
            border-radius: 8px;
        }

        .panel {
            left: 8px;
            top: 96px;
            max-width: min(220px, max(110px, calc(50% - 142px)));
        }

        .blendshape-panel {
            right: 8px;
            top: 8px;
            max-width: min(260px, max(120px, calc(50% - 142px)));
            max-height: 45dvh;
            overflow: auto;
        }

        .heatmap-panel {
            width: 100%;
            min-height: 0;
            box-sizing: border-box;
            padding: 7px;
            border-radius: 0;
            background: var(--panel-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heatmap-panel canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #status {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
        }

        #dominant {
            margin-bottom: 6px;
            font-size: 16px;
            font-weight: 700;
        }

        .bar-row {
            display: grid;
            grid-template-columns: var(--label-width, max-content) 48px 24px;
            gap: 5px;
            align-items: center;
            margin: 4px 0;
            font-size: 10px;
        }

        .bar-row span:last-child {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .bar-row span:first-child {
            white-space: nowrap;
        }

        .bar {
            position: relative;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #101419;
        }

        .bar::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 50%;
            width: 1px;
            background: #6d7782;
        }

        .fill,
        .bar.negative .fill,
        .bar.calibrated.positive .fill {
            position: absolute;
        }

        .fill {
            inset-block: 0;
            display: block;
            width: 0;
            background: var(--accent);
            transition: width 120ms linear;
        }

        .bar.raw::before {
            display: none;
        }

        .bar.raw .fill,
        .bar.positive .fill {
            left: 0;
        }

        .bar.negative .fill {
            right: 50%;
            background: #d85b67;
        }

        .bar.calibrated.positive .fill {
            left: 50%;
        }

        button,
        .source-controls label {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .source-controls {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1;
            display: grid;
            gap: 8px;
        }

        .source-controls button,
        .source-controls label {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .source-controls input {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .blendshape-panel summary {
            cursor: pointer;
            font-size: 11px;
            color: #cbd5df;
        }

        .blendshape-actions {
            display: flex;
            gap: 6px;
            margin: 6px 0;
        }

        .blendshape-actions button {
            padding: 4px 6px;
            border-radius: 6px;
            background: #101419;
            color: #f4f7fb;
            font-size: 10px;
        }

        .blendshape-actions button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .heatmap-toolbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 10px;
        }

        .heatmap-toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #cbd5df;
            white-space: nowrap;
        }

        .heatmap-toolbar input {
            accent-color: var(--accent);
        }
    </style>
</head>

<body>
    <main>
        <section class="media-stage">
            <div class="media-view">
                <video id="video" muted playsinline></video>
                <img id="image" alt="読み込んだ画像" hidden>
            </div>
            <div class="source-controls">
                <button id="cameraButton" type="button">WebCam</button>
                <label for="fileInput">ファイルから
                    <input id="fileInput" type="file"
                        accept="image/png,image/jpeg,image/jpg,video/mp4,video/quicktime,image/*,video/*">
                </label>
            </div>
            <aside class="panel">
                <span id="status">モデル読み込み中...</span>
                <div id="dominant">neutral</div>
                <div id="bars"></div>
            </aside>
            <details class="blendshape-panel" open>
                <summary>blendshape</summary>
                <div class="blendshape-actions">
                    <button id="calibrateButton" type="button">キャリブ</button>
                    <button id="clearCalibrationButton" type="button">解除</button>
                </div>
                <div id="blendshapes"></div>
            </details>
        </section>
        <section class="heatmap-panel">
            <div id="heatmapToolbar" class="heatmap-toolbar">
                <span id="heatmapStatus">キャリブ後の変動値を収集中...</span>
                <label for="heatmapLabelToggle">
                    <input id="heatmapLabelToggle" type="checkbox">
                    翻訳
                </label>
            </div>
            <canvas id="heatmapCanvas"></canvas>
        </section>
    </main>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34";

        window.addEventListener("load", async () => {
            const MODEL_URL = "../modules/faceAPI/models";
            const EMOTIONS = ["neutral", "happy", "sad", "angry", "fearful", "disgusted", "surprised"];
            const BLENDSHAPE_HISTORY_LIMIT = 600;
            const STD_EPSILON = 0.0005;
            const TIE_EPSILON = 1e-12;
            const HEATMAP_RATIO = Math.min((window.devicePixelRatio || 1) * 3, 6);
            const [HEATMAP_WIDTH, HEATMAP_HEIGHT, HEATMAP_FONT] = [560, 420, "11px Yu Gothic, sans-serif"];
            const HEATMAP_MIN_FRAMES = 3;
            const VIDEO_ANALYSIS_RUNS = 3;
            const VIDEO_FILE_CALIBRATION_FRAMES = 3;
            const VIDEO_CALIBRATION_WARMUP_READS = 6;
            const [WARMUP_FRAMES, CALIBRATION_FRAMES, DEADZONE] = [20, 60, 0.005];
            const BLENDSHAPE_LABELS_JA = {
                _neutral: "ニュートラル",
                browDownLeft: "左眉下げ",
                browDownRight: "右眉下げ",
                browInnerUp: "眉内側上げ",
                browOuterUpLeft: "左眉外側上げ",
                browOuterUpRight: "右眉外側上げ",
                cheekPuff: "頬ふくらみ",
                cheekSquintLeft: "左頬上げ",
                cheekSquintRight: "右頬上げ",
                eyeBlinkLeft: "左まばたき",
                eyeBlinkRight: "右まばたき",
                eyeLookDownLeft: "左目下向き",
                eyeLookDownRight: "右目下向き",
                eyeLookInLeft: "左目内向き",
                eyeLookInRight: "右目内向き",
                eyeLookOutLeft: "左目外向き",
                eyeLookOutRight: "右目外向き",
                eyeLookUpLeft: "左目上向き",
                eyeLookUpRight: "右目上向き",
                eyeSquintLeft: "左目細め",
                eyeSquintRight: "右目細め",
                eyeWideLeft: "左目見開き",
                eyeWideRight: "右目見開き",
                jawForward: "あご前出し",
                jawLeft: "あご左",
                jawOpen: "口開き",
                jawRight: "あご右",
                mouthClose: "口閉じ",
                mouthDimpleLeft: "左えくぼ",
                mouthDimpleRight: "右えくぼ",
                mouthFrownLeft: "左口角下げ",
                mouthFrownRight: "右口角下げ",
                mouthFunnel: "口すぼめ縦",
                mouthLeft: "口左寄せ",
                mouthLowerDownLeft: "左下唇下げ",
                mouthLowerDownRight: "右下唇下げ",
                mouthPressLeft: "左唇押さえ",
                mouthPressRight: "右唇押さえ",
                mouthPucker: "口すぼめ",
                mouthRight: "口右寄せ",
                mouthRollLower: "下唇巻き込み",
                mouthRollUpper: "上唇巻き込み",
                mouthShrugLower: "下唇すくめ",
                mouthShrugUpper: "上唇すくめ",
                mouthSmileLeft: "左口角上げ",
                mouthSmileRight: "右口角上げ",
                mouthStretchLeft: "左口横伸ばし",
                mouthStretchRight: "右口横伸ばし",
                mouthUpperUpLeft: "左上唇上げ",
                mouthUpperUpRight: "右上唇上げ",
                noseSneerLeft: "左鼻しわ",
                noseSneerRight: "右鼻しわ",
                tongueOut: "舌出し"
            };
            const $ = (id) => document.getElementById(id);
            const clamp = (value) => Math.min(1, Math.max(0, Number(value || 0)));
            const clampRange = (value, min, max) => Math.min(max, Math.max(min, Number(value || 0)));
            const formatScore = (score) => (Math.trunc(score * 100) / 100).toFixed(2);
            const signedScore = (score) => `${score < 0 ? "" : "+"}${formatScore(score)}`;
            const displayBlendshapeName = (name) => heatmapLabelToggle.checked ? BLENDSHAPE_LABELS_JA[name] || name : name;
            const stage = document.querySelector("main");
            const heatmapPanel = document.querySelector(".heatmap-panel");
            const {
                video, image, cameraButton, fileInput, status, dominant, bars, blendshapes, calibrateButton,
                clearCalibrationButton, heatmapCanvas, heatmapStatus, heatmapToolbar, heatmapLabelToggle
            } = Object.fromEntries([
                "video", "image", "cameraButton", "fileInput", "status", "dominant", "bars", "blendshapes", "calibrateButton",
                "clearCalibrationButton", "heatmapCanvas", "heatmapStatus", "heatmapToolbar", "heatmapLabelToggle"
            ].map((id) => [id, $(id)]));
            const heatmapContext = heatmapCanvas.getContext("2d");
            const detectOptions = new faceapi.TinyFaceDetectorOptions();
            const base = new Map();
            const calibration = { warmup: 0, remaining: 0, samples: 0, stats: new Map() };
            let running = false;
            let detectToken = 0;
            let activeMedia = video;
            let activeMode = "camera";
            let activeObjectUrl = "";
            let faceLandmarker;
            let landmarkerMode = "VIDEO";
            let landmarkerTimestamp = 0;
            let blendshapeHistory = [];
            let videoRuns = [];
            let videoRunFrames = [];
            let lastVideoTime = 0;
            let waitingNextVideoRun = false;
            const rowKeys = new WeakMap();
            const rowControls = new WeakMap();

            const stopDetection = () => {
                running = false;
                detectToken += 1;
            };

            const stopCamera = () => {
                video.srcObject?.getTracks?.().forEach((track) => track.stop());
                video.srcObject = null;
            };

            const resetFile = () => {
                if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
                activeObjectUrl = "";
                [image, video].forEach((media) => media.removeAttribute("src"));
                video.load?.();
                fileInput.value = "";
            };

            const setActiveMedia = (media, mode) => {
                activeMedia = media;
                activeMode = mode;
                resetVideoRuns();
                stage.classList.toggle("file-source", mode !== "camera");
                [image.hidden, video.hidden] = [media !== image, media !== video];
                video.controls = mode === "video-file";
                video.loop = false;
            };

            const updateRows = (container, rows) => {
                const key = rows.map(({ name }) => name).join("|");
                if (key !== rowKeys.get(container)) {
                    rowKeys.set(container, key);
                    container.innerHTML = rows.map(({ name }) => `
                        <div class="bar-row">
                            <span>${name}</span>
                            <span class="bar"><span class="fill"></span></span>
                            <span class="value"></span>
                        </div>
                    `).join("");
                    rowControls.set(container, [...container.querySelectorAll(".bar-row")].map((row) => ({
                        bar: row.querySelector(".bar"),
                        fill: row.querySelector(".fill"),
                        value: row.querySelector(".value")
                    })));
                    const labels = [...container.querySelectorAll(".bar-row span:first-child")];
                    if (labels.length) {
                        const labelWidth = Math.ceil(Math.max(...labels.map((label) => label.scrollWidth)));
                        container.style.setProperty("--label-width", `${labelWidth}px`);
                    }
                }
                rowControls.get(container).forEach(({ bar, fill, value }, index) => {
                    const score = rows[index]?.score || 0;
                    const calibrated = rows[index]?.calibrated;
                    const width = calibrated ? Math.min(Math.abs(score) * 100, 50) : Math.min(score * 100, 100);
                    bar.className = `bar ${calibrated ? `calibrated ${score < 0 ? "negative" : "positive"}` : "raw"}`;
                    fill.style.width = `${width}%`;
                    value.textContent = calibrated ? signedScore(score) : formatScore(score);
                });
            };

            const renderExpressions = (expressions = {}) => {
                const scores = EMOTIONS.map((name) => ({ name, score: clamp(expressions[name]) }));
                const top = scores.reduce((best, item) => item.score > best.score ? item : best, scores[0]);
                dominant.textContent = top.name;
                updateRows(bars, scores);
            };

            const mean = (values) => values.reduce((sum, value) => sum + value, 0) / values.length;
            const std = (values, valueMean = mean(values)) => Math.sqrt(values.reduce((sum, value) => sum + (value - valueMean) ** 2, 0) / values.length);

            const pearson = (a, b) => {
                const meanA = mean(a);
                const meanB = mean(b);
                const stdA = std(a, meanA);
                const stdB = std(b, meanB);
                if (stdA < STD_EPSILON || stdB < STD_EPSILON) return NaN;
                const cov = a.reduce((sum, value, index) => sum + (value - meanA) * (b[index] - meanB), 0) / a.length;
                return clampRange(cov / (stdA * stdB), -1, 1);
            };

            const clusterOrder = (matrix, names) => {
                let clusters = matrix.map((_, index) => [index]);
                const distance = (a, b) => {
                    let total = 0;
                    let count = 0;
                    a.forEach((i) => b.forEach((j) => {
                        total += 1 - Math.abs(matrix[i][j]);
                        count++;
                    }));
                    return count ? total / count : 1;
                };

                while (clusters.length > 1) {
                    let best = { i: 0, j: 1, d: distance(clusters[0], clusters[1]) };
                    for (let i = 0; i < clusters.length; i++) {
                        for (let j = i + 1; j < clusters.length; j++) {
                            const d = distance(clusters[i], clusters[j]);
                            const key = (cluster) => cluster.map((index) => names[index]).join("|");
                            if (d < best.d - TIE_EPSILON || (Math.abs(d - best.d) <= TIE_EPSILON && `${key(clusters[i])}|${key(clusters[j])}` < `${key(clusters[best.i])}|${key(clusters[best.j])}`)) {
                                best = { i, j, d };
                            }
                        }
                    }
                    const merged = [...clusters[best.i], ...clusters[best.j]].sort((a, b) => names[a].localeCompare(names[b]));
                    clusters = clusters.filter((_, index) => index !== best.i && index !== best.j);
                    clusters.push(merged);
                }
                return clusters[0];
            };

            const colorForCorrelation = (value) => {
                const v = clampRange(value, -1, 1);
                const t = Math.abs(v);
                const end = v >= 0 ? [190, 38, 51] : [42, 96, 180];
                return `rgb(${end.map((channel) => Math.round(255 + (channel - 255) * t)).join(",")})`;
            };

            const resizeHeatmap = (width, height) => {
                const pixelWidth = Math.round(width * HEATMAP_RATIO);
                const pixelHeight = Math.round(height * HEATMAP_RATIO);
                if (heatmapCanvas.width !== pixelWidth || heatmapCanvas.height !== pixelHeight) {
                    heatmapCanvas.width = pixelWidth;
                    heatmapCanvas.height = pixelHeight;
                }
                const style = getComputedStyle(heatmapPanel);
                const maxWidth = heatmapPanel.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                const maxHeight = heatmapPanel.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom)
                    - heatmapToolbar.offsetHeight - parseFloat(getComputedStyle(heatmapToolbar).marginBottom);
                const scale = Math.max(0.01, Math.min(1, maxWidth / width, maxHeight / height));
                heatmapCanvas.style.width = `${Math.max(1, Math.floor(width * scale))}px`;
                heatmapCanvas.style.height = `${Math.max(1, Math.floor(height * scale))}px`;
                heatmapContext.setTransform(HEATMAP_RATIO, 0, 0, HEATMAP_RATIO, 0, 0);
            };

            const drawHeatmap = () => {
                const ctx = heatmapContext;
                resizeHeatmap(HEATMAP_WIDTH, HEATMAP_HEIGHT);
                ctx.clearRect(0, 0, HEATMAP_WIDTH, HEATMAP_HEIGHT);
                ctx.fillStyle = "#f4f7fb";
                ctx.fillRect(0, 0, HEATMAP_WIDTH, HEATMAP_HEIGHT);

                if (blendshapeHistory.length < HEATMAP_MIN_FRAMES) {
                    heatmapStatus.textContent = `変動値を収集中... ${blendshapeHistory.length}/${HEATMAP_MIN_FRAMES}`;
                    return;
                }

                const names = Object.keys(blendshapeHistory.at(-1) || {});
                const columns = names.map((name) => blendshapeHistory.map((frame) => Number(frame[name] || 0)));
                const variable = columns.map((values, index) => ({ index, std: std(values) })).filter(({ std }) => std >= STD_EPSILON);
                if (variable.length < 2) {
                    heatmapStatus.textContent = "相関に十分な変動がありません";
                    return;
                }

                const keptNames = variable.map(({ index }) => names[index]);
                const keptColumns = variable.map(({ index }) => columns[index]);
                const matrix = keptColumns.map((a) => keptColumns.map((b) => pearson(a, b)));
                const order = clusterOrder(matrix, keptNames);
                const orderedNames = order.map((index) => keptNames[index]);
                const orderedLabels = orderedNames.map(displayBlendshapeName);
                const orderedMatrix = order.map((i) => order.map((j) => matrix[i][j]));
                const n = orderedNames.length;
                const cell = Math.max(12, Math.min(24, Math.floor(520 / n)));
                ctx.font = HEATMAP_FONT;
                const longestLabel = Math.ceil(Math.max(...orderedLabels.map((label) => ctx.measureText(label).width)));
                const labelWidth = Math.min(220, Math.max(136, longestLabel + 14));
                const size = cell * n;
                const colorbarWidth = 98;
                const bottomLabelHeight = longestLabel + 18;
                const blockWidth = labelWidth + size + colorbarWidth;
                const blockHeight = Math.max(size + bottomLabelHeight, Math.max(120, size));
                const canvasWidth = Math.max(820, blockWidth + 32);
                const canvasHeight = Math.max(540, blockHeight + 32);
                resizeHeatmap(canvasWidth, canvasHeight);
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = "#f4f7fb";
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                heatmapStatus.textContent = `${blendshapeHistory.length} frames / ${n} variables / excluded ${names.length - n}`;
                const left = (canvasWidth - blockWidth) / 2 + labelWidth;
                const top = (canvasHeight - blockHeight) / 2;

                orderedMatrix.forEach((row, y) => row.forEach((value, x) => {
                    ctx.fillStyle = x === y ? "#f4f7fb" : colorForCorrelation(value);
                    ctx.fillRect(left + x * cell, top + y * cell, cell, cell);
                    if (x === y) {
                        ctx.strokeStyle = "#6d7782";
                        ctx.beginPath();
                        ctx.moveTo(left + x * cell, top + y * cell);
                        ctx.lineTo(left + (x + 1) * cell, top + (y + 1) * cell);
                        ctx.stroke();
                    }
                }));
                ctx.font = `${Math.max(5, Math.min(8, cell * 0.34))}px Yu Gothic, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                orderedMatrix.forEach((row, y) => row.forEach((value, x) => {
                    if (x === y) return;
                    ctx.fillStyle = Math.abs(value) > 0.65 ? "#f4f7fb" : "#1b2026";
                    ctx.fillText(value.toFixed(2), left + x * cell + cell / 2, top + y * cell + cell / 2);
                }));
                ctx.strokeStyle = "#d0d6de";
                ctx.strokeRect(left, top, size, size);

                ctx.fillStyle = "#1b2026";
                ctx.font = HEATMAP_FONT;
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                orderedLabels.forEach((label, index) => {
                    const y = top + index * cell + cell / 2;
                    ctx.fillText(label, left - 6, y);
                });
                orderedLabels.forEach((label, index) => {
                    ctx.save();
                    ctx.translate(left + index * cell + cell / 2, top + size + 6);
                    ctx.rotate(Math.PI / 2);
                    ctx.textAlign = "left";
                    ctx.textBaseline = "middle";
                    ctx.fillText(label, 0, 0);
                    ctx.restore();
                });

                const barX = left + size + 24;
                const barY = top;
                const barH = Math.max(120, size);
                for (let y = 0; y < barH; y++) {
                    const value = 1 - (y / (barH - 1)) * 2;
                    ctx.fillStyle = colorForCorrelation(value);
                    ctx.fillRect(barX, barY + y, 16, 1);
                }
                ctx.strokeStyle = "#4d5662";
                ctx.strokeRect(barX, barY, 16, barH);
                ctx.fillStyle = "#1b2026";
                ctx.font = HEATMAP_FONT;
                ctx.textAlign = "left";
                [-1, 0, 1].forEach((value) => {
                    const y = barY + (1 - value) / 2 * barH;
                    ctx.fillText(value.toFixed(1), barX + 22, y);
                });
            };

            const recordBlendshapeFrame = (rows) => {
                if (!base.size || !rows.length) return;
                if (activeMode === "video-file") {
                    if (waitingNextVideoRun || videoRunsComplete()) return;
                    const time = video.currentTime;
                    if (time + 0.05 < lastVideoTime) {
                        finishVideoRun();
                        lastVideoTime = 0;
                        if (videoRunsComplete()) {
                            drawHeatmap();
                            return;
                        }
                    }
                    videoRunFrames.push(blendshapeFrame(rows));
                    lastVideoTime = time;
                    heatmapStatus.textContent = `動画記録中... ${videoRuns.length + 1}/${VIDEO_ANALYSIS_RUNS}回`;
                    if (Number.isFinite(video.duration) && time >= video.duration - 0.05) finishVideoRun();
                    if (videoRunsComplete()) drawHeatmap();
                    return;
                }
                blendshapeHistory.push(blendshapeFrame(rows));
                blendshapeHistory = blendshapeHistory.slice(-BLENDSHAPE_HISTORY_LIMIT);
                drawHeatmap();
            };

            const blendshapeFrame = (rows) => Object.fromEntries(rows.map(({ name, score }) => [name, score]));

            const averageFrames = (runs, index) => {
                const totals = new Map();
                const counts = new Map();
                runs.forEach((frames) => Object.entries(frames[index] || {}).forEach(([name, score]) => {
                    totals.set(name, (totals.get(name) || 0) + score);
                    counts.set(name, (counts.get(name) || 0) + 1);
                }));
                return Object.fromEntries([...totals].map(([name, total]) => [name, total / counts.get(name)]));
            };

            const resetVideoRuns = () => {
                videoRuns = [];
                videoRunFrames = [];
                lastVideoTime = 0;
                waitingNextVideoRun = false;
            };

            const videoRunsComplete = () => videoRuns.length >= VIDEO_ANALYSIS_RUNS;

            const finishVideoRun = () => {
                if (videoRunsComplete() || !videoRunFrames.length) return;
                videoRuns.push(videoRunFrames);
                videoRunFrames = [];
                waitingNextVideoRun = true;
                if (videoRuns.length < VIDEO_ANALYSIS_RUNS) {
                    heatmapStatus.textContent = `動画記録済み... ${videoRuns.length}/${VIDEO_ANALYSIS_RUNS}回`;
                    return;
                }
                const frameCount = Math.min(BLENDSHAPE_HISTORY_LIMIT, Math.min(...videoRuns.map((frames) => frames.length)));
                blendshapeHistory = Array.from({ length: frameCount }, (_, index) => averageFrames(videoRuns, index));
                status.textContent = `動画解析済み (${blendshapeHistory.length} frames x ${VIDEO_ANALYSIS_RUNS} runs)`;
            };

            const playNextVideoRun = async () => {
                if (activeMode !== "video-file" || videoRunsComplete()) return;
                stopDetection();
                lastVideoTime = 0;
                await seekVideo(0);
                waitingNextVideoRun = false;
                status.textContent = `動画記録済み... ${videoRuns.length}/${VIDEO_ANALYSIS_RUNS}回`;
                try {
                    await video.play();
                } catch (error) {
                    status.textContent = "再生すると次の動画記録を開始します";
                }
            };

            const calibrationActive = () => calibration.warmup || calibration.remaining;

            const resetCalibration = ({ warmup = 0, frames = 0 } = {}) => {
                base.clear();
                Object.assign(calibration, { warmup, remaining: frames, samples: 0 });
                calibration.stats.clear();
                blendshapeHistory = [];
                resetVideoRuns();
                drawHeatmap();
                calibrateButton.disabled = false;
            };

            const accumulateCategoryStats = (stats, rows) => {
                rows.forEach(({ name, score }) => {
                    const stat = stats.get(name) || { sum: 0, sq: 0 };
                    stat.sum += score;
                    stat.sq += score * score;
                    stats.set(name, stat);
                });
            };

            const writeCalibrationBase = ({ fixedDeadzone = false } = {}) => {
                if (!calibration.samples) return;
                base.clear();
                calibration.stats.forEach(({ sum, sq }, name) => {
                    const mean = sum / calibration.samples;
                    const variance = Math.max(sq / calibration.samples - mean * mean, 0);
                    base.set(name, { mean, dead: fixedDeadzone ? DEADZONE : Math.max(Math.sqrt(variance) * 3, DEADZONE) });
                });
            };

            const updateCalibration = (rows) => {
                if (!calibrationActive()) return false;
                if (calibration.warmup) {
                    status.textContent = `準備中 ${--calibration.warmup}`;
                    return true;
                }
                if (!rows.length) {
                    status.textContent = "顔を検出中です...";
                    return true;
                }
                accumulateCategoryStats(calibration.stats, rows);
                calibration.samples++;
                status.textContent = `キャリブレーション中 ${--calibration.remaining}`;
                if (calibration.remaining) return true;
                writeCalibrationBase();
                calibrateButton.disabled = false;
                status.textContent = `キャリブ済み (${calibration.samples} frames)`;
                return true;
            };

            const calibratedScore = (name, score) => {
                const { mean = 0, dead = 0 } = base.get(name) || {};
                const min = mean - dead;
                const max = mean + dead;
                if (score >= min - dead && score <= max + dead) return 0;
                return score < mean ? score - (min - dead) : score - (max + dead);
            };

            const nextLandmarkerTimestamp = () => landmarkerTimestamp += 34;

            const readBlendshapes = async () => {
                const mode = activeMode === "image-file" ? "IMAGE" : "VIDEO";
                if (landmarkerMode !== mode) {
                    await faceLandmarker.setOptions({ runningMode: mode });
                    landmarkerMode = mode;
                }
                const result = mode === "IMAGE"
                    ? faceLandmarker.detect(activeMedia)
                    : faceLandmarker.detectForVideo(activeMedia, nextLandmarkerTimestamp());
                return (result.faceBlendshapes[0]?.categories || [])
                    .map(({ categoryName, score }) => ({ name: categoryName, score: clamp(score) }));
            };

            const renderBlendshapes = (rows) => {
                const displayRows = base.size
                    ? rows.map(({ name, score }) => ({ name, score: calibratedScore(name, score), calibrated: true }))
                    : rows;
                updateRows(blendshapes, displayRows);
                return displayRows;
            };

            const detectBlendshapes = async () => {
                const rows = await readBlendshapes();
                const statusLocked = updateCalibration(rows);
                const displayRows = renderBlendshapes(rows);
                recordBlendshapeFrame(displayRows);
                return statusLocked;
            };

            const calibrateCurrentFrame = async (frames = VIDEO_FILE_CALIBRATION_FRAMES, startTime = null) => {
                if (startTime !== null) {
                    stopDetection();
                    video.pause();
                    await seekVideo(startTime);
                    await waitForStableFrame(video);
                    await calibrateBlendshapesAtCurrentFrame(frames);
                    return;
                }
                resetCalibration({ frames });
                calibrateButton.disabled = true;
                for (let i = 0; i < frames; i++) await detectOnce();
                await detectOnce();
            };

            const seekVideo = (time) => new Promise((resolve, reject) => {
                if (Math.abs(video.currentTime - time) < 0.001) {
                    requestAnimationFrame(resolve);
                    return;
                }
                video.addEventListener("seeked", resolve, { once: true });
                video.addEventListener("error", () => reject(new Error("動画シークに失敗しました")), { once: true });
                video.currentTime = time;
            });

            const detectOnce = async () => {
                const result = await faceapi.detectSingleFace(activeMedia, detectOptions).withFaceExpressions();
                const expressions = result?.expressions || {};
                const statusLocked = await detectBlendshapes();
                renderExpressions(expressions);
                if (!statusLocked) status.textContent = result ? "検出中" : "顔が見つかりません";
            };

            const detect = async (token = detectToken) => {
                if (!running || token !== detectToken) return;
                try {
                    await detectOnce();
                } catch (error) {
                    status.textContent = `推定エラー: ${error.message}`;
                }
                if (running && token === detectToken) requestAnimationFrame(() => detect(token));
            };

            const loadMedia = (media, src, eventName) => new Promise((resolve, reject) => {
                media.addEventListener(eventName, resolve, { once: true });
                media.addEventListener("error", () => reject(new Error("ファイルを読み込めません")), { once: true });
                media.src = src;
                media.load?.();
            });

            const waitForMediaFrame = (media) => media.readyState >= 2
                ? Promise.resolve()
                : new Promise((resolve, reject) => {
                    media.addEventListener("loadeddata", resolve, { once: true });
                    media.addEventListener("error", () => reject(new Error("動画フレームを読み込めません")), { once: true });
                });

            const waitForStableFrame = async (media) => {
                await waitForMediaFrame(media);
                await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            };

            const calibrateBlendshapesAtCurrentFrame = async (frames) => {
                resetCalibration();
                calibrateButton.disabled = true;
                for (let i = 0; i < VIDEO_CALIBRATION_WARMUP_READS; i++) {
                    await readBlendshapes();
                    await waitForStableFrame(activeMedia);
                }
                for (let i = 0; i < frames; i++) {
                    const rows = await readBlendshapes();
                    if (rows.length) {
                        accumulateCategoryStats(calibration.stats, rows);
                        calibration.samples++;
                        status.textContent = `キャリブレーション中 ${frames - i - 1}`;
                    }
                    await waitForStableFrame(activeMedia);
                }
                writeCalibrationBase({ fixedDeadzone: true });
                renderBlendshapes(await readBlendshapes());
                calibrateButton.disabled = false;
                status.textContent = calibration.samples ? `キャリブ済み (${calibration.samples} frames)` : "顔を検出できません";
            };

            const startDetection = () => {
                running = true;
                status.textContent = "検出開始";
                detect(detectToken);
            };

            const startCamera = async () => {
                stopDetection();
                stopCamera();
                resetFile();
                status.textContent = "カメラ起動中...";

                try {
                    video.srcObject = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    setActiveMedia(video, "camera");
                    await video.play();
                    startDetection();
                } catch (error) {
                    status.textContent = `カメラを開始できません: ${error.message}`;
                }
            };

            const importFile = async (file) => {
                if (!file) return;
                stopDetection();
                stopCamera();
                resetFile();
                activeObjectUrl = URL.createObjectURL(file);

                const isImage = file.type.startsWith("image/");
                const isVideo = file.type.startsWith("video/");
                if (!isImage && !isVideo) {
                    resetFile();
                    status.textContent = "画像または動画ファイルを選択してください";
                    return;
                }

                const media = isImage ? image : video;
                status.textContent = `${isImage ? "画像" : "動画"}ファイル読み込み中...`;
                await loadMedia(media, activeObjectUrl, isImage ? "load" : "loadedmetadata");
                setActiveMedia(media, isImage ? "image-file" : "video-file");

                if (isImage) {
                    await detectOnce();
                } else {
                    await waitForMediaFrame(video);
                    await seekVideo(0);
                    video.pause();
                    blendshapeHistory = [];
                    drawHeatmap();
                    status.textContent = "動画を再生すると検出を開始します";
                }
            };

            cameraButton.addEventListener("click", startCamera);
            calibrateButton.addEventListener("click", () => {
                const videoFile = activeMode === "video-file";
                const frames = activeMode === "image-file" ? 1 : videoFile ? VIDEO_FILE_CALIBRATION_FRAMES : CALIBRATION_FRAMES;
                if (activeMode !== "camera" && (video.paused || videoFile)) {
                    calibrateCurrentFrame(frames, videoFile ? 0 : null).catch((error) => {
                        calibrateButton.disabled = false;
                        status.textContent = `キャリブレーション失敗: ${error.message}`;
                    });
                } else {
                    resetCalibration({ warmup: WARMUP_FRAMES, frames });
                    calibrateButton.disabled = true;
                }
            });
            clearCalibrationButton.addEventListener("click", () => {
                resetCalibration();
                status.textContent = "キャリブ解除";
                if (activeMode === "image-file") {
                    detectOnce().catch((error) => {
                        status.textContent = `解除後の再検出失敗: ${error.message}`;
                    });
                }
            });
            fileInput.addEventListener("change", (event) => {
                importFile(event.target.files[0]).catch((error) => {
                    status.textContent = `ファイルを読み込めません: ${error.message}`;
                });
            });
            video.addEventListener("play", () => {
                if (activeMode === "video-file" && !running) {
                    detectToken += 1;
                    startDetection();
                }
            });
            video.addEventListener("pause", () => activeMode === "video-file" && stopDetection());
            video.addEventListener("ended", () => {
                if (activeMode !== "video-file") return;
                finishVideoRun();
                if (videoRunsComplete()) {
                    drawHeatmap();
                    return;
                }
                playNextVideoRun().catch((error) => {
                    status.textContent = `次の動画記録を開始できません: ${error.message}`;
                });
            });
            heatmapLabelToggle.addEventListener("change", drawHeatmap);
            window.addEventListener("resize", drawHeatmap);
            renderExpressions();
            updateRows(blendshapes, []);
            drawHeatmap();

            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
                    },
                    runningMode: landmarkerMode,
                    outputFaceBlendshapes: true
                });
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                await startCamera();
            } catch (error) {
                status.textContent = `モデルを読み込めません: ${error.message}`;
            }
        });
    </script>
</body>

</html>
