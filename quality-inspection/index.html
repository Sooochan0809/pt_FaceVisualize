<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>品質比較</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --bg: #f1f3f5;
            --panel: #fff;
            --ink: #1b2026;
            --muted: #69717b;
            --line: #d9dde2;
            --accent: #42d392;
            --orange: #ef7f45;
            --blue: #3478d4;
            --purple: #8b6fc0;
            --danger: #c64b4b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button,
        .fileButton {
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .fileButton {
            position: relative;
            display: inline-flex;
            align-items: center;
            overflow: hidden;
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }

        .fileButton input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #10231b;
        }

        .app {
            width: min(1500px, 100%);
            margin: auto;
            padding: 18px;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        .panel {
            min-width: 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--panel);
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) repeat(2, minmax(130px, auto));
            gap: 12px;
            align-items: end;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .field {
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: .72rem;
        }

        select,
        input[type="number"] {
            height: 38px;
            min-width: 0;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
        }

        .statusLine {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 11px;
            color: var(--muted);
            font-size: .75rem;
        }

        #status {
            flex: 1;
        }

        progress {
            width: min(420px, 45%);
            height: 7px;
            accent-color: var(--accent);
        }

        progress[hidden] {
            display: none;
        }

        .error {
            color: var(--danger) !important;
        }

        .tableWrap {
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .76rem;
            font-variant-numeric: tabular-nums;
        }

        th,
        td {
            padding: 10px 9px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            font-size: .66rem;
            font-weight: 600;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover,
        tbody tr.selected {
            background: #f3fbf7;
        }

        .name {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score {
            display: inline-flex;
            min-width: 42px;
            justify-content: center;
            padding: 3px 7px;
            border-radius: 999px;
            background: #edf1f4;
        }

        .score.good {
            background: #ddf7eb;
            color: #176543;
        }

        .score.warn {
            background: #fff0db;
            color: #8a5214;
        }

        .score.bad {
            background: #fde6e6;
            color: #963939;
        }

        td small {
            color: var(--muted);
            font-size: .62rem;
        }

        .empty {
            padding: 36px 12px;
            color: var(--muted);
            text-align: center;
        }

        .detail {
            display: grid;
            grid-template-columns: minmax(280px, .75fr) minmax(0, 1.6fr);
            gap: 14px;
            margin-top: 14px;
        }

        .videoShell {
            min-height: 230px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 8px;
            background: #171a1e;
        }

        video {
            display: block;
            width: 100%;
            max-height: 390px;
        }

        .detailTitle {
            margin: 0 0 10px;
            font-size: .9rem;
        }

        .chartWrap {
            height: 280px;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 9px;
            color: var(--muted);
            font-size: .68rem;
        }

        .legend i {
            display: inline-block;
            width: 16px;
            height: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .phaseLog {
            margin-top: 9px;
            color: var(--muted);
            font: .67rem/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 900px) {

            .controls,
            .detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <div>
                <h1>品質比較</h1>
            </div>
        </header>

        <section class="panel">
            <div class="controls">
                <div class="actions">
                    <label class="fileButton">WebMを追加<input id="fileInput" type="file" accept="video/webm,.webm"
                            multiple></label>
                    <button id="analyzeButton" class="primary" type="button" disabled>すべて解析</button>
                    <button id="clearButton" type="button" disabled>クリア</button>
                </div>
                <label class="field">変化後の感情<select id="targetEmotion"></select></label>
                <label class="field">平滑化<select id="smoothWindow">
                        <option value="1">なし</option>
                        <option value="3">3フレーム</option>
                        <option value="5" selected>5フレーム</option>
                        <option value="7">7フレーム</option>
                        <option value="11">11フレーム</option>
                    </select></label>
            </div>
            <div class="statusLine">
                <span id="status">MediaPipe / Face APIモデルを読み込んでいます</span>
                <progress id="progress" value="0" max="1" hidden></progress>
            </div>
        </section>

        <section class="panel">
            <div class="tableWrap">
                <table>
                    <thead>
                        <tr>
                            <th>動画</th>
                            <th>検査フレーム</th>
                            <th>検出率</th>
                            <th>無表情</th>
                            <th>発生時間</th>
                            <th>継続時間</th>
                            <th>収束時間</th>
                            <th>周期安定性（6:1:4:3）</th>
                            <th>表情強度</th>
                            <th>継続安定性</th>
                            <th>発生／収束</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
                <div class="empty" id="emptyState">比較するWebMを追加してください</div>
            </div>
        </section>

        <section class="detail" id="detail" hidden>
            <section class="panel">
                <h2 class="detailTitle" id="detailName"></h2>
                <div class="videoShell"><video id="preview" controls muted playsinline></video></div>
            </section>
            <section class="panel">
                <h2 class="detailTitle">表情の推移</h2>
                <div class="chartWrap"><canvas id="chart"></canvas></div>
                <div class="legend">
                    <span><i style="background:#e2e5e9"></i>無表情</span><span><i
                            style="background:#dff5ea"></i>発生</span><span><i
                            style="background:#ffeadc"></i>継続</span><span><i
                            style="background:#ece5f8"></i>収束</span><span><i style="background:#1b2026"></i>統合判定</span>
                </div>
                <div class="phaseLog" id="phaseLog"></div>
            </section>
        </section>
    </main>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            "use strict";

            const MODEL_URL = "../modules/faceAPI/models";
            const TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34";
            const WASM_URL = `${TASKS_URL}/wasm`;
            const FACE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
            const MEDIABUNNY_URL = "https://cdn.jsdelivr.net/npm/mediabunny@1.59.0/+esm";
            const EMOTIONS = ["neutral", "happy", "sad", "angry", "fearful", "disgusted", "surprised"];
            const LABELS = { neutral: "無表情", happy: "喜び", sad: "悲しみ", angry: "怒り", fearful: "恐れ", disgusted: "嫌悪", surprised: "驚き" };
            const PERIOD_RATIO = { neutral: 6, onset: 1, hold: 4, settle: 3 };
            const LANDMARK_INDICES = [33, 46, 52, 53, 55, 61, 63, 65, 66, 70, 78, 80, 81, 82, 84, 87, 88, 91, 95, 101, 105, 107, 133, 144, 146, 153, 158, 160, 178, 181, 191, 205, 263, 276, 282, 283, 285, 291, 293, 295, 296, 300, 308, 310, 311, 312, 314, 317, 318, 321, 324, 330, 334, 336, 362, 373, 375, 380, 385, 387, 402, 405, 415, 425];
            const $ = (id) => document.getElementById(id);
            const el = { file: $("fileInput"), analyze: $("analyzeButton"), clear: $("clearButton"), emotion: $("targetEmotion"), smooth: $("smoothWindow"), status: $("status"), progress: $("progress"), body: $("resultsBody"), empty: $("emptyState"), detail: $("detail"), detailName: $("detailName"), preview: $("preview"), chart: $("chart"), phaseLog: $("phaseLog") };
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: .35 });
            const frameCanvas = document.createElement("canvas");
            const frameContext = frameCanvas.getContext("2d", { alpha: false });
            let items = [], busy = false, modelsReady = false, selectedId = null, runToken = 0;
            let faceLandmarkerPromise;

            const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
            const finite = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
            const mean = (values) => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
            const scoreClass = (score) => score >= 80 ? "good" : score >= 60 ? "warn" : "bad";
            const seconds = (value) => Number.isFinite(value) ? `${value.toFixed(2)}秒` : "未検出";
            const score = (value) => Number.isFinite(value) ? `<span class="score ${scoreClass(value)}">${Math.round(value)}</span>` : "—";
            const scoredSeconds = (value, points) => Number.isFinite(value) ? `${seconds(value)} <small>(${Math.round(points)}点)</small>` : "未検出 <small>(0点)</small>";

            function calculatePeriodScores(durations) {
                const ratioTotal = Object.values(PERIOD_RATIO).reduce((sum, value) => sum + value, 0);
                const durationTotal = Object.values(durations).reduce((sum, value) => sum + (Number.isFinite(value) ? value : 0), 0);
                if (!durationTotal) return { scores: Object.fromEntries(Object.keys(PERIOD_RATIO).map((key) => [key, 0])), stability: 0 };
                const differences = Object.keys(PERIOD_RATIO).map((key) => {
                    const target = PERIOD_RATIO[key] / ratioTotal;
                    const actual = (Number.isFinite(durations[key]) ? durations[key] : 0) / durationTotal;
                    return { key, difference: Math.abs(actual - target), target };
                });
                return {
                    scores: Object.fromEntries(differences.map(({ key, difference, target }) => [key, 100 * clamp(1 - difference / target)])),
                    stability: 100 * clamp(1 - differences.reduce((sum, item) => sum + item.difference, 0) / 2),
                };
            }

            function setStatus(message, current = 0, total = 0, error = false) {
                el.status.textContent = message;
                el.status.classList.toggle("error", error);
                el.progress.hidden = total <= 0;
                el.progress.max = Math.max(1, total);
                el.progress.value = current;
            }

            function updateControls() {
                el.file.disabled = busy;
                el.analyze.disabled = busy || !modelsReady || !items.length;
                el.clear.disabled = busy || !items.length;
                el.emotion.disabled = busy;
                el.smooth.disabled = busy;
            }

            function getFaceLandmarker() {
                if (!faceLandmarkerPromise) faceLandmarkerPromise = import(TASKS_URL).then(async ({ FaceLandmarker, FilesetResolver }) => {
                    const vision = await FilesetResolver.forVisionTasks(WASM_URL);
                    return FaceLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: FACE_MODEL_URL }, runningMode: "IMAGE", numFaces: 1, minFaceDetectionConfidence: .35, minFacePresenceConfidence: .35 });
                }).catch((error) => { faceLandmarkerPromise = null; throw error; });
                return faceLandmarkerPromise;
            }

            const mediabunny = import(MEDIABUNNY_URL);
            const models = Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
                getFaceLandmarker(),
                mediabunny,
            ]);

            function averagePoint(points, indices) {
                const valid = indices.map((index) => points[index]).filter(Boolean);
                if (!valid.length) return null;
                return valid.reduce((sum, point) => ({ x: sum.x + point.x / valid.length, y: sum.y + point.y / valid.length, z: sum.z + (point.z || 0) / valid.length }), { x: 0, y: 0, z: 0 });
            }

            function normalizeLandmarks(points) {
                if (!points || points.length < 426) return null;
                const left = averagePoint(points, [33, 133]), right = averagePoint(points, [362, 263]);
                if (!left || !right) return null;
                const center = { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2, z: (left.z + right.z) / 2 };
                const dx = right.x - left.x, dy = right.y - left.y, scale = Math.hypot(dx, dy);
                if (scale < 1e-5) return null;
                const cos = dx / scale, sin = dy / scale;
                return LANDMARK_INDICES.flatMap((index) => {
                    const point = points[index], x = point.x - center.x, y = point.y - center.y;
                    return [(x * cos + y * sin) / scale, (-x * sin + y * cos) / scale, (((point.z || 0) - center.z) / scale) * .5];
                });
            }

            function averageVector(vectors) {
                return vectors.length ? vectors[0].map((_, index) => mean(vectors.map((vector) => vector[index]))) : null;
            }

            function vectorDistance(a, b) {
                return a && b ? Math.sqrt(mean(a.map((value, index) => (value - b[index]) ** 2))) : null;
            }

            function smoothed(samples, windowSize) {
                const radius = Math.floor(windowSize / 2);
                return samples.map((sample, index) => {
                    const neighbors = samples.slice(Math.max(0, index - radius), index + radius + 1);
                    const expressions = neighbors.filter((item) => item.detected);
                    const distances = neighbors.map((item) => item.landmarkDistance).filter(Number.isFinite);
                    return { ...sample, smooth: expressions.length ? Object.fromEntries(EMOTIONS.map((emotion) => [emotion, mean(expressions.map((item) => item.expressions[emotion]))])) : null, landmarkMotion: distances.length ? mean(distances) : null };
                });
            }

            function profile(values, minimumAmplitude) {
                const valid = values.filter(Number.isFinite);
                if (valid.length < 3) return { baseline: 0, amplitude: 0, usable: false };
                const baseline = mean(valid.slice(0, Math.max(1, Math.round(valid.length * .15))));
                const amplitude = Math.max(...valid) - baseline;
                return { baseline, amplitude, usable: amplitude >= minimumAmplitude };
            }

            function crossing(data, level, direction, start = 1, end = data.length - 1) {
                for (let index = Math.max(1, start); index <= end; index += 1) {
                    const a = data[index - 1], b = data[index];
                    const crossed = direction === "rising" ? a.value <= level && b.value >= level : a.value >= level && b.value <= level;
                    if (!crossed) continue;
                    const ratio = Math.abs(b.value - a.value) < 1e-6 ? 0 : clamp((level - a.value) / (b.value - a.value));
                    return a.time + (b.time - a.time) * ratio;
                }
                return null;
            }

            function monotonicity(points) {
                if (points.length < 2) return null;
                const movement = points.slice(1).reduce((sum, point, index) => sum + Math.abs(point.value - points[index].value), 0);
                return movement < 1e-6 ? 0 : 100 * clamp(Math.abs(points.at(-1).value - points[0].value) / movement);
            }

            function calculateMetrics(samples, duration) {
                const target = el.emotion.value, windowSize = Math.max(1, Math.round(finite(el.smooth.value, 5)));
                const shapes = samples.filter((sample) => sample.landmarks).map((sample) => sample.landmarks);
                if (shapes.length >= 3) {
                    const baseline = averageVector(shapes.slice(0, Math.max(3, Math.min(shapes.length, Math.round(shapes.length * .15)))));
                    samples.forEach((sample, index) => {
                        const local = samples.slice(Math.max(0, index - 2), index + 3).map((item) => item.landmarks).filter(Boolean);
                        sample.landmarkDistance = local.length ? vectorDistance(averageVector(local), baseline) : null;
                    });
                }
                const data = smoothed(samples, windowSize).filter((sample) => sample.smooth || Number.isFinite(sample.landmarkMotion)).map((sample) => ({
                    time: sample.time,
                    emotion: sample.smooth ? sample.smooth[target] / Math.max(.0001, sample.smooth.neutral + sample.smooth[target]) : null,
                    landmark: sample.landmarkMotion,
                }));
                if (data.length < 3) throw new Error("顔を検出できた点が少なすぎます");
                const emotionProfile = profile(data.map((point) => point.emotion), .03);
                const landmarkProfile = profile(data.map((point) => point.landmark), .003);
                if (!emotionProfile.usable && !landmarkProfile.usable) throw new Error("表情の変化を検出できませんでした");
                data.forEach((point) => {
                    const landmark = landmarkProfile.usable && Number.isFinite(point.landmark) ? clamp((point.landmark - landmarkProfile.baseline) / landmarkProfile.amplitude) : null;
                    const emotion = emotionProfile.usable && Number.isFinite(point.emotion) ? clamp((point.emotion - emotionProfile.baseline) / emotionProfile.amplitude) : null;
                    const weight = (landmark !== null ? .5 : 0) + (emotion !== null ? .5 : 0);
                    point.value = ((landmark ?? 0) * .5 + (emotion ?? 0) * .5) / weight;
                });
                let maxIndex = 0;
                data.forEach((point, index) => { if (point.value > data[maxIndex].value) maxIndex = index; });
                const onset = crossing(data, .08, "rising", 1, maxIndex) ?? data[Math.max(0, maxIndex - 1)].time;
                const peak = crossing(data, .92, "rising", 1, maxIndex) ?? data[maxIndex].time;
                const holdEnd = crossing(data, .8, "falling", maxIndex + 1);
                const settle = crossing(data, .2, "falling", maxIndex + 1);
                const holdLimit = holdEnd ?? duration;
                const holdPoints = data.filter((point) => point.time >= peak && point.time <= holdLimit);
                const holdMean = mean(holdPoints.map((point) => point.value));
                const holdStd = Math.sqrt(mean(holdPoints.map((point) => (point.value - holdMean) ** 2)));
                const holdDiff = holdPoints.length > 1 ? mean(holdPoints.slice(1).map((point, index) => Math.abs(point.value - holdPoints[index].value))) : 1;
                const holdStability = holdPoints.length > 1 ? 100 * clamp(1 - holdStd / .2 - holdDiff / .12) : null;
                const rising = data.filter((point) => point.time >= onset && point.time <= peak);
                const falling = settle === null ? [] : data.filter((point) => point.time >= holdLimit && point.time <= settle);
                const directionalScores = [monotonicity(rising), monotonicity(falling)].filter(Number.isFinite);
                const transitionStability = directionalScores.length ? mean(directionalScores) : null;
                const strengthParts = [];
                if (landmarkProfile.usable) strengthParts.push({ value: clamp(landmarkProfile.amplitude / .035) * 100, weight: .5 });
                if (emotionProfile.usable) strengthParts.push({ value: clamp(emotionProfile.amplitude / .7) * 100, weight: .5 });
                const intensity = strengthParts.reduce((sum, part) => sum + part.value * part.weight, 0) / strengthParts.reduce((sum, part) => sum + part.weight, 0);
                const durations = {
                    neutral: onset,
                    onset: Math.max(0, peak - onset),
                    hold: Math.max(0, holdLimit - peak),
                    settle: settle === null ? null : Math.max(0, settle - holdLimit),
                };
                const period = calculatePeriodScores(durations);
                return {
                    data, onset, peak, holdEnd, settle,
                    neutralDuration: durations.neutral,
                    onsetDuration: durations.onset,
                    holdDuration: durations.hold,
                    settleDuration: durations.settle,
                    periodScores: period.scores,
                    periodStability: period.stability,
                    intensity, holdStability, transitionStability,
                    detectionRate: 100 * samples.filter((sample) => sample.landmarks).length / samples.length,
                    frameCount: samples.length,
                };
            }

            async function analyzeItem(item, itemIndex, token) {
                const { Input, ALL_FORMATS, BlobSource, CanvasSink } = await mediabunny;
                const input = new Input({ formats: ALL_FORMATS, source: new BlobSource(item.file) });
                const track = await input.getPrimaryVideoTrack();
                if (!track || !(await track.canDecode())) throw new Error("このWebMの映像をデコードできません");
                const firstTimestamp = await track.getFirstTimestamp();
                item.duration = await track.computeDuration();
                const sink = new CanvasSink(track, { width: 320, alpha: false, poolSize: 2 });
                const samples = [], landmarker = await getFaceLandmarker();
                for await (const wrapped of sink.canvases()) {
                    if (token !== runToken) throw new Error("解析を中断しました");
                    const time = wrapped.timestamp - firstTimestamp;
                    setStatus(`${item.name} の全フレームを解析中（${samples.length + 1}フレーム）`, itemIndex + time / Math.max(item.duration, .001), items.length);
                    if (frameCanvas.width !== wrapped.canvas.width || frameCanvas.height !== wrapped.canvas.height) {
                        frameCanvas.width = wrapped.canvas.width;
                        frameCanvas.height = wrapped.canvas.height;
                    }
                    frameContext.drawImage(wrapped.canvas, 0, 0);
                    const frame = frameCanvas;
                    const faceDetection = faceapi.detectSingleFace(frame, detectorOptions).withFaceExpressions();
                    const landmarks = normalizeLandmarks(landmarker.detect(frame).faceLandmarks?.[0]);
                    const detection = await faceDetection;
                    samples.push({ time, detected: Boolean(detection), landmarks, expressions: Object.fromEntries(EMOTIONS.map((emotion) => [emotion, detection?.expressions[emotion] || 0])) });
                    if (samples.length % 8 === 0) await new Promise(requestAnimationFrame);
                }
                if (!samples.length) throw new Error("映像フレームがありません");
                item.metrics = calculateMetrics(samples, item.duration);
                item.error = "";
            }

            async function analyzeAll() {
                if (busy || !items.length) return;
                const token = ++runToken;
                busy = true;
                updateControls();
                items.forEach((item) => { item.metrics = null; item.error = ""; });
                render();
                try {
                    await models;
                    for (let index = 0; index < items.length; index += 1) {
                        try { await analyzeItem(items[index], index, token); }
                        catch (error) { items[index].error = error.message; }
                        render();
                    }
                    setStatus(`${items.length}本の解析が完了しました`);
                } catch (error) {
                    console.error(error);
                    setStatus(`解析に失敗しました: ${error.message}`, 0, 0, true);
                } finally {
                    busy = false;
                    updateControls();
                    render();
                }
            }

            function render() {
                el.empty.hidden = items.length > 0;
                el.body.replaceChildren(...items.map((item) => {
                    const row = document.createElement("tr");
                    row.dataset.id = item.id;
                    row.classList.toggle("selected", item.id === selectedId);
                    if (item.metrics) {
                        const m = item.metrics;
                        row.innerHTML = `<td class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</td><td>${m.frameCount}</td><td>${Math.round(m.detectionRate)}%</td><td>${scoredSeconds(m.neutralDuration, m.periodScores.neutral)}</td><td>${scoredSeconds(m.onsetDuration, m.periodScores.onset)}</td><td>${scoredSeconds(m.holdDuration, m.periodScores.hold)}</td><td>${scoredSeconds(m.settleDuration, m.periodScores.settle)}</td><td>${score(m.periodStability)}</td><td>${score(m.intensity)}</td><td>${score(m.holdStability)}</td><td>${score(m.transitionStability)}</td>`;
                    } else {
                        row.innerHTML = `<td class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</td><td colspan="10" class="${item.error ? "error" : ""}">${escapeHtml(item.error || (busy ? "解析待ち" : "未解析"))}</td>`;
                    }
                    row.addEventListener("click", () => selectItem(item.id));
                    return row;
                }));
                if (selectedId && !items.some((item) => item.id === selectedId)) selectedId = null;
                renderDetail();
            }

            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
            }

            function selectItem(id) {
                selectedId = id;
                render();
            }

            function renderDetail() {
                const item = items.find((candidate) => candidate.id === selectedId);
                el.detail.hidden = !item;
                if (!item) return;
                el.detailName.textContent = item.name;
                if (el.preview.src !== item.url) el.preview.src = item.url;
                if (!item.metrics) {
                    el.phaseLog.textContent = item.error || "未解析です";
                    drawChart(null);
                    return;
                }
                const m = item.metrics;
                el.phaseLog.textContent = `無表情 ${m.neutralDuration.toFixed(2)}s（${Math.round(m.periodScores.neutral)}点） / 発生 ${m.onsetDuration.toFixed(2)}s（${Math.round(m.periodScores.onset)}点） / 継続 ${m.holdDuration.toFixed(2)}s（${Math.round(m.periodScores.hold)}点） / 収束 ${m.settleDuration === null ? "未検出（0点）" : `${m.settleDuration.toFixed(2)}s（${Math.round(m.periodScores.settle)}点）`}`;
                requestAnimationFrame(() => drawChart(item));
            }

            function drawChart(item) {
                const canvas = el.chart, rect = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
                if (!rect.width || !rect.height) return;
                canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
                const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, rect.width, rect.height);
                if (!item?.metrics) return;
                const pad = { left: 42, right: 15, top: 14, bottom: 28 }, width = rect.width - pad.left - pad.right, height = rect.height - pad.top - pad.bottom;
                const x = (time) => pad.left + clamp(time / item.duration) * width, y = (value) => pad.top + (1 - clamp(value)) * height;
                const m = item.metrics, phases = [[0, m.onset, "#f0f2f4"], [m.onset, m.peak, "#dff5ea"], [m.peak, m.holdEnd ?? item.duration, "#ffeadc"], [m.holdEnd, m.settle, "#ece5f8"]];
                phases.filter((phase) => Number.isFinite(phase[0]) && Number.isFinite(phase[1])).forEach(([start, end, color]) => { ctx.fillStyle = color; ctx.fillRect(x(start), pad.top, Math.max(0, x(end) - x(start)), height); });
                ctx.font = "11px sans-serif"; ctx.fillStyle = "#69717b"; ctx.strokeStyle = "#d9dde2"; ctx.lineWidth = 1;
                for (let value = 0; value <= 1; value += .25) { ctx.beginPath(); ctx.moveTo(pad.left, y(value)); ctx.lineTo(rect.width - pad.right, y(value)); ctx.stroke(); ctx.fillText(value.toFixed(2), 4, y(value) + 4); }
                for (let index = 0; index <= 5; index += 1) { const time = item.duration * index / 5; ctx.fillText(`${time.toFixed(1)}s`, Math.min(x(time), rect.width - 42), rect.height - 7); }
                ctx.strokeStyle = "#1b2026"; ctx.lineWidth = 2.5; ctx.beginPath();
                m.data.forEach((point, index) => index ? ctx.lineTo(x(point.time), y(point.value)) : ctx.moveTo(x(point.time), y(point.value)));
                ctx.stroke();
                if (selectedId === item.id) { ctx.strokeStyle = "#ef7f45"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(el.preview.currentTime), pad.top); ctx.lineTo(x(el.preview.currentTime), pad.top + height); ctx.stroke(); }
            }

            function addFiles(files) {
                const existing = new Set(items.map((item) => `${item.name}:${item.size}:${item.modified}`));
                [...files].filter((file) => file.type === "video/webm" || file.name.toLowerCase().endsWith(".webm")).forEach((file) => {
                    const key = `${file.name}:${file.size}:${file.lastModified}`;
                    if (!existing.has(key)) items.push({ id: crypto.randomUUID(), name: file.name, size: file.size, modified: file.lastModified, file, url: URL.createObjectURL(file), metrics: null, error: "" });
                });
                if (!selectedId && items.length) selectedId = items[0].id;
                setStatus(items.length ? `${items.length}本を選択しました` : "WebMを選択してください");
                updateControls(); render();
            }

            function clearAll() {
                runToken += 1;
                items.forEach((item) => URL.revokeObjectURL(item.url));
                items = []; selectedId = null; el.preview.removeAttribute("src"); el.preview.load();
                setStatus("WebMを選択してください"); updateControls(); render();
            }

            function initialize() {
                el.emotion.replaceChildren(...EMOTIONS.filter((emotion) => emotion !== "neutral").map((emotion) => { const option = document.createElement("option"); option.value = emotion; option.textContent = LABELS[emotion]; return option; }));
                el.emotion.value = "happy";
                el.file.addEventListener("change", () => { addFiles(el.file.files); el.file.value = ""; });
                el.analyze.addEventListener("click", analyzeAll);
                el.clear.addEventListener("click", clearAll);
                [el.emotion, el.smooth].forEach((input) => input.addEventListener("change", () => { items.forEach((item) => { item.metrics = null; item.error = ""; }); setStatus("設定が変わりました。再解析してください"); render(); }));
                el.preview.addEventListener("timeupdate", () => { const item = items.find((candidate) => candidate.id === selectedId); if (item?.metrics) drawChart(item); });
                new ResizeObserver(() => { const item = items.find((candidate) => candidate.id === selectedId); drawChart(item); }).observe(el.chart);
                window.addEventListener("beforeunload", () => items.forEach((item) => URL.revokeObjectURL(item.url)));
                console.assert(Math.round(monotonicity([{ value: 0 }, { value: .5 }, { value: 1 }])) === 100, "monotonicity self-check");
                console.assert(calculatePeriodScores({ neutral: 12, onset: 2, hold: 8, settle: 6 }).stability === 100, "period ratio self-check");
                models.then(() => { modelsReady = true; setStatus("WebMを選択してください"); updateControls(); }).catch((error) => { console.error(error); setStatus("MediaPipeまたはFace APIモデルを読み込めませんでした", 0, 0, true); });
                updateControls(); render();
            }

            initialize();
        });
    </script>
</body>
