<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>normalizer</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <script defer src="app.js?v=20260922-3"></script>
    <style>
        :root {
            --bg: #f0f0f0;
            --ink: #1b2026;
            --muted: #6d737b;
            --line: #d9dde2;
            --panel: #fff;
            --accent: #42d392;
            --base: #718096;
            --target: #ef7f45;
            --landmark: #3478d4;
            --progression: #1b2026;
            --danger: #c64b4b;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button,
        .fileButton {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .app {
            width: min(1480px, 100%);
            min-height: 100dvh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(340px, .8fr);
        }

        .workspace {
            min-width: 0;
            padding: 18px;
        }

        .settings {
            min-width: 0;
            padding: 18px;
            border-left: 1px solid var(--line);
            background: var(--panel);
        }

        .stack {
            display: grid;
            align-content: start;
            gap: 14px;
        }

        .panel {
            min-width: 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
        }

        .panel h2 {
            margin: 0;
            font-size: .9rem;
        }

        .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .videoShell {
            min-height: 260px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 8px;
            background: #171a1e;
        }

        video {
            display: block;
            width: 100%;
            max-height: 56dvh;
            background: #171a1e;
        }

        .chartWrap {
            height: 330px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        #chart {
            width: 100%;
            height: 100%;
            display: block;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-left: auto;
            color: var(--muted);
            font-size: .74rem;
        }

        .legendItem {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .swatch {
            width: 18px;
            height: 3px;
            border-radius: 2px;
        }

        .toolbar,
        .buttonRow {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .toolbar {
            margin-top: 10px;
        }

        .formGrid #analyzeButton {
            align-self: end;
        }

        .fileButton,
        button {
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            font-size: .8rem;
        }

        .fileButton {
            position: relative;
            overflow: hidden;
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .fileButton input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .primaryButton {
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }

        .accentButton {
            border-color: var(--accent);
            background: var(--accent);
            color: #10231b;
        }

        .status {
            flex: 1;
            min-width: 180px;
            color: var(--muted);
            font-size: .76rem;
        }

        progress {
            width: 100%;
            height: 7px;
            margin-top: 10px;
            accent-color: var(--accent);
        }

        progress[hidden] {
            display: none;
        }

        .formGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        label.field {
            min-width: 0;
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: .73rem;
        }

        input[type="number"],
        select {
            width: 100%;
            min-width: 0;
            height: 36px;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #fff;
            color: var(--ink);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .analysisLog {
            margin-top: 12px;
            padding-top: 9px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .66rem;
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }

        .segments {
            display: grid;
            gap: 8px;
        }

        .segment {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr) auto;
            gap: 9px;
            align-items: center;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .segmentColor {
            align-self: stretch;
            border-radius: 4px;
        }

        .segmentTitle {
            font-size: .77rem;
        }

        .durationFlow {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .rawDuration {
            color: var(--muted);
            font-size: .68rem;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .durationArrow {
            color: var(--muted);
            font-size: .72rem;
        }

        .durationField {
            display: grid;
            grid-template-columns: 56px auto;
            align-items: center;
            gap: 4px;
            font-size: .7rem;
        }

        .durationField input {
            height: 32px;
            min-width: 0;
            padding: 0 5px;
        }

        .segment[hidden] {
            display: none;
        }

        .previewTimeline {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .previewTimeline button {
            width: 42px;
            padding: 0;
        }

        .timeOutput {
            width: 86px;
            color: var(--muted);
            font-size: .72rem;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .metric {
            padding: 8px;
            border-radius: 7px;
            background: #f5f6f7;
        }

        .metricLabel {
            color: var(--muted);
            font-size: .65rem;
        }

        .metricValue {
            margin-top: 2px;
            font-size: .82rem;
            font-variant-numeric: tabular-nums;
        }

        .error {
            color: var(--danger);
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
            }

            .settings {
                border-left: 0;
                border-top: 1px solid var(--line);
            }

            .chartWrap {
                height: 280px;
            }
        }

        @media (max-width: 560px) {

            .workspace,
            .settings {
                padding: 10px;
            }

            .formGrid {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="workspace stack">
            <section class="panel">
                <div class="videoShell">
                    <video id="video" playsinline muted controls hidden></video>
                    <div id="emptyVideo"></div>
                </div>
                <div class="toolbar">
                    <label class="fileButton">動画を選択<input id="fileInput" type="file" accept="video/*"></label>
                    <span class="status" id="status">MediaPipe / Face APIモデルを読み込んでいます</span>
                </div>
                <progress id="analysisProgress" value="0" max="1" hidden></progress>
            </section>

            <section class="panel">
                <div class="panelHeader">
                    <div class="legend">
                        <span class="legendItem"><i class="swatch"
                                style="background:var(--base)"></i><span>無表情</span></span>
                        <span class="legendItem"><i class="swatch" style="background:var(--target)"></i><span
                                id="targetLegend">喜び</span></span>
                        <span class="legendItem"><i class="swatch"
                                style="background:var(--landmark)"></i><span>MediaPipe</span></span>
                        <span class="legendItem"><i class="swatch"
                                style="background:var(--progression)"></i><span>統合判定</span></span>
                    </div>
                </div>
                <div class="chartWrap">
                    <canvas id="chart"></canvas>
                </div>
            </section>
        </section>

        <aside class="settings stack">
            <section class="panel">
                <div class="panelHeader">
                    <h2>解析設定</h2>
                </div>
                <div class="formGrid">
                    <label class="field">変化後の感情
                        <select id="targetEmotion"></select>
                    </label>
                    <label class="field">検出間隔（秒）
                        <input id="sampleInterval" type="number" min="0.03" max="2" step="0.01" value="0.05">
                    </label>
                    <label class="field">平滑化
                        <select id="smoothWindow">
                            <option value="1">なし</option>
                            <option value="3">3点移動平均</option>
                            <option value="5" selected>5点移動平均</option>
                            <option value="7">7点移動平均</option>
                            <option value="11">11点移動平均</option>
                        </select>
                    </label>
                    <button id="analyzeButton" class="accentButton" type="button" disabled>解析</button>
                </div>
            </section>

            <section class="panel">
                <div class="panelHeader">
                    <h2>正規化</h2>
                </div>
                <div class="segments">
                    <div class="segment">
                        <i class="segmentColor" style="background:#88919c"></i>
                        <div class="segmentTitle">表情が発生するタイミング</div>
                        <div class="durationFlow">
                            <span class="rawDuration" id="onsetRaw">raw 0.00秒</span>
                            <span class="durationArrow">→</span>
                            <label class="durationField"><input id="onsetTime" type="number" min="0.01"
                                    step="0.01" value="1.0"><span>秒</span></label>
                        </div>
                    </div>
                    <div class="segment">
                        <i class="segmentColor" style="background:var(--accent)"></i>
                        <div class="segmentTitle">表情が発生して変化が完了するまで</div>
                        <div class="durationFlow">
                            <span class="rawDuration" id="expressionRaw">raw 0.00秒</span>
                            <span class="durationArrow">→</span>
                            <label class="durationField"><input id="expressionDuration" type="number" min="0.01" step="0.01"
                                    value="3.0"><span>秒</span></label>
                        </div>
                    </div>
                </div>
                <div class="previewTimeline">
                    <button id="previewButton" type="button" disabled aria-label="正規化プレビューを再生">▶</button>
                    <input id="previewRange" type="range" min="0" max="1" step="0.001" value="0" disabled>
                    <output class="timeOutput" id="previewTime">0.00 / 0.00秒</output>
                </div>
                <div class="summary">
                    <div class="metric">
                        <div class="metricLabel">RAW範囲</div>
                        <div class="metricValue" id="rawDurationMetric">0.00秒</div>
                    </div>
                    <div class="metric">
                        <div class="metricLabel">正規化後</div>
                        <div class="metricValue" id="targetDurationMetric">0.00秒</div>
                    </div>
                    <div class="metric">
                        <div class="metricLabel">MediaPipe検出率</div>
                        <div class="metricValue" id="detectionMetric">—</div>
                    </div>
                </div>
                <div class="analysisLog" id="boundaryLog">区間境界: 未解析</div>
            </section>

            <section class="panel">
                <div class="panelHeader">
                    <h2>書き出し</h2>
                </div>
                <div class="buttonRow">
                    <button id="exportVideoButton" class="primaryButton" type="button" disabled>WebM</button>
                    <button id="exportCsvButton" type="button" disabled>CSV</button>
                    <button id="exportJsonButton" type="button" disabled>JSON（設定）</button>
                </div>
            </section>
        </aside>
    </main>
</body>

</html>
