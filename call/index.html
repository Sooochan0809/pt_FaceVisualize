<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimal Fake Call App</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 24px;
            background: #f5f5f5;
            color: #111;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            max-width: 560px;
        }

        input,
        button {
            font-size: 16px;
            padding: 10px 12px;
            margin: 4px 0;
        }

        input {
            width: calc(100% - 28px);
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            border-top: 1px solid #eee;
            padding: 10px 0;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: min(90vw, 420px);
            text-align: center;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
        }

        .muted {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Minimal Fake Call App</h1>

    <section id="authView" class="card">
        <h2>ログイン</h2>
        <input id="emailInput" type="email" placeholder="email@example.com" />
        <input id="passwordInput" type="password" placeholder="password" />
        <input id="nameInput" type="text" placeholder="表示名" />

        <button id="signupButton">新規登録</button>
        <button id="loginButton">ログイン</button>

        <p class="muted">
            Firebase Authenticationの「メール / パスワード」を有効にしてください。
        </p>
    </section>

    <section id="appView" class="card hidden">
        <h2>ユーザー</h2>
        <p>
            ログイン中：
            <strong id="currentUserLabel"></strong>
        </p>
        <button id="logoutButton">ログアウト</button>

        <h3>呼び出す相手</h3>
        <div id="usersList"></div>
    </section>

    <section id="callView" class="card hidden">
        <h2>通話状態</h2>
        <div id="callStatus" class="status">---</div>
        <p id="callPartnerLabel"></p>
        <button id="endCallButton">終了</button>
    </section>

    <div id="incomingModal" class="modal hidden">
        <div class="modal-content">
            <h2>着信</h2>
            <p id="incomingText">誰かから着信しています</p>
            <button id="acceptButton">応答</button>
            <button id="declineButton">拒否</button>
        </div>
    </div>

    <script type="module">
        // ==============================
        // 1. Firebase SDK
        // ==============================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            setPersistence,
            inMemoryPersistence
        } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            addDoc,
            updateDoc,
            getDoc,
            query,
            where,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        // ==============================
        // 2. Firebase設定を差し替える
        // ==============================

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDR0O3RHxihP81XoDzrjrxYIo4vk0Pf0ak",
            authDomain: "facetime-8464f.firebaseapp.com",
            projectId: "facetime-8464f",
            storageBucket: "facetime-8464f.firebasestorage.app",
            messagingSenderId: "757982853917",
            appId: "1:757982853917:web:db95be305ba90471703ff4",
            measurementId: "G-XG1VEQR7R5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==============================
        // 3. DOM
        // ==============================

        const authView = document.getElementById("authView");
        const appView = document.getElementById("appView");
        const callView = document.getElementById("callView");

        const emailInput = document.getElementById("emailInput");
        const passwordInput = document.getElementById("passwordInput");
        const nameInput = document.getElementById("nameInput");

        const signupButton = document.getElementById("signupButton");
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");

        const currentUserLabel = document.getElementById("currentUserLabel");
        const usersList = document.getElementById("usersList");

        const callStatus = document.getElementById("callStatus");
        const callPartnerLabel = document.getElementById("callPartnerLabel");
        const endCallButton = document.getElementById("endCallButton");

        const incomingModal = document.getElementById("incomingModal");
        const incomingText = document.getElementById("incomingText");
        const acceptButton = document.getElementById("acceptButton");
        const declineButton = document.getElementById("declineButton");

        // ==============================
        // 4. 状態
        // ==============================

        let currentUser = null;
        let currentCallId = null;
        let incomingCallId = null;

        let unsubscribeUsers = null;
        let unsubscribeIncoming = null;
        let unsubscribeCurrentCall = null;

        // ==============================
        // 5. 認証
        // ==============================

        signupButton.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            if (!email || !password || !name) {
                alert("メールアドレス、パスワード、表示名を入力してください");
                return;
            }

            try {
                // このタブ内のメモリだけにログイン状態を保存する
                await setPersistence(auth, inMemoryPersistence);

                const result = await createUserWithEmailAndPassword(auth, email, password);

                await saveUser(result.user, name);
            } catch (error) {
                console.error("新規登録失敗:", error);
                alert(`新規登録に失敗しました: ${error.code || error.message}`);
            }
        };

        loginButton.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            if (!email || !password) {
                alert("メールアドレスとパスワードを入力してください");
                return;
            }

            try {
                // このタブ内のメモリだけにログイン状態を保存する
                await setPersistence(auth, inMemoryPersistence);

                console.log("ログイン開始:", email);

                const result = await signInWithEmailAndPassword(auth, email, password);

                console.log("ログイン成功:", result.user.uid);

                await saveUser(result.user, name);
            } catch (error) {
                console.error("ログイン失敗:", error);
                alert(`ログインに失敗しました: ${error.code || error.message}`);
            }
        };

        logoutButton.onclick = async () => {
            cleanupListeners();
            await signOut(auth);
        };

        async function saveUser(user, name) {
            const data = {
                uid: user.uid,
                email: user.email,
                online: true,
                updatedAt: serverTimestamp()
            };

            // 名前が入力されているときだけ name を保存・更新する
            if (name && name.trim() !== "") {
                data.name = name.trim();
            }

            await setDoc(
                doc(db, "users", user.uid),
                data,
                { merge: true }
            );
        }

        onAuthStateChanged(auth, async (user) => {
            console.log("onAuthStateChanged 発火:", user ? user.uid : "未ログイン");

            cleanupListeners();

            if (!user) {
                currentUser = null;
                authView.classList.remove("hidden");
                appView.classList.add("hidden");
                callView.classList.add("hidden");
                incomingModal.classList.add("hidden");
                return;
            }

            try {
                currentUser = user;

                // 先に画面だけ切り替える
                currentUserLabel.textContent = "読み込み中...";
                authView.classList.add("hidden");
                appView.classList.remove("hidden");

                // Firestoreからユーザー名を取得
                const userSnap = await getDoc(doc(db, "users", user.uid));
                const userData = userSnap.data();

                // ここでメールではなくユーザー名を表示
                currentUserLabel.textContent = userData?.name || "名前未設定";

                listenUsers();
                listenIncomingCalls();
            } catch (error) {
                console.error("ログイン後の初期化に失敗:", error);
                alert(`ログイン後の初期化に失敗しました: ${error.code || error.message}`);
            }
        });

        // ==============================
        // 6. ユーザー一覧
        // ==============================

        function listenUsers() {
            unsubscribeUsers = onSnapshot(collection(db, "users"), (snapshot) => {
                usersList.innerHTML = "";

                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();

                    if (!currentUser) return;
                    if (user.uid === currentUser.uid) return;

                    const row = document.createElement("div");
                    row.className = "user-row";

                    const label = document.createElement("div");
                    label.innerHTML = `
            <strong>${escapeHtml(user.name || user.email)}</strong><br>
            <span class="muted">${escapeHtml(user.email || "")}</span>
          `;

                    const button = document.createElement("button");
                    button.textContent = "呼び出す";
                    button.onclick = () => startCall(user.uid, user.name || user.email);

                    row.appendChild(label);
                    row.appendChild(button);
                    usersList.appendChild(row);
                });
            });
        }

        // ==============================
        // 7. 発信
        // ==============================

        async function startCall(calleeId, calleeName) {
            if (!currentUser) return;

            const callRef = await addDoc(collection(db, "calls"), {
                callerId: currentUser.uid,
                calleeId,
                status: "ringing",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            currentCallId = callRef.id;

            showCallView("呼び出し中...", calleeName);
            listenCurrentCall(currentCallId);
        }

        // ==============================
        // 8. 着信監視
        // ==============================

        function listenIncomingCalls() {
            if (!currentUser) return;

            const q = query(
                collection(db, "calls"),
                where("calleeId", "==", currentUser.uid),
                where("status", "==", "ringing")
            );

            unsubscribeIncoming = onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) return;

                const docSnap = snapshot.docs[0];
                const call = docSnap.data();

                incomingCallId = docSnap.id;

                const callerName = await getUserName(call.callerId);

                incomingText.textContent = `${callerName} から着信しています`;
                incomingModal.classList.remove("hidden");

                playSmallBeep();
            });
        }

        acceptButton.onclick = async () => {
            if (!incomingCallId) return;

            await updateDoc(doc(db, "calls", incomingCallId), {
                status: "accepted",
                updatedAt: serverTimestamp()
            });

            currentCallId = incomingCallId;
            incomingCallId = null;

            incomingModal.classList.add("hidden");

            const callSnap = await getDoc(doc(db, "calls", currentCallId));
            const call = callSnap.data();
            const callerName = await getUserName(call.callerId);

            showCallView("通話中", callerName);
            listenCurrentCall(currentCallId);
        };

        declineButton.onclick = async () => {
            if (!incomingCallId) return;

            await updateDoc(doc(db, "calls", incomingCallId), {
                status: "declined",
                updatedAt: serverTimestamp()
            });

            incomingCallId = null;
            incomingModal.classList.add("hidden");
        };

        // ==============================
        // 9. 通話状態の監視
        // ==============================

        function listenCurrentCall(callId) {
            if (unsubscribeCurrentCall) {
                unsubscribeCurrentCall();
            }

            unsubscribeCurrentCall = onSnapshot(doc(db, "calls", callId), async (snapshot) => {
                const call = snapshot.data();
                if (!call) return;

                if (call.status === "ringing") {
                    callStatus.textContent = "呼び出し中...";
                }

                if (call.status === "accepted") {
                    callStatus.textContent = "通話中";
                }

                if (call.status === "declined") {
                    callStatus.textContent = "拒否されました";
                    currentCallId = null;
                }

                if (call.status === "ended") {
                    callStatus.textContent = "通話終了";
                    currentCallId = null;
                }
            });
        }

        endCallButton.onclick = async () => {
            if (!currentCallId) {
                hideCallView();
                return;
            }

            const callId = currentCallId;

            await updateDoc(doc(db, "calls", callId), {
                status: "ended",
                updatedAt: serverTimestamp()
            });

            currentCallId = null;
            hideCallView();
        };

        // ==============================
        // 10. UI
        // ==============================

        function showCallView(statusText, partnerName) {
            callStatus.textContent = statusText;
            callPartnerLabel.textContent = `相手：${partnerName}`;
            callView.classList.remove("hidden");
        }

        function hideCallView() {
            callView.classList.add("hidden");
            callStatus.textContent = "---";
            callPartnerLabel.textContent = "";
        }

        async function getUserName(uid) {
            const snap = await getDoc(doc(db, "users", uid));
            const data = snap.data();
            return data?.name || data?.email || uid;
        }

        function cleanupListeners() {
            if (unsubscribeUsers) unsubscribeUsers();
            if (unsubscribeIncoming) unsubscribeIncoming();
            if (unsubscribeCurrentCall) unsubscribeCurrentCall();

            unsubscribeUsers = null;
            unsubscribeIncoming = null;
            unsubscribeCurrentCall = null;
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function playSmallBeep() {
            try {
                const audioContext = new AudioContext();
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.frequency.value = 880;
                gain.gain.value = 0.05;

                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.15);
            } catch (e) {
                // ブラウザの自動再生制限で鳴らない場合がある
            }
        }
    </script>
</body>

</html>
