<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>再印刷用</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --accent: #f19935;
            --ink: #27231f;
            --muted: #766f68;
            --panel: rgb(255 255 255 / 88%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            padding: clamp(20px, 4vw, 48px);
            background: linear-gradient(rgb(255 255 255 / 42%), rgb(255 255 255 / 42%));
            color: var(--ink);
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
        }

        button,
        input,
        select {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }

        .archive-shell {
            width: min(1040px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(1.7rem, 3.8vw, 2.8rem);
        }

        .archive-drop {
            display: grid;
            min-height: 180px;
            place-items: center;
            border: 4px dashed rgb(241 153 53 / 62%);
            border-radius: 28px;
            padding: 24px;
            background: var(--panel);
            text-align: center;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .archive-drop.is-dragging {
            border-color: var(--accent);
            transform: scale(1.01);
        }

        .archive-file-label,
        .print-button {
            display: inline-grid;
            min-height: 52px;
            place-items: center;
            border: 0;
            border-radius: 16px;
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        #archiveFile {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .archive-hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-weight: 500;
        }

        .archive-status {
            min-height: 1.5em;
            margin: 14px 4px;
            color: var(--muted);
        }

        .archive-list {
            display: grid;
            width: 100%;
            justify-items: center;
            gap: 28px;
        }

        .archive-card {
            display: grid;
            width: min(1040px, 100%);
            aspect-ratio: 5 / 3;
            grid-template-columns: minmax(0, 3fr) minmax(0, 4fr);
            gap: clamp(14px, 2.5vw, 22px);
            border-radius: 28px;
            margin-inline: auto;
            justify-self: center;
            padding: clamp(20px, 3vw, 28px);
            background: var(--panel);
            box-shadow: 0 18px 46px rgb(74 53 31 / 12%);
        }

        .archive-media {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-content: start;
        }

        .lenticular-preview {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 14px;
            object-fit: cover;
            background: #eee;
        }

        .archive-meta {
            display: grid;
            align-content: start;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 14px;
        }

        .archive-meta h2 {
            grid-column: 1 / -1;
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
        }

        .archive-meta p {
            margin: 0;
            color: var(--muted);
        }

        .archive-video-link {
            width: fit-content;
            color: var(--accent);
            text-underline-offset: 0.2em;
        }

        .selected-title {
            margin: 12px 0 8px;
            font-size: 1rem;
        }

        .archive-meta > .selected-title,
        .archive-meta > .selected-grid,
        .archive-meta > .unselected-section,
        .archive-meta > .card-footer {
            grid-column: 1 / -1;
        }

        .card-footer {
            display: grid;
            width: 100%;
            grid-template-columns: minmax(0, 280px) minmax(0, 1fr);
            align-items: end;
            gap: 12px;
            margin-top: 4px;
        }

        .archive-attributes {
            display: grid;
            width: min(280px, 100%);
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) auto;
            align-items: end;
            gap: 8px;
            border-radius: 10px;
            padding: 6px 7px;
            background: rgb(241 153 53 / 9%);
        }

        .attribute-control {
            display: grid;
            min-width: 0;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .attribute-label {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .attribute-control select,
        .attribute-control input {
            width: 100%;
            min-width: 0;
            height: 32px;
            border: 1px solid rgb(118 111 104 / 35%);
            border-radius: 7px;
            padding: 3px 7px;
            background: #fff;
            color: var(--ink);
            font-size: 0.82rem;
        }

        .attribute-age-field {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 4px;
        }

        .attribute-save-button {
            min-height: 32px;
            border: 0;
            border-radius: 8px;
            padding: 5px 12px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        .selected-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
        }

        .archive-image {
            min-width: 0;
            margin: 0;
        }

        .archive-image img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            object-fit: cover;
        }

        .emotion-estimate {
            overflow: hidden;
            margin-top: 4px;
            border-radius: 6px;
            padding: 3px 4px;
            background: rgb(241 153 53 / 13%);
            color: var(--ink);
            font-size: clamp(0.58rem, 1vw, 0.72rem);
            line-height: 1.25;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-actions {
            display: flex;
            width: fit-content;
            justify-self: end;
            justify-content: flex-end;
            gap: 10px;
        }

        .download-button {
            display: inline-grid;
            min-height: 52px;
            place-items: center;
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 8px 22px;
            background: #fff;
            color: var(--accent);
            cursor: pointer;
        }

        .print-button:disabled,
        .download-button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        @media (min-width: 901px) {
            .archive-media {
                height: 100%;
            }

            .lenticular-preview {
                height: 100%;
                aspect-ratio: auto;
                object-fit: contain;
                object-position: center bottom;
            }

            .archive-meta {
                height: 100%;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .archive-card {
                aspect-ratio: auto;
                grid-template-columns: 1fr;
            }

            .archive-media {
                width: min(520px, 100%);
                margin-inline: auto;
            }

            .selected-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

        }

        @media (max-width: 620px) {
            .card-footer {
                grid-template-columns: 1fr;
            }

            .card-actions {
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .archive-meta {
                grid-template-columns: 1fr;
            }

            .archive-meta > * {
                grid-column: 1;
            }

        }
    </style>
</head>

<body>
    <main class="archive-shell">
        <section id="archiveDrop" class="archive-drop">
            <div>
                <label class="archive-file-label" for="archiveFile">アーカイブを選択</label>
                <input id="archiveFile" type="file" accept=".zip,.facecard.zip,application/zip" multiple>
                <p class="archive-hint">複数のfacecard.zipをここへドラッグ＆ドロップできます</p>
            </div>
        </section>
        <p id="archiveStatus" class="archive-status" role="status"></p>

        <div id="archiveList" class="archive-list"></div>

        <template id="archiveCardTemplate">
            <section class="archive-card">
                <div class="archive-media">
                    <img class="lenticular-preview" alt="レンチキュラー画像">
                </div>
                <div class="archive-meta">
                    <h2 class="archive-id"></h2>
                    <p class="archive-created-at"></p>
                    <p class="archive-settings"></p>
                    <p class="archive-video-meta"></p>
                    <a class="archive-video-link" target="_blank" rel="noopener" hidden>動画を再生</a>
                    <div class="card-footer">
                        <div class="archive-attributes" aria-label="属性登録">
                            <label class="attribute-control">
                                <span class="attribute-label">性別</span>
                                <select class="attribute-gender">
                                    <option value="">未設定</option>
                                    <option value="female">女性</option>
                                    <option value="male">男性</option>
                                    <option value="nonbinary">ノンバイナリー</option>
                                    <option value="other">その他</option>
                                    <option value="no-answer">回答しない</option>
                                </select>
                            </label>
                            <label class="attribute-control">
                                <span class="attribute-label">年齢</span>
                                <span class="attribute-age-field">
                                    <input class="attribute-age" type="number" min="0" max="120" step="1" inputmode="numeric" placeholder="未設定">
                                    <span>歳</span>
                                </span>
                            </label>
                            <button class="attribute-save-button" type="button">登録</button>
                        </div>
                        <div class="card-actions">
                            <button class="download-button" type="button">PNGで保存</button>
                            <button class="print-button" type="button">再印刷</button>
                        </div>
                    </div>
                    <h3 class="selected-title">選択した6枚</h3>
                    <div class="selected-grid selected-images"></div>
                    <div class="unselected-section">
                        <h3 class="selected-title">選択されなかった表情</h3>
                        <div class="selected-grid unselected-images"></div>
                    </div>
                </div>
            </section>
        </template>
    </main>

    <script src="./facecard-archive.js"></script>
    <script>
        const archiveDrop = document.getElementById("archiveDrop");
        const archiveFile = document.getElementById("archiveFile");
        const archiveStatus = document.getElementById("archiveStatus");
        const archiveList = document.getElementById("archiveList");
        const archiveCardTemplate = document.getElementById("archiveCardTemplate");
        const targetOrigin = location.origin === "null" ? "*" : location.origin;
        const CARD_POPUP_FEATURES =
            "popup=yes,width=900,height=700,resizable=yes,scrollbars=yes";
        const EXPORT_WIDTH = 1040;
        const EXPORT_HEIGHT = 624;
        const EXPORT_SCALE = 2;
        const EMOTION_LABELS = Object.freeze({
            neutral: "無表情",
            happy: "喜び",
            sad: "悲しみ",
            angry: "怒り",
            fearful: "恐れ",
            disgusted: "嫌悪",
            surprised: "驚き"
        });
        const GENDER_LABELS = Object.freeze({
            female: "女性",
            male: "男性",
            nonbinary: "ノンバイナリー",
            other: "その他",
            "no-answer": "回答しない"
        });
        const ATTRIBUTE_STORAGE_PREFIX = "motion2-archive-attributes:";
        const loadedArchives = [];
        let activePrintArchive = null;
        let activePrintButton = null;
        let cardWindow = null;

        function setStatus(message) {
            archiveStatus.textContent = message;
        }

        function formatCreatedAt(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime())
                ? value
                : new Intl.DateTimeFormat("ja-JP", {
                    dateStyle: "long",
                    timeStyle: "medium"
                }).format(date);
        }

        function formatEmotionEstimate(item) {
            const emotion = String(item?.emotion || "").trim();
            if (!emotion) return "";
            const emotionLabel = EMOTION_LABELS[emotion.toLowerCase()] || emotion;
            const score = Number(item?.emotionScore);
            if (!Number.isFinite(score)) return emotionLabel;
            const percentage = score <= 1 ? score * 100 : score;
            return `${emotionLabel} ${percentage.toFixed(1)}%`;
        }

        function loadArchiveAttributes(archiveId) {
            try {
                const saved = localStorage.getItem(
                    `${ATTRIBUTE_STORAGE_PREFIX}${archiveId}`
                );
                if (!saved) return { gender: "", age: "" };
                const parsed = JSON.parse(saved);
                return {
                    gender: GENDER_LABELS[parsed.gender] ? parsed.gender : "",
                    age: Number.isInteger(parsed.age) ? String(parsed.age) : ""
                };
            } catch (error) {
                console.warn("属性を復元できませんでした。", error);
                return { gender: "", age: "" };
            }
        }

        function formatAttributeSummary(attributes) {
            const parts = [];
            if (attributes?.gender && GENDER_LABELS[attributes.gender]) {
                parts.push(`性別 ${GENDER_LABELS[attributes.gender]}`);
            }
            if (attributes?.age !== "" && Number.isFinite(Number(attributes.age))) {
                parts.push(`年齢 ${Number(attributes.age)}歳`);
            }
            return parts.join(" / ");
        }

        function createArchiveImage(item, index, label) {
            const figure = document.createElement("figure");
            const image = document.createElement("img");
            const emotionEstimate = formatEmotionEstimate(item);
            const capturedAt = Number(item.capturedAtSeconds);
            const capturedAtText = Number.isFinite(capturedAt)
                ? `${capturedAt.toFixed(1)}秒`
                : "時刻不明";
            figure.className = "archive-image";
            image.src = item.imageUrl;
            image.alt = emotionEstimate
                ? `${label} ${index + 1}（${emotionEstimate}）`
                : `${label} ${index + 1}`;
            image.title = emotionEstimate
                ? `${emotionEstimate} / ${capturedAtText}`
                : capturedAtText;
            figure.append(image);
            if (emotionEstimate) {
                const caption = document.createElement("figcaption");
                caption.className = "emotion-estimate";
                caption.textContent = emotionEstimate;
                figure.append(caption);
            }
            return figure;
        }

        function renderArchiveImages(container, items, label) {
            container.replaceChildren(
                ...items.map((item, index) =>
                    createArchiveImage(item, index, label)
                )
            );
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.addEventListener("load", () => resolve(reader.result));
                reader.addEventListener("error", () => reject(reader.error));
                reader.readAsDataURL(blob);
            });
        }

        async function loadCanvasImage(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("画像をPNG用に読み込めませんでした。");
            const dataUrl = await blobToDataUrl(await response.blob());
            const image = new Image();
            await new Promise((resolve, reject) => {
                image.addEventListener("load", resolve, { once: true });
                image.addEventListener("error", () => reject(
                    new Error("画像をPNG用に展開できませんでした。")
                ), { once: true });
                image.src = dataUrl;
            });
            return image;
        }

        function roundedRect(context, x, y, width, height, radius) {
            const right = x + width;
            const bottom = y + height;
            context.beginPath();
            context.moveTo(x + radius, y);
            context.lineTo(right - radius, y);
            context.quadraticCurveTo(right, y, right, y + radius);
            context.lineTo(right, bottom - radius);
            context.quadraticCurveTo(right, bottom, right - radius, bottom);
            context.lineTo(x + radius, bottom);
            context.quadraticCurveTo(x, bottom, x, bottom - radius);
            context.lineTo(x, y + radius);
            context.quadraticCurveTo(x, y, x + radius, y);
            context.closePath();
        }

        function drawContainedImage(context, image, x, y, width, height, radius) {
            const scale = Math.min(width / image.width, height / image.height);
            const drawWidth = image.width * scale;
            const drawHeight = image.height * scale;
            context.save();
            roundedRect(context, x, y, width, height, radius);
            context.clip();
            context.fillStyle = "#eeeeee";
            context.fillRect(x, y, width, height);
            context.drawImage(
                image,
                x + (width - drawWidth) / 2,
                y + height - drawHeight,
                drawWidth,
                drawHeight
            );
            context.restore();
        }

        function drawCoveredImage(context, image, x, y, width, height, radius) {
            const scale = Math.max(width / image.width, height / image.height);
            const sourceWidth = width / scale;
            const sourceHeight = height / scale;
            const sourceX = (image.width - sourceWidth) / 2;
            const sourceY = (image.height - sourceHeight) / 2;
            context.save();
            roundedRect(context, x, y, width, height, radius);
            context.clip();
            context.drawImage(
                image,
                sourceX,
                sourceY,
                sourceWidth,
                sourceHeight,
                x,
                y,
                width,
                height
            );
            context.restore();
        }

        function drawText(context, text, x, y, font, color = "#27231f") {
            context.fillStyle = color;
            context.font = font;
            context.textBaseline = "top";
            context.fillText(text, x, y);
        }

        function drawThumbnailRow(context, images, items, x, y, width) {
            const gap = 8;
            const columns = 6;
            const itemWidth = (width - gap * (columns - 1)) / columns;
            const itemHeight = itemWidth * 4 / 3;
            images.slice(0, columns).forEach((image, index) => {
                const itemX = x + index * (itemWidth + gap);
                drawCoveredImage(
                    context,
                    image,
                    itemX,
                    y,
                    itemWidth,
                    itemHeight,
                    8
                );
                const emotionEstimate = formatEmotionEstimate(items[index]);
                if (emotionEstimate) {
                    const captionY = y + itemHeight + 4;
                    const captionHeight = 18;
                    roundedRect(
                        context,
                        itemX,
                        captionY,
                        itemWidth,
                        captionHeight,
                        6
                    );
                    context.fillStyle = "#fdf1e3";
                    context.fill();
                    context.fillStyle = "#27231f";
                    context.font = '700 10px "Zen Maru Gothic", sans-serif';
                    context.textAlign = "center";
                    context.textBaseline = "middle";
                    context.fillText(
                        emotionEstimate,
                        itemX + itemWidth / 2,
                        captionY + captionHeight / 2,
                        itemWidth - 6
                    );
                    context.textAlign = "start";
                    context.textBaseline = "top";
                }
            });
        }

        async function cardToPng(loadedArchive) {
            if (document.fonts?.ready) await document.fonts.ready;
            const [lenticularImage, selectedImages, unselectedImages] = await Promise.all([
                loadCanvasImage(loadedArchive.lenticularImageUrl),
                Promise.all(loadedArchive.selectedImages.map(item =>
                    loadCanvasImage(item.imageUrl)
                )),
                Promise.all(loadedArchive.unselectedImages.map(item =>
                    loadCanvasImage(item.imageUrl)
                ))
            ]);
            const { manifest } = loadedArchive;
            const settings = manifest.lenticular.settings;
            const video = manifest.experienceVideo;
            const canvas = document.createElement("canvas");
            canvas.width = EXPORT_WIDTH * EXPORT_SCALE;
            canvas.height = EXPORT_HEIGHT * EXPORT_SCALE;
            const context = canvas.getContext("2d");
            if (!context) throw new Error("Canvasを準備できませんでした。");
            context.scale(EXPORT_SCALE, EXPORT_SCALE);

            roundedRect(context, 0, 0, EXPORT_WIDTH, EXPORT_HEIGHT, 28);
            context.fillStyle = "#ffffff";
            context.fill();

            const padding = 28;
            const gap = 22;
            const contentWidth = EXPORT_WIDTH - padding * 2;
            const mediaWidth = (contentWidth - gap) * 3 / 7;
            const metaX = padding + mediaWidth + gap;
            const metaWidth = EXPORT_WIDTH - padding - metaX;
            const contentHeight = EXPORT_HEIGHT - padding * 2;
            drawContainedImage(
                context,
                lenticularImage,
                padding,
                padding,
                mediaWidth,
                contentHeight,
                14
            );

            drawText(context, manifest.archiveId, metaX, 28,
                '700 34px "Zen Maru Gothic", sans-serif');
            drawText(context, formatCreatedAt(manifest.createdAt), metaX, 76,
                '500 16px "Zen Maru Gothic", sans-serif', "#766f68");
            drawText(
                context,
                `${settings.widthMm}mm × ${settings.heightMm}mm / ${settings.ppi}ppi / ${settings.lpi}lpi`,
                metaX,
                102,
                '500 16px "Zen Maru Gothic", sans-serif',
                "#766f68"
            );
            drawText(
                context,
                video
                    ? `動画 ${video.durationSeconds.toFixed(1)}秒 / ${video.width}×${video.height}`
                    : "体験動画なし",
                metaX,
                128,
                '500 16px "Zen Maru Gothic", sans-serif',
                "#766f68"
            );
            if (video) {
                drawText(context, "動画を再生", metaX + metaWidth - 88, 128,
                    '700 16px "Zen Maru Gothic", sans-serif', "#f19935");
            }

            const attributeSummary = formatAttributeSummary(loadedArchive.attributes);
            drawText(
                context,
                attributeSummary ? `属性 ${attributeSummary}` : "属性 未登録",
                metaX,
                154,
                '700 14px "Zen Maru Gothic", sans-serif',
                attributeSummary ? "#27231f" : "#766f68"
            );

            drawText(context, `選択した${selectedImages.length}枚`, metaX, 184,
                '700 16px "Zen Maru Gothic", sans-serif');
            drawThumbnailRow(
                context,
                selectedImages,
                loadedArchive.selectedImages,
                metaX,
                214,
                metaWidth
            );
            if (unselectedImages.length) {
                drawText(context, "選択されなかった表情", metaX, 362,
                    '700 16px "Zen Maru Gothic", sans-serif');
                drawThumbnailRow(
                    context,
                    unselectedImages,
                    loadedArchive.unselectedImages,
                    metaX,
                    392,
                    metaWidth
                );
            }

            return await new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error("PNGに変換できませんでした。"));
                }, "image/png");
            });
        }

        async function downloadCard(loadedArchive, button) {
            button.disabled = true;
            setStatus(`${loadedArchive.manifest.archiveId}のPNGを作成しています...`);
            try {
                const png = await cardToPng(loadedArchive);
                const url = URL.createObjectURL(png);
                const link = document.createElement("a");
                link.href = url;
                link.download = `${loadedArchive.manifest.archiveId}-archive-card.png`;
                document.body.append(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus(`${loadedArchive.manifest.archiveId}のPNGを保存しました`);
            } catch (error) {
                console.error(error);
                setStatus(`PNGを作成できませんでした: ${error.message}`);
            } finally {
                button.disabled = false;
            }
        }

        function openPrintArchive(loadedArchive, button) {
            if (activePrintButton && activePrintButton !== button) {
                activePrintButton.disabled = false;
            }
            activePrintArchive = loadedArchive;
            activePrintButton = button;
            button.disabled = true;
            setStatus("印刷画面を開いています...");
            cardWindow = window.open(
                "./card/index.html",
                "motion2-archive-print-card",
                CARD_POPUP_FEATURES
            );
            if (!cardWindow) {
                button.disabled = false;
                setStatus("印刷画面を開けませんでした");
            }
        }

        function registerArchiveAttributes(
            loadedArchive,
            genderSelect,
            ageInput,
            button
        ) {
            if (!ageInput.reportValidity()) return;
            const age = ageInput.value === "" ? "" : Number(ageInput.value);
            const attributes = {
                gender: genderSelect.value,
                age
            };
            loadedArchive.attributes = attributes;
            let savedOnDevice = true;
            try {
                localStorage.setItem(
                    `${ATTRIBUTE_STORAGE_PREFIX}${loadedArchive.manifest.archiveId}`,
                    JSON.stringify(attributes)
                );
            } catch (error) {
                savedOnDevice = false;
                console.warn("属性を端末へ保存できませんでした。", error);
            }
            button.textContent = savedOnDevice ? "登録済み" : "反映済み";
            setStatus(savedOnDevice
                ? `${loadedArchive.manifest.archiveId}の属性を登録しました`
                : "属性はこの画面内に反映しましたが、端末には保存できませんでした"
            );
            window.setTimeout(() => {
                if (button.isConnected) button.textContent = "登録";
            }, 1200);
        }

        function createArchiveCard(loadedArchive) {
            const card = archiveCardTemplate.content.firstElementChild.cloneNode(true);
            const { manifest } = loadedArchive;
            const settings = manifest.lenticular.settings;
            const video = manifest.experienceVideo;
            const videoLink = card.querySelector(".archive-video-link");
            const unselectedSection = card.querySelector(".unselected-section");
            const genderSelect = card.querySelector(".attribute-gender");
            const ageInput = card.querySelector(".attribute-age");
            const attributeSaveButton = card.querySelector(".attribute-save-button");
            const printButton = card.querySelector(".print-button");
            const downloadButton = card.querySelector(".download-button");
            loadedArchive.attributes = loadArchiveAttributes(manifest.archiveId);
            genderSelect.value = loadedArchive.attributes.gender;
            ageInput.value = loadedArchive.attributes.age;

            card.querySelector(".archive-id").textContent = manifest.archiveId;
            card.querySelector(".selected-title").textContent =
                `選択した${loadedArchive.selectedImages.length}枚`;
            card.querySelector(".archive-created-at").textContent =
                formatCreatedAt(manifest.createdAt);
            card.querySelector(".archive-settings").textContent =
                `${settings.widthMm}mm × ${settings.heightMm}mm`
                + ` / ${settings.ppi}ppi / ${settings.lpi}lpi`;
            card.querySelector(".archive-video-meta").textContent = video
                ? `動画 ${video.durationSeconds.toFixed(1)}秒`
                    + ` / ${video.width}×${video.height}`
                : "体験動画なし";
            card.querySelector(".lenticular-preview").src =
                loadedArchive.lenticularImageUrl;
            if (loadedArchive.experienceVideoUrl) {
                videoLink.href = loadedArchive.experienceVideoUrl;
                videoLink.hidden = false;
            }
            renderArchiveImages(
                card.querySelector(".selected-images"),
                loadedArchive.selectedImages,
                "選択画像"
            );
            renderArchiveImages(
                card.querySelector(".unselected-images"),
                loadedArchive.unselectedImages,
                "未選択画像"
            );
            unselectedSection.hidden = !loadedArchive.unselectedImages.length;
            attributeSaveButton.addEventListener("click", () =>
                registerArchiveAttributes(
                    loadedArchive,
                    genderSelect,
                    ageInput,
                    attributeSaveButton
                )
            );
            printButton.addEventListener("click", () =>
                openPrintArchive(loadedArchive, printButton)
            );
            downloadButton.addEventListener("click", () =>
                downloadCard(loadedArchive, downloadButton)
            );
            return card;
        }

        async function loadArchives(files) {
            const nextFiles = [...files];
            if (!nextFiles.length) return;
            let loadedCount = 0;
            const errors = [];
            setStatus(`${nextFiles.length}件のアーカイブを読み込んでいます...`);

            for (const file of nextFiles) {
                try {
                    const loadedArchive = await MotionFacecardArchive.read(file);
                    loadedArchives.push(loadedArchive);
                    archiveList.append(createArchiveCard(loadedArchive));
                    loadedCount++;
                    setStatus(`${loadedCount}/${nextFiles.length}件を読み込みました`);
                } catch (error) {
                    console.error(error);
                    errors.push(`${file.name}: ${error.message}`);
                }
            }

            const total = loadedArchives.length;
            setStatus(errors.length
                ? `${loadedCount}件を追加（表示中${total}件）／${errors.length}件を読み込めませんでした`
                : `${loadedCount}件を追加しました（表示中${total}件）`
            );
        }

        function sendCardPayload() {
            if (!activePrintArchive || !cardWindow || cardWindow.closed) return;
            cardWindow.postMessage({
                source: "motion-archive",
                type: "lenticular-card",
                imageUrl: activePrintArchive.lenticularImageUrl,
                cardArtUrl: activePrintArchive.cardArtUrl,
                archiveId: activePrintArchive.manifest.archiveId
            }, targetOrigin);
        }

        archiveFile.addEventListener("change", () => {
            loadArchives(archiveFile.files);
            archiveFile.value = "";
        });

        for (const eventName of ["dragenter", "dragover"]) {
            archiveDrop.addEventListener(eventName, event => {
                event.preventDefault();
                archiveDrop.classList.add("is-dragging");
            });
        }
        for (const eventName of ["dragleave", "drop"]) {
            archiveDrop.addEventListener(eventName, event => {
                event.preventDefault();
                archiveDrop.classList.remove("is-dragging");
            });
        }
        archiveDrop.addEventListener("drop", event => {
            loadArchives(event.dataTransfer.files);
        });

        window.addEventListener("message", event => {
            if (
                event.source !== cardWindow
                || event.data?.source !== "motion-card"
                || (location.origin !== "null" && event.origin !== location.origin)
            ) {
                return;
            }
            if (event.data.type === "card-ready") {
                sendCardPayload();
            } else if (event.data.type === "card-received") {
                if (activePrintButton) activePrintButton.disabled = false;
                setStatus(`${activePrintArchive.manifest.archiveId}を印刷画面へ送りました`);
            } else if (event.data.type === "card-error") {
                if (activePrintButton) activePrintButton.disabled = false;
                setStatus("印刷画像を準備できませんでした");
            }
        });

        window.addEventListener("beforeunload", () => {
            for (const loadedArchive of loadedArchives) loadedArchive.revoke();
        });
    </script>
</body>

</html>
