<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>再印刷用</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --accent: #f19935;
            --ink: #27231f;
            --muted: #766f68;
            --panel: rgb(255 255 255 / 88%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            padding: clamp(20px, 4vw, 48px);
            background: linear-gradient(rgb(255 255 255 / 42%), rgb(255 255 255 / 42%));
            color: var(--ink);
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
        }

        button,
        input {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }

        .archive-shell {
            width: min(1040px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(1.7rem, 3.8vw, 2.8rem);
        }

        .archive-drop {
            display: grid;
            min-height: 180px;
            place-items: center;
            border: 4px dashed rgb(241 153 53 / 62%);
            border-radius: 28px;
            padding: 24px;
            background: var(--panel);
            text-align: center;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .archive-drop.is-dragging {
            border-color: var(--accent);
            transform: scale(1.01);
        }

        .archive-file-label,
        .print-button {
            display: inline-grid;
            min-height: 52px;
            place-items: center;
            border: 0;
            border-radius: 16px;
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        #archiveFile {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .archive-hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-weight: 500;
        }

        .archive-status {
            min-height: 1.5em;
            margin: 14px 4px;
            color: var(--muted);
        }

        .archive-card {
            display: grid;
            width: min(1040px, 100%);
            min-height: 0;
            aspect-ratio: 5 / 3;
            grid-template-columns: minmax(0, 3fr) minmax(0, 4fr);
            gap: clamp(14px, 2.5vw, 22px);
            border-radius: 28px;
            margin-inline: auto;
            padding: clamp(20px, 3vw, 28px);
            background: var(--panel);
            box-shadow: 0 18px 46px rgb(74 53 31 / 12%);
        }

        .archive-media {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-content: start;
        }

        .lenticular-preview {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 14px;
            object-fit: cover;
            background: #eee;
        }

        .archive-meta {
            display: grid;
            align-content: start;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 14px;
        }

        .archive-meta h2 {
            grid-column: 1 / -1;
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
        }

        .archive-meta p {
            margin: 0;
            color: var(--muted);
        }

        .archive-video-link {
            width: fit-content;
            color: var(--accent);
            text-underline-offset: 0.2em;
        }

        .selected-title {
            margin: 12px 0 8px;
            font-size: 1rem;
        }

        .archive-meta > .selected-title,
        .archive-meta > .selected-grid,
        .archive-meta > #unselectedSection {
            grid-column: 1 / -1;
        }

        .selected-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
        }

        .selected-grid img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            object-fit: cover;
        }

        .print-button {
            width: fit-content;
            grid-column: 1 / -1;
            margin-top: 14px;
        }

        .print-button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        @media (min-width: 901px) {
            .archive-media {
                height: 100%;
            }

            .lenticular-preview {
                height: 100%;
                aspect-ratio: auto;
                object-fit: contain;
                object-position: center bottom;
            }

            .archive-meta {
                height: 100%;
                grid-template-rows: auto auto auto auto auto 1fr auto;
            }

            .print-button {
                grid-column: 2;
                grid-row: 7;
                align-self: end;
                justify-self: end;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .archive-card {
                aspect-ratio: auto;
                grid-template-columns: 1fr;
            }

            .archive-media {
                width: min(520px, 100%);
                margin-inline: auto;
            }

            .selected-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

        }

        @media (max-width: 380px) {
            .archive-meta {
                grid-template-columns: 1fr;
            }

            .archive-meta > * {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>
    <main class="archive-shell">
        <section id="archiveDrop" class="archive-drop">
            <div>
                <label class="archive-file-label" for="archiveFile">アーカイブを選択</label>
                <input id="archiveFile" type="file" accept=".zip,.facecard.zip,application/zip">
                <p class="archive-hint">facecard.zipをここへドラッグ＆ドロップ</p>
            </div>
        </section>
        <p id="archiveStatus" class="archive-status" role="status"></p>

        <section id="archiveCard" class="archive-card" hidden>
            <div class="archive-media">
                <img id="lenticularPreview" class="lenticular-preview" alt="レンチキュラー画像">
            </div>
            <div class="archive-meta">
                <h2 id="archiveId"></h2>
                <p id="archiveCreatedAt"></p>
                <p id="archiveSettings"></p>
                <p id="archiveVideoMeta"></p>
                <a id="experienceVideoLink" class="archive-video-link" target="_blank" rel="noopener" hidden>動画を再生</a>
                <h3 class="selected-title">選択した6枚</h3>
                <div id="selectedGrid" class="selected-grid"></div>
                <div id="unselectedSection">
                    <h3 class="selected-title">選択されなかった表情</h3>
                    <div id="unselectedGrid" class="selected-grid"></div>
                </div>
                <button id="printArchive" class="print-button" type="button">再印刷</button>
            </div>
        </section>
    </main>

    <script src="./facecard-archive.js"></script>
    <script>
        const archiveDrop = document.getElementById("archiveDrop");
        const archiveFile = document.getElementById("archiveFile");
        const archiveStatus = document.getElementById("archiveStatus");
        const archiveCard = document.getElementById("archiveCard");
        const archiveId = document.getElementById("archiveId");
        const archiveCreatedAt = document.getElementById("archiveCreatedAt");
        const archiveSettings = document.getElementById("archiveSettings");
        const archiveVideoMeta = document.getElementById("archiveVideoMeta");
        const lenticularPreview = document.getElementById("lenticularPreview");
        const experienceVideoLink = document.getElementById("experienceVideoLink");
        const selectedGrid = document.getElementById("selectedGrid");
        const unselectedSection = document.getElementById("unselectedSection");
        const unselectedGrid = document.getElementById("unselectedGrid");
        const printArchive = document.getElementById("printArchive");
        const targetOrigin = location.origin === "null" ? "*" : location.origin;
        const CARD_POPUP_FEATURES =
            "popup=yes,width=900,height=700,resizable=yes,scrollbars=yes";
        let loadedArchive = null;
        let cardWindow = null;

        function setStatus(message) {
            archiveStatus.textContent = message;
        }

        function formatCreatedAt(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime())
                ? value
                : new Intl.DateTimeFormat("ja-JP", {
                    dateStyle: "long",
                    timeStyle: "medium"
                }).format(date);
        }

        function createArchiveImage(item, index, label) {
            const image = document.createElement("img");
            const capturedAt = Number(item.capturedAtSeconds);
            const capturedAtText = Number.isFinite(capturedAt)
                ? `${capturedAt.toFixed(1)}秒`
                : "時刻不明";
            image.src = item.imageUrl;
            image.alt = `${label} ${index + 1}`;
            image.title = item.emotion
                ? `${item.emotion} / ${capturedAtText}`
                : capturedAtText;
            return image;
        }

        function renderArchiveImages(container, items, label) {
            container.replaceChildren(
                ...items.map((item, index) =>
                    createArchiveImage(item, index, label)
                )
            );
        }

        async function loadArchive(file) {
            if (!file) return;
            setStatus("アーカイブを読み込んでいます...");
            printArchive.disabled = true;
            try {
                const nextArchive = await MotionFacecardArchive.read(file);
                loadedArchive?.revoke();
                loadedArchive = nextArchive;
                const { manifest } = loadedArchive;
                const settings = manifest.lenticular.settings;
                const video = manifest.experienceVideo;

                archiveId.textContent = manifest.archiveId;
                archiveCreatedAt.textContent = formatCreatedAt(manifest.createdAt);
                archiveSettings.textContent =
                    `${settings.widthMm}mm × ${settings.heightMm}mm`
                    + ` / ${settings.ppi}ppi / ${settings.lpi}lpi`;
                archiveVideoMeta.textContent = video
                    ? `動画 ${video.durationSeconds.toFixed(1)}秒`
                        + ` / ${video.width}×${video.height}`
                    : "体験動画なし";
                lenticularPreview.src = loadedArchive.lenticularImageUrl;
                if (loadedArchive.experienceVideoUrl) {
                    experienceVideoLink.href = loadedArchive.experienceVideoUrl;
                    experienceVideoLink.hidden = false;
                } else {
                    experienceVideoLink.removeAttribute("href");
                    experienceVideoLink.hidden = true;
                }
                renderArchiveImages(
                    selectedGrid,
                    loadedArchive.selectedImages,
                    "選択画像"
                );
                renderArchiveImages(
                    unselectedGrid,
                    loadedArchive.unselectedImages,
                    "未選択画像"
                );
                unselectedSection.hidden = !loadedArchive.unselectedImages.length;
                archiveCard.hidden = false;
                printArchive.disabled = false;
                setStatus(`${file.name}を読み込みました`);
            } catch (error) {
                console.error(error);
                archiveCard.hidden = true;
                setStatus(`読み込めませんでした: ${error.message}`);
            }
        }

        function sendCardPayload() {
            if (!loadedArchive || !cardWindow || cardWindow.closed) return;
            cardWindow.postMessage({
                source: "motion-archive",
                type: "lenticular-card",
                imageUrl: loadedArchive.lenticularImageUrl,
                cardArtUrl: loadedArchive.cardArtUrl,
                archiveId: loadedArchive.manifest.archiveId
            }, targetOrigin);
        }

        archiveFile.addEventListener("change", () => {
            loadArchive(archiveFile.files[0]);
            archiveFile.value = "";
        });

        for (const eventName of ["dragenter", "dragover"]) {
            archiveDrop.addEventListener(eventName, event => {
                event.preventDefault();
                archiveDrop.classList.add("is-dragging");
            });
        }
        for (const eventName of ["dragleave", "drop"]) {
            archiveDrop.addEventListener(eventName, event => {
                event.preventDefault();
                archiveDrop.classList.remove("is-dragging");
            });
        }
        archiveDrop.addEventListener("drop", event => {
            loadArchive(event.dataTransfer.files[0]);
        });

        printArchive.addEventListener("click", () => {
            if (!loadedArchive) return;
            printArchive.disabled = true;
            setStatus("印刷画面を開いています...");
            cardWindow = window.open(
                "./card/index.html",
                "motion2-archive-print-card",
                CARD_POPUP_FEATURES
            );
            if (!cardWindow) {
                printArchive.disabled = false;
                setStatus("印刷画面を開けませんでした");
            }
        });

        window.addEventListener("message", event => {
            if (
                event.source !== cardWindow
                || event.data?.source !== "motion-card"
                || (location.origin !== "null" && event.origin !== location.origin)
            ) {
                return;
            }
            if (event.data.type === "card-ready") {
                sendCardPayload();
            } else if (event.data.type === "card-received") {
                printArchive.disabled = false;
                setStatus(`${loadedArchive.manifest.archiveId}を印刷画面へ送りました`);
            } else if (event.data.type === "card-error") {
                printArchive.disabled = false;
                setStatus("印刷画像を準備できませんでした");
            }
        });

        window.addEventListener("beforeunload", () => loadedArchive?.revoke());
    </script>
</body>

</html>
