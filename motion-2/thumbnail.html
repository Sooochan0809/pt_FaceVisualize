<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffdf8">
    <title>サムネイル</title>
    <style>
        :root {
            --poster-width: 1151;
            --poster-height: 2047;

            /* 画像2：Suitopiaぷちフェス！＋顔あそび */
            --title-left: 22.5022%;
            --title-top: 33.6590%;
            --title-width: 56.2120%;

            /* 画像3：体験その①＋説明文 */
            --detail-left: 16.4205%;
            --detail-top: 49.1451%;
            --detail-width: 66.7246%;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100dvh;
            overflow: hidden;
            background: #ececec;
            font-family:
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                "Noto Sans JP",
                sans-serif;
        }

        .poster {
            position: relative;
            width: min(100vw, calc(100dvh * var(--poster-width) / var(--poster-height)));
            height: min(100dvh, calc(100vw * var(--poster-height) / var(--poster-width)));
            overflow: hidden;
            background: #fffdf8;
        }

        .layer {
            position: absolute;
            display: block;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            image-rendering: auto;
        }

        .background {
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        .title {
            left: var(--title-left);
            top: var(--title-top);
            width: var(--title-width);
        }

        .detail {
            left: var(--detail-left);
            top: var(--detail-top);
            width: var(--detail-width);
        }

        @media (max-aspect-ratio: 1151/2047) {
            body {
                background: #fffdf8;
            }
        }

        @media print {
            @page {
                margin: 0;
            }

            body {
                display: block;
                overflow: visible;
                background: #ffffff;
            }

            .poster {
                width: 100vw;
                height: auto;
                aspect-ratio: calc(var(--poster-width) / var(--poster-height));
            }
        }
    </style>
</head>

<body>
    <main class="poster" aria-label="Suitopiaぷちフェス 顔あそび 体験その1">
        <img class="layer background" src="background.png" alt="" aria-hidden="true">
        <img class="layer title" src="title_block.png" alt="Suitopiaぷちフェス！ 顔あそび">
        <img class="layer detail" src="detail_block.png" alt="体験その① 顔をたくさん動かして、いろんな形を作ってみよう！">
    </main>
</body>

</html>
