<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顔あそび｜L判印刷</title>
  <style>
    :root {
      --paper-width: 89mm;
      --paper-height: 127mm;
      --visual-width: 65mm;
      --visual-height: 100mm;
      --visual-left: 12mm;
      --visual-top: 13.5mm;
      --photo-width: 36mm;
      --photo-height: 48mm;
      --photo-left: 14.5mm;
      --photo-top: 16.875mm;
      --accent: #f19935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #eeeeee;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        "Noto Sans JP",
        sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    .print-sheet {
      position: relative;
      width: var(--paper-width);
      height: var(--paper-height);
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 3mm 8mm rgb(0 0 0 / 18%);
    }

    .visual-card {
      position: absolute;
      left: var(--visual-left);
      top: var(--visual-top);
      width: var(--visual-width);
      height: var(--visual-height);
      overflow: hidden;
    }

    .card-art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .photo-slot {
      position: absolute;
      left: var(--photo-left);
      top: var(--photo-top);
      z-index: 2;
      display: block;
      width: var(--photo-width);
      height: var(--photo-height);
      object-fit: cover;
      object-position: center;
    }

    .print-actions {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
    }

    .print-button {
      min-width: 140px;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 10px 22px;
      background: var(--accent);
      box-shadow: 0 5px 12px rgb(0 0 0 / 16%);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .print-button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    @page {
      size: 89mm 127mm;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: var(--paper-width);
        height: var(--paper-height);
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
      }

      body {
        display: block;
      }

      .print-sheet {
        margin: 0;
        box-shadow: none;
      }

      .card-art,
      .photo-slot {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .print-actions {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="print-sheet">
    <section class="visual-card" aria-label="顔あそび記念カード">
      <img
        class="card-art"
        src="./assets/card-art.png"
        alt="Suitopia ぷちフェス 顔あそび 2026年8月2日"
      >
      <img
        id="lenticularPhoto"
        class="photo-slot"
        alt="選択した6枚の表情から生成したレンチキュラー画像"
        hidden
      >
    </section>
  </main>

  <div class="print-actions">
    <button id="printButton" class="print-button" type="button" disabled>印刷</button>
  </div>

  <script>
    const lenticularPhoto = document.getElementById("lenticularPhoto");
    const printButton = document.getElementById("printButton");
    const targetOrigin = location.origin === "null" ? "*" : location.origin;
    const PRINT_RENDER_DELAY_MS = 300;

    printButton.addEventListener("click", () => window.print());

    async function printAutomatically() {
      if (document.fonts?.ready) await document.fonts.ready;
      await new Promise(resolve => setTimeout(resolve, PRINT_RENDER_DELAY_MS));
      window.focus();
      window.print();
    }

    window.addEventListener("message", event => {
      if (event.source !== window.opener || event.data?.source !== "motion-control-panel") return;
      if (location.origin !== "null" && event.origin !== location.origin) return;
      if (event.data.type !== "lenticular-card" || !event.data.imageUrl) return;

      lenticularPhoto.onload = () => {
        lenticularPhoto.hidden = false;
        printButton.disabled = false;
        window.opener?.postMessage(
          { source: "motion-card", type: "card-received" },
          targetOrigin
        );
        printAutomatically();
      };
      lenticularPhoto.src = event.data.imageUrl;
    });

    window.opener?.postMessage(
      { source: "motion-card", type: "card-ready" },
      targetOrigin
    );
  </script>
</body>

</html>
