<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顔あそび｜L判印刷</title>
  <style>
    :root {
      --paper-width: 89mm;
      --paper-height: 127mm;
      --visual-width: 65mm;
      --visual-height: 100mm;
      --visual-left: 12mm;
      --visual-top: 13.5mm;
      --photo-width: 36mm;
      --photo-height: 48mm;
      --photo-left: 14.5mm;
      --photo-top: 16.875mm;
      --crop-mark-length: 5mm;
      --crop-mark-gap: 2mm;
      --crop-mark-width: 0.15mm;
      --accent: #f19935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #eeeeee;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        "Noto Sans JP",
        sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    .print-sheet {
      position: relative;
      width: var(--paper-width);
      height: var(--paper-height);
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 3mm 8mm rgb(0 0 0 / 18%);
    }

    .visual-card {
      position: absolute;
      left: var(--visual-left);
      top: var(--visual-top);
      width: var(--visual-width);
      height: var(--visual-height);
      overflow: hidden;
    }

    .card-art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .photo-slot {
      position: absolute;
      left: var(--photo-left);
      top: var(--photo-top);
      z-index: 2;
      display: block;
      width: var(--photo-width);
      height: var(--photo-height);
      object-fit: cover;
      object-position: center;
    }

    .crop-mark {
      position: absolute;
      left: var(--crop-x);
      top: var(--crop-y);
      z-index: 3;
      pointer-events: none;
    }

    .crop-mark::before,
    .crop-mark::after {
      content: "";
      position: absolute;
      display: block;
      background: #000000;
    }

    .crop-mark::before {
      top: calc(var(--crop-mark-width) / -2);
      width: var(--crop-mark-length);
      height: var(--crop-mark-width);
    }

    .crop-mark::after {
      left: calc(var(--crop-mark-width) / -2);
      width: var(--crop-mark-width);
      height: var(--crop-mark-length);
    }

    .crop-mark.is-left {
      --crop-x: var(--visual-left);
    }

    .crop-mark.is-right {
      --crop-x: calc(var(--visual-left) + var(--visual-width));
    }

    .crop-mark.is-top {
      --crop-y: var(--visual-top);
    }

    .crop-mark.is-bottom {
      --crop-y: calc(var(--visual-top) + var(--visual-height));
    }

    .crop-mark.is-left::before {
      right: var(--crop-mark-gap);
    }

    .crop-mark.is-right::before {
      left: var(--crop-mark-gap);
    }

    .crop-mark.is-top::after {
      bottom: var(--crop-mark-gap);
    }

    .crop-mark.is-bottom::after {
      top: var(--crop-mark-gap);
    }

    .print-actions {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
    }

    .print-button {
      min-width: 140px;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 10px 22px;
      background: var(--accent);
      box-shadow: 0 5px 12px rgb(0 0 0 / 16%);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .print-button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    @page {
      size: 89mm 127mm;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: var(--paper-width);
        height: var(--paper-height);
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
      }

      body {
        display: block;
      }

      .print-sheet {
        margin: 0;
        box-shadow: none;
      }

      .card-art,
      .photo-slot,
      .crop-mark {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .print-actions {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="print-sheet">
    <section class="visual-card" aria-label="顔あそび記念カード">
      <img
        id="cardArt"
        class="card-art"
        src="./assets/card-art.png"
        alt="Suitopia ぷちフェス 顔あそび 2026年8月2日"
      >
      <img
        id="lenticularPhoto"
        class="photo-slot"
        alt="選択した6枚の表情から生成したレンチキュラー画像"
        hidden
      >
    </section>
    <div aria-hidden="true">
      <span class="crop-mark is-left is-top"></span>
      <span class="crop-mark is-right is-top"></span>
      <span class="crop-mark is-left is-bottom"></span>
      <span class="crop-mark is-right is-bottom"></span>
    </div>
  </main>

  <div class="print-actions">
    <button id="printButton" class="print-button" type="button" disabled>印刷</button>
  </div>

  <script>
    const lenticularPhoto = document.getElementById("lenticularPhoto");
    const cardArt = document.getElementById("cardArt");
    const printButton = document.getElementById("printButton");
    const targetOrigin = location.origin === "null" ? "*" : location.origin;
    const PRINT_RENDER_DELAY_MS = 300;
    const ALLOWED_MESSAGE_SOURCES = new Set([
      "motion-control-panel",
      "motion-archive"
    ]);

    printButton.addEventListener("click", () => window.print());

    async function printAutomatically() {
      if (document.fonts?.ready) await document.fonts.ready;
      await new Promise(resolve => setTimeout(resolve, PRINT_RENDER_DELAY_MS));
      window.focus();
      window.opener?.postMessage(
        { source: "motion-card", type: "card-print-started" },
        targetOrigin
      );
      window.print();
    }

    function loadImage(image, source) {
      return new Promise((resolve, reject) => {
        image.onload = () => resolve();
        image.onerror = reject;
        image.src = source;
        if (image.complete && image.naturalWidth) resolve();
      });
    }

    window.addEventListener("message", async event => {
      if (
        event.source !== window.opener
        || !ALLOWED_MESSAGE_SOURCES.has(event.data?.source)
      ) return;
      if (location.origin !== "null" && event.origin !== location.origin) return;
      if (event.data.type !== "lenticular-card" || !event.data.imageUrl) return;

      try {
        await Promise.all([
          event.data.cardArtUrl
            ? loadImage(cardArt, event.data.cardArtUrl)
            : cardArt.decode(),
          loadImage(lenticularPhoto, event.data.imageUrl)
        ]);
        lenticularPhoto.hidden = false;
        printButton.disabled = false;
        window.opener?.postMessage(
          { source: "motion-card", type: "card-received" },
          targetOrigin
        );
        printAutomatically();
      } catch (error) {
        console.error("印刷画像を読み込めませんでした", error);
        window.opener?.postMessage(
          { source: "motion-card", type: "card-error" },
          targetOrigin
        );
      }
    });

    window.opener?.postMessage(
      { source: "motion-card", type: "card-ready" },
      targetOrigin
    );
  </script>
</body>

</html>
