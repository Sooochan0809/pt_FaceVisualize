<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --panel-bg: #1b2026e0;
            --accent: #42d392;
            --shape-center-y: 40%;
            --start-reveal-delay: 0.2s;
            --start-reveal-duration: 1.85s;
            --thumbnail-exit-duration: 1.3s;
            --scene-transition-easing: cubic-bezier(0.5, 0, 0.18, 1);
            --thumbnail-transition-easing: cubic-bezier(0.55, 0, 0.3, 1);
            --thumbnail-return-delay:
                calc(var(--start-reveal-delay) + var(--start-reveal-duration) - var(--thumbnail-exit-duration));
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #f0f0f0;
            color: #f4f7fb;
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
        }

        main {
            position: relative;
            width: min(100dvw, 75dvh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            overflow: hidden;
            pointer-events: none;
        }

        #startScreen[hidden] {
            display: none;
        }

        #startThumbnail {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        #thumbnailReturnBackground {
            position: absolute;
            inset: 0;
            z-index: 1001;
            overflow: hidden;
        }

        #thumbnailReturnBackground[hidden] {
            display: none;
        }

        #thumbnailReturnBackground::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                url("./assets/images/background.png") center / 100% 100% no-repeat;
            pointer-events: none;
        }

        .thumbnailReturnIris {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: 0 0 0 200vmax #f0f0f0;
            transform: translate(-50%, -50%);
            will-change: width;
        }

        .startThumbnailLayer,
        #experienceBackground {
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .startThumbnailLayer {
            position: absolute;
            height: auto;
        }

        #experienceBackground {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        #experienceBackground {
            z-index: 3;
        }

        .startThumbnailTitle {
            --thumbnail-exit-y: -55vh;
            top: 33.659%;
            left: 22.5022%;
            z-index: 1002;
            width: 56.212%;
        }

        .startThumbnailDetail {
            --thumbnail-exit-y: 55vh;
            top: 49.1451%;
            left: 16.4205%;
            z-index: 1002;
            width: 66.7246%;
        }

        #stage.is-preparing #video,
        #stage.is-preparing .visualize {
            clip-path: circle(0 at 50% 50%);
        }

        #stage.is-preparing #canvas {
            display: none;
        }

        #stage.is-starting #video,
        #stage.is-starting .visualize {
            animation:
                revealExperienceScene var(--start-reveal-duration) var(--scene-transition-easing) var(--start-reveal-delay) both;
        }

        #startScreen.is-returning .thumbnailReturnIris {
            animation:
                openThumbnailIris var(--start-reveal-duration) var(--scene-transition-easing) reverse both;
        }

        #startScreen.is-transitioning .startThumbnailTitle,
        #startScreen.is-transitioning .startThumbnailDetail {
            animation:
                exitThumbnailLayer var(--thumbnail-exit-duration) var(--thumbnail-transition-easing) forwards;
        }

        #startScreen.is-returning .startThumbnailTitle,
        #startScreen.is-returning .startThumbnailDetail {
            animation:
                exitThumbnailLayer var(--thumbnail-exit-duration) var(--thumbnail-transition-easing) var(--thumbnail-return-delay) reverse both;
        }

        @keyframes revealExperienceScene {
            from {
                clip-path: circle(0 at 50% 50%);
            }

            to {
                clip-path: circle(115% at 50% 50%);
            }
        }

        @keyframes openThumbnailIris {
            from {
                width: 0;
            }

            to {
                width: 230%;
            }
        }

        @keyframes exitThumbnailLayer {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(var(--thumbnail-exit-y));
            }
        }

        video,
        #sourceImage,
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        video,
        #sourceImage {
            z-index: 0;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            z-index: 4;
            transform: scaleX(-1);
        }

        video[hidden],
        #sourceImage[hidden],
        #canvas[hidden] {
            display: none;
        }

        main.file-source video,
        main.file-source #sourceImage {
            object-fit: contain;
        }

        canvas {
            pointer-events: none;
        }

        .visualize {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: #f0f0f0df;
            transition: background-color 0.8s ease;
        }

        #calibrationGuide {
            position: absolute;
            inset: 0;
            z-index: 6;
            isolation: isolate;
            display: grid;
            place-items: center;
            pointer-events: none;
            text-align: center;
            font-weight: 500;
        }

        #calibrationGuide[hidden] {
            display: none;
        }

        #calibrationPoint {
            position: absolute;
            top: var(--shape-center-y);
            left: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%) rotate(-90deg);
            filter:
                drop-shadow(0 0 5px rgb(255 255 255 / 100%)) drop-shadow(0 0 14px rgb(47 207 131 / 58%));
            animation: calibrationPointPulse 1.4s ease-in-out infinite;
        }

        #calibrationPointCenter {
            fill: #2fcf83;
            stroke: #fff;
            stroke-width: 2.5;
        }

        #calibrationPointBase,
        #calibrationPointProgress {
            fill: none;
            stroke-width: 6;
        }

        #calibrationPointBase {
            stroke: rgb(255 255 255 / 92%);
        }

        #calibrationPointProgress {
            stroke: #2fcf83;
            stroke-dasharray: 100;
            stroke-dashoffset: calc(100 - var(--progress, 0));
            transition: stroke-dashoffset 0.12s linear;
        }

        @keyframes calibrationPointPulse {

            0%,
            100% {
                transform: translate(-50%, -50%) rotate(-90deg) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) rotate(-90deg) scale(1.08);
            }
        }

        #calibrationCard {
            position: absolute;
            inset: 0;
            color: #111;
        }

        #calibrationGuideText {
            position: absolute;
            top: calc(var(--shape-center-y) - 8rem);
            left: 3%;
            width: 94%;
            font-size: clamp(1rem, 3.6vw, 3.2rem);
            line-height: 1.65;
            white-space: nowrap;
            text-align: center;
            text-shadow:
                0 1px 8px rgb(255 255 255 / 95%),
                0 1px 18px rgb(255 255 255 / 85%);
        }

        #calibrationGuide[data-phase="positioning"] #calibrationPoint {
            visibility: hidden;
        }

        #experienceAnnouncement {
            position: absolute;
            top: var(--shape-center-y);
            left: 50%;
            z-index: 5;
            width: max-content;
            max-width: 94%;
            padding: 0.55em 1em 0.65em;
            border: 4px solid #fff;
            border-radius: 999px;
            background: #2fcf83;
            box-shadow:
                0 10px 0 rgb(20 123 78 / 22%),
                0 18px 42px rgb(20 123 78 / 30%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            color: #fff;
            font-size: clamp(1.7rem, 4.6vw, 2.6rem);
            font-weight: 700;
            white-space: nowrap;
            text-align: center;
            animation: experienceAnnouncementPop 0.55s cubic-bezier(0.2, 1.6, 0.45, 1) both;
        }

        #experienceAnnouncement[hidden] {
            display: none;
        }

        #experienceHud[data-guide="timer"] #experienceTimer,
        #experienceHud[data-guide="score"] #experienceScore {
            animation: experienceGuideFocus 0.9s ease-in-out infinite alternate;
        }

        @keyframes experienceAnnouncementPop {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.72);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes experienceGuideFocus {
            from {
                filter: drop-shadow(0 0 0 rgb(47 207 131 / 0%));
            }

            to {
                filter: drop-shadow(0 0 18px rgb(47 207 131 / 58%));
            }
        }

        #experienceHud {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            color: #111;
            font-weight: 700;
        }

        #experienceHud[hidden] {
            display: none;
        }

        #experienceTimer {
            position: absolute;
            top: clamp(24px, 4vh, 54px);
            border: 3px solid rgb(255 255 255 / 92%);
            border-radius: 999px;
            background: rgb(255 255 255 / 78%);
            box-shadow: 0 8px 24px rgb(31 24 53 / 14%);
            backdrop-filter: blur(8px);
            left: 50%;
            min-width: 4.7em;
            padding: 0.3em 0.75em 0.4em;
            transform: translateX(-50%);
            font-size: clamp(1.45rem, 4vw, 2.15rem);
            text-align: center;
        }

        #experienceTimerValue {
            display: inline-block;
            min-width: 1.4em;
            font-variant-numeric: tabular-nums;
        }

        #experienceTimerValue.is-warning {
            color: #df8e14;
            animation: timerWarning 0.85s ease-in-out;
        }

        #experienceTimerValue.is-urgent {
            color: #c62e42;
            animation: timerUrgent 0.58s ease-in-out infinite;
        }

        @keyframes timerWarning {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.46);
            }
        }

        @keyframes timerUrgent {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 0 0 rgb(198 46 66 / 0%);
            }

            50% {
                transform: scale(1.42);
                text-shadow: 0 0 22px rgb(198 46 66 / 52%);
            }
        }

        #experienceScore {
            position: absolute;
            top: 0;
            right: 0;
            width: clamp(280px, 34vw, 380px);
            height: clamp(280px, 34vw, 380px);
            font-size: clamp(1.4rem, 3.8vw, 2.1rem);
            text-align: center;
        }

        #experienceScore::before {
            content: "";
            position: absolute;
            top: -40%;
            right: -40%;
            width: 100%;
            height: 100%;
            border: 5px solid var(--score-panel-color, rgb(47 207 131 / 82%));
            border-radius: 50%;
            background: rgb(255 255 255 / 84%);
            box-shadow:
                0 0 0 7px var(--score-panel-glow, rgb(47 207 131 / 12%)),
                0 12px 30px rgb(31 24 53 / 14%);
        }

        #experienceScoreLabel {
            position: absolute;
            top: 11%;
            left: 78%;
            z-index: 1;
            color: var(--score-panel-color, #178b59);
            font-size: 0.64em;
            letter-spacing: 0.12em;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        #experienceScoreNumber {
            position: absolute;
            top: 23%;
            left: 76%;
            z-index: 1;
            font-size: 1.65em;
            font-weight: 500;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        #experienceScoreUnit {
            margin-left: 0.12em;
            font-size: 0.46em;
            font-weight: 700;
        }

        #scoreEffectLayer {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        #experienceResults {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 6%;
            background:
                url("./assets/images/background.png") center / 100% 100% no-repeat;
            color: #2f2250;
            pointer-events: none;
        }

        #experienceResults[hidden] {
            display: none;
        }

        #experienceResultsCard {
            width: min(82%, 700px);
            padding: clamp(32px, 5vw, 58px);
            border: 6px solid #fff;
            border-radius: clamp(34px, 5vw, 58px);
            background: rgb(255 255 255 / 94%);
            box-shadow:
                0 14px 0 rgb(98 81 214 / 16%),
                0 30px 70px rgb(47 34 80 / 24%);
            text-align: center;
            animation: experienceResultsPop 0.65s cubic-bezier(0.2, 1.45, 0.45, 1) both;
        }

        #experienceResultsTitle {
            margin: 0;
            color: #6251d6;
            font-size: clamp(1.6rem, 4.5vw, 2.5rem);
        }

        #experienceResultScore {
            margin: 0.12em 0 0.5em;
            color: #111;
            font-size: clamp(3rem, 9vw, 5.4rem);
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
        }

        #experienceResultScoreUnit {
            margin-left: 0.12em;
            font-size: 0.42em;
        }

        #experienceRankingTitle {
            margin: 0 0 0.45em;
            font-size: clamp(1.25rem, 3.5vw, 2rem);
        }

        #experienceRankingList {
            margin: 0;
            display: grid;
            gap: 0.3em;
            padding: 0;
            list-style: none;
            font-size: clamp(1.35rem, 4vw, 2.3rem);
        }

        .experienceRankingRow {
            display: grid;
            grid-template-columns: 3.6em 1fr;
            align-items: center;
            padding: 0.28em 0.7em 0.36em;
            border-radius: 999px;
            background: #f3f0ff;
            font-variant-numeric: tabular-nums;
        }

        .experienceRankingRow.is-player {
            background: #2fcf83;
            box-shadow: 0 7px 0 rgb(20 123 78 / 20%);
            color: #fff;
            transform: scale(1.06);
            animation:
                experiencePlayerRankReveal 0.85s cubic-bezier(0.2, 1.55, 0.45, 1) both,
                experiencePlayerRankGlow 1s ease-in-out 0.85s infinite alternate;
        }

        .experienceRankingPosition {
            text-align: left;
        }

        .experienceRankingScore {
            text-align: right;
        }

        .experienceRankingEllipsis {
            margin-bottom: 0.22em;
            color: #8b829e;
            font-size: 1.6em;
            line-height: 0.75;
            text-align: center;
        }

        @keyframes experienceResultsPop {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.82);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes experiencePlayerRankReveal {
            from {
                opacity: 0;
                transform: scale(0.68) rotate(-3deg);
            }

            68% {
                opacity: 1;
                transform: scale(1.12) rotate(1deg);
            }

            to {
                opacity: 1;
                transform: scale(1.06) rotate(0);
            }
        }

        @keyframes experiencePlayerRankGlow {
            from {
                box-shadow:
                    0 7px 0 rgb(20 123 78 / 20%),
                    0 0 0 rgb(47 207 131 / 0%);
            }

            to {
                box-shadow:
                    0 7px 0 rgb(20 123 78 / 20%),
                    0 0 26px rgb(47 207 131 / 72%);
            }
        }

        .scoreToken {
            position: absolute;
            z-index: 2;
            width: 20px;
            height: 20px;
            border: 2px solid rgb(255 255 255 / 88%);
            border-radius: 50%;
            background: var(--score-color, #2fcf83);
            box-shadow:
                0 0 9px var(--score-color, #2fcf83);
            will-change: transform, opacity;
        }

        .scoreArrival {
            position: absolute;
            z-index: 3;
            color: var(--score-color, #178b59);
            font-size: clamp(1.05rem, 2.8vw, 1.45rem);
            font-weight: 700;
            white-space: nowrap;
            text-shadow:
                0 1px 4px #fff;
            pointer-events: none;
        }

        #out,
        #layerControls {
            padding: 12px;
            background: var(--panel-bg);
            border-radius: 8px;
            font: 700 0.85em "Zen Maru Gothic", sans-serif;
            z-index: 10;
        }

        #out {
            position: absolute;
            right: 8px;
            bottom: 8px;
            font: 0.85em monospace;
        }

        #calibControls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
            align-items: center;
            margin-bottom: 0.5em;
            min-width: 100%;
        }

        #toggleShapes {
            margin-left: auto;
        }

        #paramSetControls,
        #gainSetControls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
            margin-bottom: 0.6em;
        }

        #paramSetControls select,
        #gainSetControls select {
            min-width: 9em;
            padding: 0.25em 0.35em;
            font: inherit;
            font-size: 0.85em;
        }

        .param {
            display: flex;
            gap: 0.35em;
            align-items: center;
            min-width: 0;
            font-size: 0.82em;
        }

        .param span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #layerControls {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.45em;
            align-items: flex-start;
        }

        #layerControls label {
            display: flex;
            gap: 0.4em;
            align-items: center;
        }

        #sourceControls {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 999;
            display: grid;
            gap: 8px;
        }

        #out[hidden],
        #layerControls[hidden],
        #sourceControls[hidden] {
            display: none;
        }

        #sourceControls input {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #sourceControls button,
        #sourceControls label {
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: var(--panel-bg);
            color: #f4f7fb;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        button {
            border: 1px solid #999;
            border-radius: 4px;
            padding: 0.35em 0.6em;
            background: #fff;
            color: #111;
            cursor: pointer;
            font: inherit;
            overflow-wrap: anywhere;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        #status {
            min-width: min(11em, 100%);
        }

        .shape {
            display: grid;
            grid-template-columns: 9em 7em 4em 3.4em;
            gap: 0.5em;
            align-items: center;
        }

        .bar {
            position: relative;
            height: 0.9em;
            overflow: hidden;
            background: #ccc;
        }

        .bar::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 50%;
            width: 1px;
            background: #666;
        }

        .fill {
            position: absolute;
            top: 0;
            bottom: 0;
            width: var(--v);
            background: var(--accent);
        }

        .bar.raw::before {
            display: none;
        }

        .bar.positive .fill {
            left: 50%;
        }

        .bar.raw .fill {
            left: 0;
        }

        .bar.negative .fill {
            right: 50%;
            background: #c44;
        }

        .value {
            text-align: right;
        }

        .gain {
            color: #cbd5df;
            text-align: right;
        }
    </style>
</head>

<body>
    <main id="stage">
        <img id="experienceBackground" src="./assets/images/background.png" alt="" aria-hidden="true">
        <div id="startScreen">
            <div id="startThumbnail" aria-label="Suitopiaぷちフェス 顔あそび 体験その1">
                <div id="thumbnailReturnBackground" aria-hidden="true" hidden>
                    <span class="thumbnailReturnIris"></span>
                </div>
                <img class="startThumbnailLayer startThumbnailTitle" src="./assets/images/title_block.png"
                    alt="Suitopiaぷちフェス！ 顔あそび">
                <img class="startThumbnailLayer startThumbnailDetail" src="./assets/images/detail_block.png"
                    alt="体験その① 顔をたくさん動かして、いろんな形を作ってみよう！">
            </div>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <img id="sourceImage" alt="" hidden>
        <canvas id="canvas"></canvas>
        <section id="visualize_01" class="visualize" hidden>
            <canvas id="vizCanvas"></canvas>
        </section>
        <div id="calibrationGuide" hidden>
            <div id="calibrationCard">
                <span id="calibrationGuideText"></span>
                <svg id="calibrationPoint" viewBox="0 0 42 42" role="progressbar" aria-label="顔の記録状況" aria-valuemin="0"
                    aria-valuemax="100">
                    <circle id="calibrationPointBase" cx="21" cy="21" r="14" pathLength="100"></circle>
                    <circle id="calibrationPointProgress" cx="21" cy="21" r="14" pathLength="100"></circle>
                    <circle id="calibrationPointCenter" cx="21" cy="21" r="9.5"></circle>
                </svg>
            </div>
        </div>
        <div id="experienceAnnouncement" hidden>さぁ！顔を大きく動かしてみよう！</div>
        <div id="experienceHud" hidden>
            <div id="scoreEffectLayer"></div>
            <div id="experienceTimer" aria-label="残り60秒">残り <span id="experienceTimerValue">60</span> 秒</div>
            <div id="experienceScore">
                <span id="experienceScoreLabel">スコア</span>
                <span id="experienceScoreNumber">
                    <span id="experienceScoreValue">0</span><span id="experienceScoreUnit">点</span>
                </span>
            </div>
        </div>
        <section id="experienceResults" aria-labelledby="experienceResultsTitle" hidden>
            <div id="experienceResultsCard">
                <h2 id="experienceResultsTitle">あなたのスコア</h2>
                <p id="experienceResultScore">
                    <span id="experienceResultScoreValue">0</span><span id="experienceResultScoreUnit">点</span>
                </p>
                <h3 id="experienceRankingTitle">ランキング</h3>
                <ol id="experienceRankingList"></ol>
            </div>
        </section>
        <div id="layerControls" hidden>
            <label>
                <input id="visualizeToggle" type="checkbox">
                <span>visualize_01</span>
            </label>
        </div>
        <div id="sourceControls" hidden>
            <button id="cameraButton" type="button">WebCam</button>
            <label for="fileInput"><span>動画</span>
                <input id="fileInput" type="file" accept="video/*">
            </label>
            <label for="neutralImageInput"><span>無表情画像</span>
                <input id="neutralImageInput" type="file" accept="image/jpeg,image/png,image/webp">
            </label>

            const quality = featureFrameQuality(landmarks);

            if (!quality || !expression || !imageUrl) return;

            featureFrameSamples.push({

        function featureFrameQuality(landmarks) {
            const leftEye = averageLandmarks(landmarks, [33, 133]);
            const rightEye = averageLandmarks(landmarks, [263, 362]);
            const leftTemple = landmarks[234];
            const rightTemple = landmarks[454];
            const leftMouth = landmarks[61];
            const rightMouth = landmarks[291];
            const mouthCenter = averageLandmarks(landmarks, [13, 14]);
            const nose = landmarks[1];
            const bounds = landmarkBounds(landmarks);
            if (
                !leftEye
                || !rightEye
                || !leftTemple
                || !rightTemple
                || !leftMouth
                || !rightMouth
                || !mouthCenter
                || !nose
                || !bounds
            ) {
                return null;
            }

            const eyeDistance = featurePointDistance(leftEye, rightEye);
            const faceWidth = featurePointDistance(leftTemple, rightTemple);
            if (eyeDistance < 0.001 || faceWidth < 0.001) return null;

            const eyeSymmetry = featureSymmetryScore(
                featurePointDistance(nose, leftEye),
                featurePointDistance(nose, rightEye)
            );
            const templeSymmetry = featureSymmetryScore(
                featurePointDistance(nose, leftTemple),
                featurePointDistance(nose, rightTemple)
            );
            const mouthSymmetry = featureSymmetryScore(
                featurePointDistance(nose, leftMouth),
                featurePointDistance(nose, rightMouth)
            );
            const rollScore = clamp(1 - Math.abs(leftEye.y - rightEye.y) / eyeDistance * 2.2, 0, 1);
            const pitchScore = clamp(
                1 - Math.abs((mouthCenter.y - nose.y) / eyeDistance - 0.55),
                0,
                1
            );
            const boundsCenter = {
                x: (bounds.minX + bounds.maxX) / 2,
                y: (bounds.minY + bounds.maxY) / 2
            };
            const noseCenterScore = clamp(
                1 - Math.abs(nose.x - boundsCenter.x) / (faceWidth * 0.18),
                0,
                1
            );
            const frontalScore = averageValues([
                eyeSymmetry,
                templeSymmetry,
                mouthSymmetry,
                rollScore,
                pitchScore,
                noseCenterScore
            ]);
            const faceArea = (bounds.maxX - bounds.minX) * (bounds.maxY - bounds.minY);
            const sizeScore = clamp((faceArea - 0.035) / 0.18, 0, 1);
            const centerOffset = Math.hypot(boundsCenter.x - 0.5, boundsCenter.y - 0.5);
            const centerScore = clamp(1 - centerOffset * 2.4, 0, 1);
            const qualityScore = frontalScore * 0.55 + sizeScore * 0.2 + centerScore * 0.25;

            return { frontalScore, sizeScore, centerScore, qualityScore };
        }

        function featureExpressionScore(categories) {
            const expressionEntries = categories
                .filter(({ categoryName, score }) =>
                    categoryName !== "_neutral" && Number.isFinite(score)
                )
                .map(({ categoryName, score }) => [categoryName, clamp(score, 0, 1)]);
            if (!expressionEntries.length) return null;

            const expressionScores = Object.fromEntries(expressionEntries);
            const strongest = [...expressionEntries]
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);
            const topScore = strongest[0]?.[1] ?? 0;
            const topMean = averageValues(strongest.map(([, score]) => score));
            const expressionScore = topScore * 0.35 + topMean * 0.65;

            return {
                expressionScores,
                expressionScore,
                dominantExpression: strongest[0]?.[0] ?? ""
            };
        }

        function captureFeatureFrame(landmarks) {
            try {
                const sourceWidth = video.videoWidth;
                const sourceHeight = video.videoHeight;
                if (!sourceWidth || !sourceHeight) return "";

                const crop = featureFaceCrop(landmarks, sourceWidth, sourceHeight);
                if (!crop) return "";
                const { sourceX, sourceY, cropWidth, cropHeight } = crop;

                featureFrameCanvas.width = FEATURE_FRAME_WIDTH;
                featureFrameCanvas.height = FEATURE_FRAME_HEIGHT;
                featureFrameCtx.save();
                try {
                    featureFrameCtx.clearRect(0, 0, FEATURE_FRAME_WIDTH, FEATURE_FRAME_HEIGHT);
                    featureFrameCtx.translate(FEATURE_FRAME_WIDTH, 0);
                    featureFrameCtx.scale(-1, 1);
                    featureFrameCtx.drawImage(
                        video,
                        sourceX,
                        sourceY,
                        cropWidth,
                        cropHeight,
                        0,
                        0,
                        FEATURE_FRAME_WIDTH,
                        FEATURE_FRAME_HEIGHT
                    );
                } finally {
                    featureFrameCtx.restore();
                }
                return featureFrameCanvas.toDataURL("image/webp", 0.78);
            } catch {
                return "";
            }
        }

        function featureFaceCrop(landmarks, sourceWidth, sourceHeight) {
            const bounds = landmarkBounds(landmarks);
            if (!bounds) return null;

            const targetAspect = FEATURE_FRAME_WIDTH / FEATURE_FRAME_HEIGHT;
            const faceWidth = (bounds.maxX - bounds.minX) * sourceWidth;
            const faceHeight = (bounds.maxY - bounds.minY) * sourceHeight;
            if (faceWidth < 1 || faceHeight < 1) return null;

            let cropWidth = faceWidth * 1.22;
            let cropHeight = faceHeight * 1.18;
            if (cropWidth / cropHeight > targetAspect) {
                cropHeight = cropWidth / targetAspect;
            } else {
                cropWidth = cropHeight * targetAspect;
            }

            const fitScale = Math.min(1, sourceWidth / cropWidth, sourceHeight / cropHeight);
            cropWidth *= fitScale;
            cropHeight *= fitScale;

            const centerX = (bounds.minX + bounds.maxX) / 2 * sourceWidth;
            const centerY = (
                (bounds.minY + bounds.maxY) / 2
                - (bounds.maxY - bounds.minY) * FEATURE_FACE_CROP_Y_SHIFT_RATIO
            ) * sourceHeight;
            const sourceX = clamp(centerX - cropWidth / 2, 0, sourceWidth - cropWidth);
            const sourceY = clamp(centerY - cropHeight / 2, 0, sourceHeight - cropHeight);

            return { sourceX, sourceY, cropWidth, cropHeight };
        }

        async function publishExperienceHighlights(sessionId, score, certificateNumber) {
            sendControlPanelMessage({ type: "feature-images-loading" });
            const analyzedFrames = await analyzeFeatureEmotions(featureFrameSamples, sessionId);
            if (sessionId !== experienceSessionId) return;

            const images = selectFeatureFrames(analyzedFrames).map((frame, index) => ({
                rank: index + 1,
                imageUrl: frame.imageUrl,
                time: frame.time,
                frontalScore: frame.frontalScore,
                emotionScore: frame.emotionScore,
                emotion: frame.dominantEmotion
            }));
            const emotionScores = Object.fromEntries(
                FEATURE_EMOTIONS
                    .filter(emotion => emotion !== "neutral")
                    .map(emotion => [
                        emotion,
                        Math.max(0, ...analyzedFrames.map(frame => frame.emotions[emotion] || 0))
                    ])
            );
            sendControlPanelMessage({
                type: "feature-images",
                images,
                score,
                certificateNumber,
                emotionScores
            });
        }

        async function analyzeFeatureEmotions(samples, sessionId) {
            if (!samples.length || !await featureEmotionModels) return [];

            const candidates = featureEmotionAnalysisCandidates(samples);
            const analyzed = [];
            for (const frame of candidates) {
                if (sessionId !== experienceSessionId) return [];
                let detection;
                try {
                    const image = await loadFeatureImage(frame.imageUrl);
                    detection = await faceapi
                        .detectSingleFace(image, featureEmotionDetectorOptions)
                        .withFaceExpressions();
                } catch (error) {
                    console.warn("候補画像の感情を推定できませんでした", error);
                    continue;
                }
                if (!detection) continue;

                const emotions = Object.fromEntries(
                    FEATURE_EMOTIONS.map(emotion => [emotion, detection.expressions[emotion] || 0])
                );
                const [dominantEmotion, emotionScore] = FEATURE_EMOTIONS.reduce(
                    (strongest, emotion) =>
                        emotions[emotion] > strongest[1]
                            ? [emotion, emotions[emotion]]
                            : strongest,
                    ["neutral", 0]
                );
                analyzed.push({ ...frame, emotions, dominantEmotion, emotionScore });
            }
            return analyzed.sort((left, right) => left.time - right.time);
        }

        function featureEmotionAnalysisCandidates(samples) {
            const ranked = [...samples].sort((left, right) => {
                const leftScore = left.qualityScore * 0.7 + left.expressionScore * 0.3;
                const rightScore = right.qualityScore * 0.7 + right.expressionScore * 0.3;
                return rightScore - leftScore;
            });
            const selected = [];

            for (const frame of ranked) {
                if (selected.length >= FEATURE_EMOTION_ANALYSIS_LIMIT) break;
                if (selected.every(item =>
                    Math.abs(item.time - frame.time) >= FEATURE_EMOTION_ANALYSIS_GAP_SECONDS
                )) {
                    selected.push(frame);
                }
            }
            for (const frame of ranked) {
                if (selected.length >= FEATURE_EMOTION_ANALYSIS_LIMIT) break;
                if (!selected.includes(frame)) selected.push(frame);
            }
            return selected.sort((left, right) => left.time - right.time);
        }

        function loadFeatureImage(imageUrl) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = imageUrl;
            });
        }

        function selectFeatureFrames(samples) {
            if (!samples.length) return [];

            const scored = samples.map((frame, index) => {
                const neighbors = samples.slice(
                    Math.max(0, index - 2),
                    Math.min(samples.length, index + 3)
                );
                const stabilityScore = clamp(
                    1 - Math.sqrt(varianceOf(
                        neighbors.map(item => item.emotions[frame.dominantEmotion] || 0)
                    )) * 4,
                    0,
                    1
                );
                const totalScore =
                    frame.emotionScore * 0.48
                    + stabilityScore * 0.24
                    + frame.qualityScore * 0.28;
                return { ...frame, stabilityScore, totalScore };
            });
            const frontal = scored.filter(frame => frame.frontalScore >= 0.55);
            const candidates = frontal.length >= Math.min(3, FEATURE_FRAME_PICK_LIMIT)
                ? frontal
                : scored;
            return selectEmotionDiverseFrames(candidates);
        }

        function selectEmotionDiverseFrames(candidates) {
            const selected = [];
            const emotionCounts = Object.fromEntries(FEATURE_EMOTIONS.map(emotion => [emotion, 0]));

            const emotionGroups = FEATURE_EMOTIONS
                .map(emotion => ({
                    emotion,
                    frames: candidates
                        .filter(frame => frame.dominantEmotion === emotion)
                        .sort((left, right) => right.totalScore - left.totalScore)
                }))
                .filter(group => group.frames.length)
                .sort((left, right) => right.frames[0].totalScore - left.frames[0].totalScore);

            for (const group of emotionGroups) {
                if (selected.length >= FEATURE_FRAME_PICK_LIMIT) break;
                const separated = group.frames.find(frame =>
                    selected.every(item =>
                        Math.abs(item.time - frame.time) >= FEATURE_FRAME_MIN_GAP_SECONDS
                    )
                );
                const frame = separated || group.frames[0];
                selected.push(frame);
                emotionCounts[group.emotion] += 1;
            }

            while (selected.length < FEATURE_FRAME_PICK_LIMIT) {
                const available = candidates.filter(candidate =>
                    !selected.includes(candidate)
                );
                if (!available.length) return selected;

                const minimumCount = Math.min(
                    ...available.map(frame => emotionCounts[frame.dominantEmotion])
                );
                const leastRepeated = available.filter(frame =>
                    emotionCounts[frame.dominantEmotion] === minimumCount
                );
                const separated = leastRepeated.filter(frame =>
                    selected.every(item =>
                        Math.abs(item.time - frame.time) >= FEATURE_FRAME_MIN_GAP_SECONDS
                    )
                );
                const pool = separated.length ? separated : leastRepeated;
                const best = pool.reduce((winner, frame) =>
                    !winner || frame.totalScore > winner.totalScore ? frame : winner
                , null);
                selected.push(best);
                emotionCounts[best.dominantEmotion] += 1;
            }
            return selected;
        }

        function featureSymmetryScore(left, right) {
            const average = Math.max((left + right) / 2, 0.001);
            return clamp(1 - Math.abs(left - right) / average * 1.5, 0, 1);
        }

        function featurePointDistance(left, right) {
            return Math.hypot(left.x - right.x, left.y - right.y);
        }

        function averageValues(values) {
            return values.reduce((sum, value) => sum + value, 0) / Math.max(1, values.length);
        }

        function varianceOf(values) {
            const average = averageValues(values);
            return averageValues(values.map(value => (value - average) ** 2));
        }

        function updateExperienceHud(categories, now = performance.now()) {
            if (experienceHud.hidden || !visualizeStartedAt) return;

            const elapsed = now - visualizeStartedAt;
            const remaining = Math.max(0, EXPERIENCE_DURATION_MS - elapsed);
            const remainingSeconds = Math.ceil(remaining / 1000);
            experienceTimerValue.textContent = String(remainingSeconds);
            experienceTimerValue.classList.toggle("is-warning", remainingSeconds === 30);
            experienceTimerValue.classList.toggle("is-urgent", remainingSeconds <= 10);
            experienceTimer.setAttribute("aria-label", `残り${remainingSeconds}秒`);
            updateWorkMusicPlaybackRate(remainingSeconds);

            if (!remaining) {
                if (!experienceFinished) finishExperience();
                return;
            }
            const motionAmount = measureMotionAmount(categories, now);

            if (
                motionAmount >= SCORE_TRIGGER_THRESHOLD
                && now - lastScoreEventAt >= SCORE_EVENT_COOLDOWN_MS
            ) {
                lastScoreEventAt = now;
                launchScoreEffect(scoreForMotion(motionAmount));
            }
        }

        function finishExperience() {
            experienceFinished = true;
            stopWorkMusic();
            const sessionId = experienceSessionId;
            const certificateNumber = createExperienceNumber();
            publishExperienceHighlights(sessionId, experienceScore, certificateNumber).catch(error => {
                console.error("ハイライト画像を選別できませんでした", error);
                if (sessionId === experienceSessionId) {
                    sendControlPanelMessage({ type: "feature-images", images: [] });
                }
            });
            sendControlPanelMessage({ type: "finish" });

            experiencePhaseTimer = window.setTimeout(() => {
                if (sessionId !== experienceSessionId || !experienceFinished) return;
                showExperienceResults(sessionId);
            }, EXPERIENCE_RESULT_DELAY_MS);
        }

        function createExperienceNumber(now = new Date()) {
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const dateKey = `${year}-${month}-${day}`;
            let count = 1;

            try {
                const stored = JSON.parse(
                    localStorage.getItem(EXPERIENCE_COUNTER_STORAGE_KEY) ?? "null"
                );
                if (stored?.dateKey === dateKey && Number.isInteger(stored.count)) {
                    count = stored.count + 1;
                }
                localStorage.setItem(
                    EXPERIENCE_COUNTER_STORAGE_KEY,
                    JSON.stringify({ dateKey, count })
                );
            } catch {
                count = Math.max(1, experienceSessionId);
            }

            const displayCount = (count - 1) % 999 + 1;
            return `${month}${day}${String(displayCount).padStart(3, "0")}`;
        }

        function showExperienceResults(sessionId) {
            const finalScore = experienceScore;
            const result = saveScoreRanking(finalScore);
            if (sessionId !== experienceSessionId || !experienceFinished) return;

            experienceHud.hidden = true;
            experienceResultScoreValue.textContent = String(finalScore);
            experienceRankingList.replaceChildren();

            result.topThree.forEach(entry => {
                experienceRankingList.append(createRankingRow(entry.rank, entry.score, entry.id === result.player.id));
            });

            if (result.playerRank > 3) {
                const ellipsis = document.createElement("li");
                ellipsis.className = "experienceRankingEllipsis";
                ellipsis.textContent = "⋮";
                experienceRankingList.append(
                    ellipsis,
                    createRankingRow(result.playerRank, result.player.score, true)
                );
            }

            experienceResults.hidden = false;
            experiencePhaseTimer = window.setTimeout(() => {
                if (sessionId !== experienceSessionId || !experienceFinished) return;
                playReturnTransition();
            }, EXPERIENCE_RESULTS_DISPLAY_MS);
        }

        function saveScoreRanking(score) {
            const player = {
                id: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`,
                score,
                completedAt: Date.now()
            };
            const ranking = [...loadScoreRanking(), player]
                .sort((a, b) => b.score - a.score || a.completedAt - b.completedAt);
            const playerRank = ranking.findIndex(entry => entry.id === player.id) + 1;
            writeScoreRanking(ranking.slice(0, SCORE_RANKING_LIMIT));

            return {
                player,
                playerRank,
                topThree: ranking.slice(0, 3).map((entry, index) => ({ ...entry, rank: index + 1 }))
            };
        }

        function loadScoreRanking() {
            try {
                return normalizeScoreRanking(
                    JSON.parse(localStorage.getItem(SCORE_RANKING_STORAGE_KEY) ?? "[]")
                );
            } catch {
                return [];
            }
        }

        function writeScoreRanking(ranking) {
            try {
                localStorage.setItem(SCORE_RANKING_STORAGE_KEY, JSON.stringify(ranking));
            } catch { }
        }

        function normalizeScoreRanking(value) {
            if (!Array.isArray(value)) return [];
            return value.filter(entry =>
                entry
                && typeof entry.id === "string"
                && Number.isFinite(entry.score)
                && Number.isFinite(entry.completedAt)
            );
        }

        function createRankingRow(rank, score, isPlayer) {
            const row = document.createElement("li");
            const position = document.createElement("span");
            const scoreText = document.createElement("span");

            row.className = `experienceRankingRow${isPlayer ? " is-player" : ""}`;
            position.className = "experienceRankingPosition";
            scoreText.className = "experienceRankingScore";
            position.textContent = `${rank}位`;
            scoreText.textContent = `${score}点`;
            row.append(position, scoreText);
            return row;
        }

        function updateWorkMusicPlaybackRate(remainingSeconds) {
            const playbackRate = remainingSeconds <= 10
                ? WORK_MUSIC_RATE_URGENT
                : remainingSeconds <= 30
                    ? WORK_MUSIC_RATE_WARNING
                    : WORK_MUSIC_RATE_NORMAL;
            setWorkMusicPlaybackRate(playbackRate);
        }

        function setWorkMusicPlaybackRate(playbackRate, force = false) {
            if (!force && playbackRate === workMusicPlaybackRate) return;
            workMusicPlaybackRate = playbackRate;
            sendControlPanelMessage({ type: "work-music-rate", playbackRate });
        }

        function startWorkMusic() {
            setWorkMusicPlaybackRate(WORK_MUSIC_RATE_NORMAL, true);
            sendControlPanelMessage({ type: "work-music-start" });
        }

        function stopWorkMusic() {
            sendControlPanelMessage({ type: "work-music-stop" });
        }

        function measureMotionAmount(categories, now) {
            if (!categories.length) {
                previousMotionScores.clear();
                previousMotionSampleAt = 0;
                return 0;
            }

            const currentScores = new Map(categories.map(({ categoryName, score }) => [categoryName, score]));
            if (!previousMotionSampleAt || !previousMotionScores.size) {
                saveMotionSample(currentScores, now);
                return 0;
            }

            const deltaSeconds = clamp((now - previousMotionSampleAt) / 1000, 1 / 120, 0.1);
            const strongestMovements = [...currentScores]
                .map(([categoryName, score]) => Math.abs(score - (previousMotionScores.get(categoryName) ?? score)) / deltaSeconds)
                .sort((a, b) => b - a)
                .slice(0, 8);
            saveMotionSample(currentScores, now);

            return strongestMovements.length
                ? strongestMovements.reduce((sum, value) => sum + value, 0) / strongestMovements.length
                : 0;
        }

        function saveMotionSample(scores, now) {
            previousMotionScores.clear();
            for (const [categoryName, score] of scores) previousMotionScores.set(categoryName, score);
            previousMotionSampleAt = now;
        }

        function scoreForMotion(motionAmount) {
            let points = 10;
            if (motionAmount >= SCORE_LARGE_THRESHOLD) {
                points = 30;
            } else if (motionAmount >= SCORE_MEDIUM_THRESHOLD) {
                points = 20;
            }

            const shapeName = dominantShapeName;
            const changedShape = shapeName !== lastScoredShapeName;
            const discoveredShape = shapeName !== "circle" && !discoveredScoreShapes.has(shapeName);

            if (changedShape) points += SCORE_SHAPE_CHANGE_BONUS;
            if (discoveredShape) points += SCORE_NEW_SHAPE_BONUS;

            lastScoredShapeName = shapeName;
            discoveredScoreShapes.add(shapeName);
            return points;
        }

        function launchScoreEffect(points) {
            const token = document.createElement("div");
            const layerRect = scoreEffectLayer.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            const scoreRect = experienceScoreNumber.getBoundingClientRect();
            const centerX = stageRect.left + stageRect.width / 2 - layerRect.left;
            const centerY = stageRect.top + stageRect.height * SHAPE_CENTER_Y_RATIO - layerRect.top;
            const targetX = scoreRect.left + scoreRect.width / 2 - layerRect.left;
            const targetY = scoreRect.top + scoreRect.height / 2 - layerRect.top;
            const centerToTargetX = targetX - centerX;
            const centerToTargetY = targetY - centerY;
            const centerToTargetLength = Math.hypot(centerToTargetX, centerToTargetY) || 1;
            const outlineRadius = Math.min(stageRect.width, stageRect.height) * SCORE_LAUNCH_RADIUS_RATIO;
            const startX = centerX + centerToTargetX / centerToTargetLength * outlineRadius;
            const startY = centerY + centerToTargetY / centerToTargetLength * outlineRadius;
            const deltaX = targetX - startX;
            const deltaY = targetY - startY;
            const flightDistance = Math.hypot(deltaX, deltaY) || 1;
            let perpendicularX = -deltaY / flightDistance;
            let perpendicularY = deltaX / flightDistance;
            if (perpendicularY < 0) {
                perpendicularX *= -1;
                perpendicularY *= -1;
            }
            const arcHeight = Math.min(150, flightDistance * 0.36);
            const controlX = (startX + targetX) / 2 + perpendicularX * arcHeight;
            const controlY = (startY + targetY) / 2 + perpendicularY * arcHeight;
            const sessionId = experienceSessionId;
            const scoreColor = rgba(currentMaterial(performance.now()).stroke, 1);
            const arcPoint = amount => {
                const inverse = 1 - amount;
                return {
                    x: inverse * inverse * startX + 2 * inverse * amount * controlX + amount * amount * targetX,
                    y: inverse * inverse * startY + 2 * inverse * amount * controlY + amount * amount * targetY
                };
            };
            const flightKeyframes = [
                { offset: 0, amount: 0, opacity: 0, scale: 0.55 },
                { offset: 0.28, amount: 0.04, opacity: 1, scale: 0.9 },
                { offset: 0.5, amount: 0.16, opacity: 1, scale: 1.08 },
                { offset: 0.72, amount: 0.42, opacity: 1, scale: 0.95 },
                { offset: 1, amount: 1, opacity: 1, scale: 0.62 }
            ].map(({ offset, amount, opacity, scale }) => {
                const point = arcPoint(amount);
                return {
                    offset,
                    opacity,
                    transform: `translate(-50%, -50%) translate(${point.x - startX}px, ${point.y - startY}px) scale(${scale})`
                };
            });

            token.className = "scoreToken";
            token.style.setProperty("--score-color", scoreColor);
            token.style.left = `${startX}px`;
            token.style.top = `${startY}px`;
            scoreEffectLayer.append(token);

            token.animate(flightKeyframes, {
                duration: SCORE_FLIGHT_MS,
                easing: "linear",
                fill: "forwards"
            }).finished
                .catch(() => { })
                .finally(() => token.remove());

            window.setTimeout(() => {
                if (sessionId !== experienceSessionId || experienceHud.hidden) return;
                const arrival = document.createElement("div");
                arrival.className = "scoreArrival";
                arrival.textContent = `+${points}`;
                arrival.style.setProperty("--score-color", scoreColor);
                arrival.style.left = `${targetX}px`;
                arrival.style.top = `${targetY}px`;
                scoreEffectLayer.append(arrival);
                arrival.animate([
                    { opacity: 0, transform: "translate(-50%, -35%) scale(0.65)" },
                    { opacity: 1, transform: "translate(-50%, -80%) scale(1.15)", offset: 0.25 },
                    { opacity: 0, transform: "translate(-50%, -180%) scale(1)" }
                ], {
                    duration: 720,
                    easing: "ease-out"
                }).finished
                    .catch(() => { })
                    .finally(() => arrival.remove());

                playPointGetSound();
                experienceScore += points;
                experienceScoreValue.textContent = String(experienceScore);
                experienceScoreNumber.animate([
                    { transform: "translateX(-50%) scale(1)" },
                    { transform: "translateX(-50%) scale(1.16)", offset: 0.45 },
                    { transform: "translateX(-50%) scale(1)" }
                ], { duration: 360, easing: "ease-out" });
            }, SCORE_ARRIVAL_DELAY_MS);
        }

        function playPointGetSound() {
            const sound = pointGetSound.cloneNode();
            const removeSound = () => sound.remove();

            sound.volume = 0.7;
            sound.addEventListener("ended", removeSound, { once: true });
            sound.addEventListener("error", removeSound, { once: true });
            document.body.append(sound);
            sound.play().catch(removeSound);
        }

        function showCalibrationGuide(message, phase = "recording") {
            calibrationGuideActive = true;
            calibrationGuide.dataset.phase = phase;
            calibrationGuideText.textContent = message;
            calibrationGuide.hidden = false;
        }

        function hideCalibrationGuide() {

            calibrationGuide.hidden = true;
            calibrationGuide.dataset.phase = "";
            calibrationGuide.style.setProperty("--progress", 0);
            calibrationPoint.setAttribute("aria-valuenow", "0");
        }

        function visualizing() {
            return !visualize.hidden;
        }

        function calibrationActive() {
            return calibration.warmup || calibration.remaining;
        }

        function calibrationOutlineVisible() {
            return activeMode === "camera" && CALIBRATION_OUTLINE_STAGES.has(calibrationStage);
        }

        function resetCalibration({ warmup = 0, frames = 0, clearGains = false } = {}) {
            base.clear();
            if (clearGains) {
                motionGains.clear();
                activeMotionGainSetName = "";
                renderMotionGainSetOptions();
            }
            resetMotionVisualState();
            Object.assign(calibration, { warmup, remaining: frames, samples: 0 });
            calibration.stats.clear();
            resetPoseCalibration();
            resetMotionGainCalibration();
            status.textContent = "";
