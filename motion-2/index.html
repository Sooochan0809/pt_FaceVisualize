        async function startCamera() {
            resetMediaSource();
            await setLandmarkerMode("VIDEO");
            video.srcObject = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: VW }, height: { ideal: VH }, aspectRatio: { ideal: 16 / 9 } }
            });
            await video.play();
            setActiveMode("camera");
            startLoop();
        }

        async function importFile(file) {
            if (!file) return;
            resetMediaSource();
            activeObjectUrl = URL.createObjectURL(file);

            if (file.type.startsWith("video/")) {
                await setLandmarkerMode("VIDEO");
                await loadMedia(video, activeObjectUrl, "loadeddata");
                setActiveMode("video-file");
                video.pause();
                await seekVideo(0);
                await calibrateFromVideoStart();
                await seekVideo(0);
                processResults(detectCurrentFrame());
                await video.play();
                startLoop();
                return;
            }

            clearImportedFile();
            status.textContent = "動画ファイルを選択してください";
        }

        function selectImagePairFile(kind, file) {
            if (!file) return;
            if (!file.type.startsWith("image/")) {
                status.textContent = "JPEG・PNG・WebP画像を選択してください";
                return;
            }

            imagePairFiles[kind] = file;
            const missing = [
                imagePairFiles.neutral ? "" : "無表情画像",
                imagePairFiles.expression ? "" : "表情画像"
            ].filter(Boolean);

            if (missing.length) {
                status.textContent = `${missing.join("と")}を選択してください`;
                return;
            }

            return importImagePair();
        }

        async function importImagePair() {
            const { neutral, expression } = imagePairFiles;
            if (!neutral || !expression) return;

            resetMediaSource({ resetImageInputs: false });
            imagePairObjectUrls = [URL.createObjectURL(neutral), URL.createObjectURL(expression)];
            const neutralImage = new Image();

            await Promise.all([
                loadMedia(neutralImage, imagePairObjectUrls[0], "load"),
                loadMedia(sourceImage, imagePairObjectUrls[1], "load")
            ]);
            await setLandmarkerMode("IMAGE");

            const neutralResults = faceLandmarker.detect(neutralImage);
            const expressionResults = faceLandmarker.detect(sourceImage);
            const neutralCategories = neutralResults.faceBlendshapes[0]?.categories ?? [];
            const neutralLandmarks = neutralResults.faceLandmarks[0] ?? [];

            if (!neutralCategories.length) throw new Error("無表情画像から顔を検出できません");
            if (!expressionResults.faceBlendshapes[0]?.categories?.length) {
                throw new Error("表情画像から顔を検出できません");
            }

            applyImagePairBaseline(neutralCategories, neutralLandmarks);
            imagePairResults = expressionResults;
            setActiveMode("image-pair");
            resetPrimaryFaceTracking();
            processResults(imagePairResults);
            startLoop();
            status.textContent = "2枚の画像を解析しました";
            enterExperience();
        }

        function applyImagePairBaseline(categories, landmarks) {
            base.clear();
            for (const { categoryName, score } of categories) {
                base.set(categoryName, {
                    mean: score,
                    dead: DEADZONE,
                    min: score - DEADZONE,
                    max: score + DEADZONE
                });
            }

            neutralPose = getPose(landmarks);
            Object.assign(calibration, { warmup: 0, remaining: 0, samples: 0 });
            calibration.stats.clear();
            resetMotionVisualState();
            hideCalibrationGuide();
        }

        async function setLandmarkerMode(mode) {
            if (landmarkerRunningMode === mode) return;
            await faceLandmarker.setOptions({ runningMode: mode });
            landmarkerRunningMode = mode;
        }

        function startLoop() {
            if (running) return;
            running = true;
            requestAnimationFrame(() => loop(++loopToken));
        }

        function stopLoop() {
            running = false;
            loopToken++;
            resetPrimaryFaceTracking();
        }

        function loop(token) {
            if (!running || token !== loopToken) return;
            processResults(detectCurrentFrame());
            requestAnimationFrame(() => loop(token));
        }

        function detectCurrentFrame() {
            if (activeMode === "image-pair") return imagePairResults;
            return faceLandmarker.detectForVideo(video, performance.now());
        }

        function processResults({ faceLandmarks, faceBlendshapes }) {
            const primaryFaceIndex = selectPrimaryFaceIndex(faceLandmarks);
            const rawLandmarks = primaryFaceIndex >= 0 ? faceLandmarks[primaryFaceIndex] : undefined;
            const landmarks = smoothLandmarks(rawLandmarks);
            const categories = primaryFaceIndex >= 0 ? faceBlendshapes[primaryFaceIndex]?.categories ?? [] : [];
            currentPoseStable = isPoseStable(landmarks);
            updateAutoCalibration(categories.length > 0, landmarks);
            drawLandmarks(landmarks);
            updateShapes(categories, landmarks);
            updateMotionGainCalibration(categories);

            const displayCategories = categories.length ? categories : zeroDisplayCategories();
            const activeCategories = selectedCategories(displayCategories);
            updateExperienceHud(categories);
            collectFeatureFrame(categories, landmarks);
            if (!visualize.hidden) drawSpectrum(updateSpectrumFrame(activeCategories, displayCategories));
        }

        function selectPrimaryFaceIndex(faceLandmarks = []) {
            if (!faceLandmarks.length) {
                resetPrimaryFaceTracking();
                return -1;
            }

            const centers = faceLandmarks.map(getLandmarkCenter);
            let selectedIndex = 0;

            if (primaryFaceCenter) {
                let selectedDistance = Infinity;
                centers.forEach((center, index) => {
                    const distance = Math.hypot(center.x - primaryFaceCenter.x, center.y - primaryFaceCenter.y);
                    if (distance < selectedDistance) {
                        selectedDistance = distance;
                        selectedIndex = index;
                    }
                });

                if (selectedDistance > PRIMARY_FACE_MAX_DISTANCE) {
                    selectedIndex = largestFaceIndex(faceLandmarks);
                    smoothedLandmarks = null;
                }
            } else {
                selectedIndex = largestFaceIndex(faceLandmarks);
            }

            primaryFaceCenter = centers[selectedIndex];
            return selectedIndex;
        }

        function largestFaceIndex(faceLandmarks = []) {
            return faceLandmarks.reduce((bestIndex, landmarks, index) => {
                const currentArea = landmarkBoundsArea(landmarks);
                const bestArea = landmarkBoundsArea(faceLandmarks[bestIndex]);
                return currentArea > bestArea ? index : bestIndex;
            }, 0);
        }

        function landmarkBoundsArea(landmarks = []) {
            const bounds = landmarkBounds(landmarks);
            return bounds ? (bounds.maxX - bounds.minX) * (bounds.maxY - bounds.minY) : 0;
        }

        function landmarkBounds(landmarks = []) {
            if (!landmarks.length) return null;
            const bounds = landmarks.reduce((box, point) => ({
                minX: Math.min(box.minX, point.x),
                minY: Math.min(box.minY, point.y),
                maxX: Math.max(box.maxX, point.x),
                maxY: Math.max(box.maxY, point.y)
            }), { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });

            return Number.isFinite(bounds.minX) && bounds.maxX > bounds.minX && bounds.maxY > bounds.minY
                ? bounds
                : null;
        }

        function getLandmarkCenter(landmarks = []) {
            if (!landmarks.length) return { x: 0, y: 0 };
            const sum = landmarks.reduce((total, point) => ({
                x: total.x + point.x,
                y: total.y + point.y
            }), { x: 0, y: 0 });

            return {
                x: sum.x / landmarks.length,
                y: sum.y / landmarks.length
            };
        }

        function smoothLandmarks(landmarks = []) {
            if (!landmarks.length) {
                resetPrimaryFaceTracking();
                return [];
            }

            if (!smoothedLandmarks || smoothedLandmarks.length !== landmarks.length) {
                smoothedLandmarks = landmarks.map(point => ({ ...point }));
                return smoothedLandmarks;
            }

            const currentWeight = 1 - LANDMARK_SMOOTHING;
            smoothedLandmarks = landmarks.map((point, index) => {
                const previous = smoothedLandmarks[index];
                return {
                    x: previous.x * LANDMARK_SMOOTHING + point.x * currentWeight,
                    y: previous.y * LANDMARK_SMOOTHING + point.y * currentWeight,
                    z: (previous.z ?? point.z ?? 0) * LANDMARK_SMOOTHING + (point.z ?? previous.z ?? 0) * currentWeight,
                    visibility: point.visibility,
                    presence: point.presence
                };
            });

            primaryFaceCenter = getLandmarkCenter(smoothedLandmarks);
            return smoothedLandmarks;
        }

        function resetPrimaryFaceTracking() {
            primaryFaceCenter = null;
            smoothedLandmarks = null;
        }

        function resetMotionVisualState() {
            [spectrum, spectrumVelocity, spectrumPhase].forEach(map => map.clear());
            shapeWeights.clear();
            dominantShapeName = "circle";
        }

        function updateAutoCalibration(faceDetected, landmarks) {
            if (!visualizing() || activeMode !== "camera") return;
            if (startTransitionActive) return;
            const facePositioned = faceDetected && faceFitsCalibrationFrame(landmarks);

            if (calibrationStage === "positioning") {
                if (facePositioned) beginCalibrationIntro();
                return;
            }

            if (calibrationStage === "complete") return;

            if (calibrationStage === "intro" && performance.now() >= calibrationIntroUntil) {
                calibrationStage = "waiting";
                showCalibrationGuide(GUIDE_MESSAGE, "recording");
            }

            if (faceDetected && !base.size && !calibrationActive()) {
                if (calibrationStage === "intro") return;
                startGuidedCalibration();
            }
        }

        function faceFitsCalibrationFrame(landmarks = []) {
            if (!landmarks.length) return false;

            const videoAspect = video.videoWidth && video.videoHeight
                ? video.videoWidth / video.videoHeight
                : 16 / 9;
            const stageAspect = vizCanvas.width / vizCanvas.height;
            let visibleX = 1;
            let visibleY = 1;
            let offsetX = 0;
            let offsetY = 0;

            if (videoAspect > stageAspect) {
                visibleX = stageAspect / videoAspect;
                offsetX = (1 - visibleX) / 2;
            } else {
                visibleY = videoAspect / stageAspect;
                offsetY = (1 - visibleY) / 2;
            }

            const insideCount = landmarks.reduce((count, point) => {
                const x = (point.x - offsetX) / visibleX;
                const y = (point.y - offsetY) / visibleY;
                const ellipseDistance =
                    ((x - 0.5) / 0.3) ** 2
                    + ((y - SHAPE_CENTER_Y_RATIO) / 0.225) ** 2;
                return count + Number(ellipseDistance <= 1);
            }, 0);

            return insideCount / landmarks.length >= 0.97;
        }

        function setActiveMode(mode) {
            activeMode = mode;
            stage.classList.toggle("file-source", mode !== "camera");
            video.hidden = mode === "image-pair";
            sourceImage.hidden = mode !== "image-pair";
            video.controls = video.loop = mode === "video-file";
            const imageMode = mode === "image-pair";
            calibrate.disabled = imageMode;
            measureMotionGain.disabled = imageMode;
            clearBaseline.disabled = imageMode;
        }

        function stopCameraStream() {
            const stream = video.srcObject instanceof MediaStream ? video.srcObject : null;
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }

        function resetMediaSource({ resetImageInputs = true } = {}) {
            stopLoop();
            stopCameraStream();
            clearImportedFile();
            clearImagePairMedia({ resetInputs: resetImageInputs });
        }

        function clearImportedFile() {
            if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
            activeObjectUrl = "";
            video.removeAttribute("src");
            video.load();
            fileInput.value = "";
        }

        function clearImagePairMedia({ resetInputs = true } = {}) {
            for (const url of imagePairObjectUrls) URL.revokeObjectURL(url);
            imagePairObjectUrls = [];
            imagePairResults = null;
            sourceImage.removeAttribute("src");
            sourceImage.hidden = true;

            if (!resetInputs) return;
            imagePairFiles.neutral = null;
            imagePairFiles.expression = null;
            neutralImageInput.value = "";
            expressionImageInput.value = "";
        }

        function loadMedia(media, src, eventName) {
            return new Promise((resolve, reject) => {
                const done = () => {
                    media.removeEventListener(eventName, done);
                    media.removeEventListener("error", fail);
                    resolve();
                };
                const fail = () => {
                    media.removeEventListener(eventName, done);
                    media.removeEventListener("error", fail);
                    reject(new Error("メディアを読み込めません"));
                };
                media.addEventListener(eventName, done, { once: true });
                media.addEventListener("error", fail, { once: true });
                media.src = src;
            });
        }

        function seekVideo(time) {
            return new Promise(resolve => {
                if (Math.abs(video.currentTime - time) < 0.001) {
                    resolve();
                    return;
                }
                video.addEventListener("seeked", resolve, { once: true });
                video.currentTime = time;
            });
        }

        function waitVideoFrame() {
            return new Promise(resolve => {
                let done = false;
                const finish = () => {
                    if (done) return;
                    done = true;
                    resolve();
                };
                setTimeout(finish, 80);
                if ("requestVideoFrameCallback" in video) {
                    video.requestVideoFrameCallback(finish);
                    return;
                }
                requestAnimationFrame(finish);
            });
        }

        function updateShapes(categories, landmarks) {
            updateCalibration(categories, landmarks);

            for (const { categoryName, score } of categories) {
                if (!shapes.has(categoryName)) {
                    const row = document.createElement("div");
                    const label = document.createElement("label");
                    const input = document.createElement("input");
                    const name = document.createElement("span");
                    const bar = document.createElement("span");
                    const fill = document.createElement("span");
                    const value = document.createElement("span");
                    const gain = document.createElement("span");

                    row.className = "shape";
                    label.className = "param";
                    label.title = categoryName;
                    input.type = "checkbox";
                    input.checked = savedParamEnabled(categoryName);
                    name.textContent = categoryName;
                    bar.className = "bar raw";
                    fill.className = "fill";
                    value.className = "value";
                    gain.className = "gain";
                    input.onchange = () => {
                        setParamEnabled(categoryName, input.checked);
                    };

                    setParamEnabled(categoryName, input.checked);
                    label.append(input, name);
                    bar.append(fill);
                    row.append(label, bar, value, gain);
                    shapesPanel.appendChild(row);
                    shapes.set(categoryName, { input, bar, value, gain });
                }
                const { bar, value, gain } = shapes.get(categoryName);
                const calibrated = base.size > 0;
                const displayScore = calibrated ? adjustedCalibratedScore(categoryName, score) : score;
                const width = calibrated
                    ? Math.min(Math.abs(displayScore) * 100, 50)
                    : Math.min(score * 100, 100);
                bar.className = `bar ${calibrated ? (displayScore < 0 ? "negative" : "positive") : "raw"}`;
                bar.style.setProperty("--v", `${width}%`);
                value.textContent = calibrated ? signed(displayScore) : score.toFixed(4);
                gain.textContent = calibrated ? `x${motionGain(categoryName).toFixed(2)}` : "";
            }
        }

        function selectedCategories(categories) {
            return categories.filter(({ categoryName }) => enabledParams.has(categoryName));
        }

        function zeroDisplayCategories() {
            const names = enabledParams.size ? [...enabledParams] : [...base.keys()];
            return names.map(categoryName => ({ categoryName, score: 0 }));
        }

        function setParamEnabled(categoryName, enabled) {
            if (enabled) {
                enabledParams.add(categoryName);
                return;
            }

            enabledParams.delete(categoryName);
            [spectrum, spectrumVelocity, spectrumPhase].forEach(map => map.delete(categoryName));
        }

        function savedParamEnabled(categoryName) {
            const paramSet = paramSets[activeParamSetName];
            return paramSet && categoryName in paramSet ? Boolean(paramSet[categoryName]) : true;
        }

        async function loadParamSets() {
            return loadSequentialSets({
                nameForIndex: datasetName,
                pathForName: name => `${PARAM_SET_DIR}/${name}`,
                parse: (stored, name) => {
                    const paramSet = stored?.[name] ?? stored;
                    return validParamSet(paramSet) ? paramSet : null;
                },
                errorMessage: "parameterを読み込めません"
            });
        }

        async function loadSequentialSets({ nameForIndex, pathForName, parse, errorMessage }) {
            try {
                const sets = {};

                for (let index = 1; index <= 99; index++) {
                    const name = nameForIndex(index);
                    const response = await fetch(pathForName(name), { cache: "no-store" });
                    if (response.status === 404) break;
                    if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);

                    const text = await response.text();
                    if (!text.trim()) continue;

                    const value = parse(JSON.parse(text), name);
                    if (value) sets[name] = value;
                }

                return sets;
            } catch (error) {
                status.textContent = `${errorMessage}: ${error.message}`;
                return {};
            }
        }

        function validParamSet(value) {
            return value && typeof value === "object" && !Array.isArray(value);
        }

        function renderNamedOptions(select, collection, selectedName, emptyLabel) {
            const names = Object.keys(collection).sort((a, b) => a.localeCompare(b, "ja", { numeric: true }));
            select.replaceChildren(
                new Option(emptyLabel, ""),
                ...names.map(name => new Option(name, name))
            );
            select.value = names.includes(selectedName) ? selectedName : "";
            return select.value;
        }

        function renderParamSetOptions(selectedName = activeParamSetName) {
            activeParamSetName = renderNamedOptions(
                paramSetSelect,
                paramSets,
                selectedName,
                "セットなし"
            );
        }

        async function saveCurrentParamSet() {
            if (!shapes.size) {
                status.textContent = "保存できるパラメーターがありません";
                return;
            }

            const name = nextParamSetName();
            const paramSet = Object.fromEntries([...shapes].map(([categoryName, { input }]) => [categoryName, input.checked]));
            paramSets[name] = paramSet;

            try {
                await writeJsonFile(JSON.stringify(paramSet, null, 2), name);
                renderParamSetOptions(name);
                status.textContent = `${name} を書き出しました`;
            } catch (error) {
                delete paramSets[name];
                status.textContent = `保存できません: ${error.message}`;
            }
        }

        async function writeJsonFile(json, name) {
            const blob = new Blob([json], { type: "application/json" });

            if ("showSaveFilePicker" in window) {
                const handle = await window.showSaveFilePicker({ suggestedName: name });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                return;
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = name;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function nextParamSetName() {
            return nextAvailableName(paramSets, datasetName);
        }

        function datasetName(index) {
            return `dataset${String(index).padStart(2, "0")}`;
        }

        function nextAvailableName(collection, nameForIndex) {
            let index = Object.keys(collection).length + 1;
            let name;

            do {
                name = nameForIndex(index++);
            } while (name in collection);

            return name;
        }

        function applyParamSet(name) {
            activeParamSetName = name;
            const paramSet = paramSets[name];

            for (const [categoryName, { input }] of shapes) {
                input.checked = paramSet && categoryName in paramSet ? Boolean(paramSet[categoryName]) : true;
                setParamEnabled(categoryName, input.checked);
            }

            status.textContent = name ? `${name} を適用しました` : "";
        }

        async function loadMotionGainSets() {
            return loadSequentialSets({
                nameForIndex: motionGainSetName,
                pathForName: name => `${PARAM_SET_DIR}/${name}.json`,
                parse: stored => {
                    const gainSet = normalizeMotionGainSet(stored);
                    return validMotionGainSet(gainSet) ? gainSet : null;
                },
                errorMessage: "係数セットを読み込めません"
            });
        }

        function validMotionGainSet(value) {
            return value && typeof value === "object" && !Array.isArray(value)
                && Object.keys(value).length > 0
                && Object.values(value).every(gain => Number.isFinite(gain));
        }

        function renderMotionGainSetOptions(selectedName = activeMotionGainSetName) {
            activeMotionGainSetName = renderNamedOptions(
                motionGainSetSelect,
                motionGainSets,
                selectedName,
                "係数なし"
            );
        }

        function applyMotionGainSet(name) {
            activeMotionGainSetName = name;
            motionGains.clear();

            const gainSet = motionGainSets[name];
            if (gainSet) {
                for (const [categoryName, gain] of Object.entries(gainSet)) {
                    motionGains.set(categoryName, clamp(gain, MOTION_GAIN_MIN, MOTION_GAIN_MAX));
                }
            }

            resetMotionVisualState();
            status.textContent = name ? `${name} を適用しました` : "係数を解除しました";
        }

        async function saveCurrentMotionGainSet() {
            if (!motionGains.size) {
                status.textContent = "保存できる係数がありません";
                return;
            }

            const name = nextMotionGainSetName();
            const gainSet = Object.fromEntries([...motionGains].map(([categoryName, gain]) => [categoryName, roundGain(gain)]));
            const payload = {
                version: 1,
                type: "motionGainSet",
                createdAt: new Date().toISOString(),
                setCount: MOTION_GAIN_SET_COUNT,
                secondsPerSet: MOTION_GAIN_SAMPLE_MS / 1000,
                gains: gainSet
            };

            motionGainSets[name] = gainSet;

            try {
                await writeJsonFile(JSON.stringify(payload, null, 2), `${name}.json`);
                renderMotionGainSetOptions(name);
                status.textContent = `${name}.json を書き出しました`;
            } catch (error) {
                delete motionGainSets[name];
                status.textContent = `係数を保存できません: ${error.message}`;
            }
        }

        function normalizeMotionGainSet(stored) {
            const source = stored?.gains ?? stored;
            if (!source || typeof source !== "object" || Array.isArray(source)) return null;

            return Object.fromEntries(Object.entries(source)
                .map(([categoryName, gain]) => [categoryName, Number(gain)])
                .filter(([, gain]) => Number.isFinite(gain))
                .map(([categoryName, gain]) => [categoryName, roundGain(gain)]));
        }

        function nextMotionGainSetName() {
            return nextAvailableName(motionGainSets, motionGainSetName);
        }

        function motionGainSetName(index) {
            return `motionGainSet${String(index).padStart(2, "0")}`;
        }

        function updateCalibration(categories, landmarks) {
            if ((!calibration.warmup && !calibration.remaining) || !categories.length) return;

            if (calibration.warmup) {
                status.textContent = `準備中 ${--calibration.warmup}`;
                updateCalibrationPoint();
                return;
            }

            accumulateCategoryStats(calibration.stats, categories);
            addPoseCalibrationSample(landmarks);
            calibration.samples++;
            status.textContent = `キャリブレーション中 ${--calibration.remaining}`;
            updateCalibrationPoint();

            if (calibration.remaining) return;

            base.clear();
            writeCalibrationBase(base, calibration.stats, calibration.samples);
            finishPoseCalibration();
            calibrate.disabled = false;
            measureMotionGain.disabled = false;
            calibrationStage = "complete";
            resetMotionVisualState();
            hideCalibrationGuide();
            sendControlPanelMessage({ type: "calibration-complete" });
            startExperienceIntro();
            status.textContent = `キャリブ済み (${calibration.samples} frames)`;
        }

        function updateCalibrationPoint(progressValue) {
            const progress = progressValue ?? (!calibrationActive() || calibration.warmup
                ? 0
                : clamp((CALIBRATION_FRAMES - calibration.remaining) / CALIBRATION_FRAMES * 100, 0, 100));
            calibrationGuide.style.setProperty("--progress", progress);
            calibrationPoint.setAttribute("aria-valuenow", String(Math.round(progress)));
        }

        async function calibrateFromVideoStart() {
            const duration = Math.min(VIDEO_BASELINE_SECONDS, video.duration || VIDEO_BASELINE_SECONDS);
            const samplesByName = new Map();
            let sampleCount = 0;
            resetPoseCalibration();

            calibratingVideoFile = true;
            try {
                for (let pass = 0; pass < VIDEO_BASELINE_PASSES; pass++) {
                    status.textContent = `動画キャリブレーション中 ${pass + 1}/${VIDEO_BASELINE_PASSES}`;
                    await seekVideo(0);
                    await video.play();
                    while (video.currentTime < duration) {
                        await waitVideoFrame();
                        const result = detectCurrentFrame();
                        const categories = result.faceBlendshapes[0]?.categories ?? [];
                        if (!categories.length) continue;
                        sampleCount++;
                        addPoseCalibrationSample(result.faceLandmarks[0]);
                        for (const { categoryName, score } of categories) {
                            const values = samplesByName.get(categoryName) ?? [];
                            values.push(score);
                            samplesByName.set(categoryName, values);
                        }
                    }
                    video.pause();
                }
            } finally {
                video.pause();
                calibratingVideoFile = false;
            }

            if (!sampleCount) {
                status.textContent = `最初の${VIDEO_BASELINE_SECONDS}秒x${VIDEO_BASELINE_PASSES}回で顔を検出できません`;
                return;
            }

            base.clear();
            calibration.stats.clear();
            Object.assign(calibration, { warmup: 0, remaining: 0, samples: sampleCount });
            for (const [categoryName, values] of samplesByName) {
                const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
                const min = Math.min(...values);
                const max = Math.max(...values);
                const dead = Math.max((max - min) * 0.1, DEADZONE);
                base.set(categoryName, { mean, min, max, dead });
            }
            finishPoseCalibration();
            calibrate.disabled = false;
            measureMotionGain.disabled = false;
            hideCalibrationGuide();
            status.textContent = `キャリブ済み (${VIDEO_BASELINE_SECONDS * VIDEO_BASELINE_PASSES}s)`;
        }

        function accumulateCategoryStats(stats, categories) {
            for (const { categoryName, score } of categories) {
                const stat = stats.get(categoryName) ?? { sum: 0, sq: 0 };
                stat.sum += score;
                stat.sq += score * score;
                stats.set(categoryName, stat);
            }
        }

        function writeCalibrationBase(targetBase, stats, sampleCount) {
            if (!sampleCount) return;

            for (const [categoryName, { sum, sq }] of stats) {
                const mean = sum / sampleCount;
                const variance = Math.max(sq / sampleCount - mean * mean, 0);
                targetBase.set(categoryName, { mean, dead: Math.max(Math.sqrt(variance) * 3, DEADZONE) });
            }
        }

        function calibratedScore(categoryName, score, baseMap = base) {
            const { mean = 0, dead = 0, min = mean - dead, max = mean + dead } = baseMap.get(categoryName) ?? {};
            if (score >= min - dead && score <= max + dead) return 0;
            return score < mean ? score - (min - dead) : score - (max + dead);
        }

        function poseGatedCalibratedScore(categoryName, score, poseStable = currentPoseStable, baseMap = base) {
            return poseStable ? calibratedScore(categoryName, score, baseMap) : 0;
        }

        function adjustedCalibratedScore(categoryName, score, poseStable = currentPoseStable, baseMap = base) {
            return poseGatedCalibratedScore(categoryName, score, poseStable, baseMap) * motionGain(categoryName);
        }

        function motionGain(categoryName) {
            return motionGains.get(categoryName) ?? 1;
        }

        function resetPoseCalibration() {
            neutralPose = null;
            currentPoseStable = true;
            resetPoseCalibrationState(poseCalibration);
        }

        function addPoseCalibrationSample(landmarks = []) {
            addPoseCalibrationSampleToState(poseCalibration, landmarks);
        }

        function finishPoseCalibration() {
            neutralPose = finishPoseCalibrationState(poseCalibration);
        }

        function createCalibrationState(warmup = 0, frames = 0) {
            return { warmup, remaining: frames, samples: 0, stats: new Map() };
        }

        function createPoseCalibrationState() {
            return { samples: 0, sum: null };
        }

        function resetPoseCalibrationState(state) {
            Object.assign(state, { samples: 0, sum: null });
        }

        function addPoseCalibrationSampleToState(state, landmarks = []) {
            const pose = getPose(landmarks);
            if (!pose) return;

            state.sum ??= { scale: 0, yaw: 0, pitch: 0, roll: 0 };

            for (const key of Object.keys(state.sum)) {
                state.sum[key] += pose[key];
            }
            state.samples++;
        }

        function finishPoseCalibrationState(state) {
            if (!state.samples || !state.sum) return null;
            return Object.fromEntries(Object.entries(state.sum)
                .map(([key, value]) => [key, value / state.samples]));
        }

        function isPoseStable(landmarks = [], poseThreshold = POSE_THRESHOLD, rollThreshold = ROLL_THRESHOLD) {
            return isPoseStableForBase(landmarks, base, neutralPose, poseThreshold, rollThreshold);
        }

        function isPoseStableForBase(landmarks = [], baseMap = base, basePose = neutralPose, poseThreshold = POSE_THRESHOLD, rollThreshold = ROLL_THRESHOLD) {
            if (!baseMap.size || !basePose) return true;
            const pose = getPose(landmarks);
            if (!pose) return false;

            const dPose = poseDiff(pose, basePose);
            const dRoll = Math.abs(angleDiff(pose.roll, basePose.roll));
            return dPose < poseThreshold && dRoll < rollThreshold;
        }

        function getPose(landmarks = []) {
            const leftEye = averageLandmarks(landmarks, [33, 133]);
            const rightEye = averageLandmarks(landmarks, [263, 362]);
            const nose = landmarks[1];
            if (!leftEye || !rightEye || !nose) return null;

            const eyeCenter = midpoint(leftEye, rightEye);
            const eyeDistance = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);
            if (!Number.isFinite(eyeDistance) || eyeDistance <= 0.001) return null;

            const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
            const noseVector = rotatePoint({ x: nose.x - eyeCenter.x, y: nose.y - eyeCenter.y }, -roll);

            return {
                scale: eyeDistance,
                yaw: noseVector.x / eyeDistance,
                pitch: noseVector.y / eyeDistance,
                roll
            };
        }

        function poseDiff(pose, basePose) {
            const scale = Math.max(basePose.scale, 0.001);
            return (
                Math.abs(Math.log(Math.max(pose.scale, 0.001) / scale)) +
                Math.abs(pose.yaw - basePose.yaw) +
                Math.abs(pose.pitch - basePose.pitch)
            );
        }

        function angleDiff(value, baseValue) {
            return Math.atan2(Math.sin(value - baseValue), Math.cos(value - baseValue));
        }

        function averageLandmarks(landmarks, indices) {
            const points = indices.map(index => landmarks[index]).filter(Boolean);
            if (!points.length) return null;
            return {
                x: points.reduce((sum, point) => sum + point.x, 0) / points.length,
                y: points.reduce((sum, point) => sum + point.y, 0) / points.length
            };
        }

        function rotatePoint(point, angle) {
            const [cos, sin] = [Math.cos(angle), Math.sin(angle)];
            return {
                x: point.x * cos - point.y * sin,
                y: point.x * sin + point.y * cos
            };
        }

        function startMotionGainCalibration() {
            if (!base.size || calibrationActive()) {
                status.textContent = "先にキャリブレーションしてください";
                return;
            }
            Object.assign(motionGainCalibration, {
                active: true,
                startedAt: performance.now(),
                duration: MOTION_GAIN_SAMPLE_MS,
                setIndex: 0
            });
            motionGainCalibration.stats.clear();
            motionGainCalibration.sets = [];
            motionGains.clear();
            activeMotionGainSetName = "";
            renderMotionGainSetOptions();
            resetMotionVisualState();
            showCalibrationGuide(`${MOTION_GAIN_MESSAGE}\n1/${MOTION_GAIN_SET_COUNT}`);
            calibrate.disabled = true;
            measureMotionGain.disabled = true;
            updateCalibrationPoint(0);
        }

        function resetMotionGainCalibration() {
            Object.assign(motionGainCalibration, {
                active: false,
                startedAt: 0,
                duration: MOTION_GAIN_SAMPLE_MS,
                setIndex: 0
            });
            motionGainCalibration.stats.clear();
            motionGainCalibration.sets = [];
        }

        function updateMotionGainCalibration(categories) {
            if (!motionGainCalibration.active || !base.size) return;

            const elapsed = performance.now() - motionGainCalibration.startedAt;
            const remaining = Math.max(Math.ceil((motionGainCalibration.duration - elapsed) / 1000), 0);

            if (!categories.length) {
                status.textContent = `係数測定 ${motionGainCalibration.setIndex + 1}/${MOTION_GAIN_SET_COUNT}: 顔を検出中 ${remaining}s`;
                updateCalibrationPoint(clamp(elapsed / motionGainCalibration.duration * 100, 0, 100));
                if (elapsed >= motionGainCalibration.duration) finishMotionGainCalibrationSet();
                return;
            }

            for (const { categoryName, score } of categories) {
                const value = Math.abs(poseGatedCalibratedScore(categoryName, score));
                const stat = motionGainCalibration.stats.get(categoryName) ?? { max: 0 };
                stat.max = Math.max(stat.max, value);
                motionGainCalibration.stats.set(categoryName, stat);
            }

            status.textContent = `係数測定 ${motionGainCalibration.setIndex + 1}/${MOTION_GAIN_SET_COUNT}: ${remaining}s`;
            updateCalibrationPoint(clamp(elapsed / motionGainCalibration.duration * 100, 0, 100));

            if (elapsed < motionGainCalibration.duration) return;
            finishMotionGainCalibrationSet();
        }

        function finishMotionGainCalibrationSet() {
            const amplitudes = [...motionGainCalibration.stats.entries()]
                .map(([categoryName, stat]) => ({ categoryName, amount: stat.max }))
                .filter(({ amount }) => amount >= MOTION_GAIN_EPSILON);

            if (!amplitudes.length) {
                resetMotionGainCalibration();
                calibrate.disabled = false;
                measureMotionGain.disabled = false;
                hideCalibrationGuide();
                status.textContent = "係数測定: 変動を検出できません";
                return;
            }

            const target = median(amplitudes.map(({ amount }) => amount));
            const setGains = {};

            for (const [categoryName, stat] of motionGainCalibration.stats) {
                const gain = stat.max < MOTION_GAIN_EPSILON
                    ? MOTION_GAIN_MAX
                    : (target / stat.max) ** MOTION_GAIN_POWER;
                setGains[categoryName] = roundGain(gain);
            }

            motionGainCalibration.sets.push(setGains);
            motionGainCalibration.setIndex++;

            if (motionGainCalibration.setIndex < MOTION_GAIN_SET_COUNT) {
                motionGainCalibration.startedAt = performance.now();
                motionGainCalibration.stats.clear();
                showCalibrationGuide(`${MOTION_GAIN_MESSAGE}\n${motionGainCalibration.setIndex + 1}/${MOTION_GAIN_SET_COUNT}`);
                updateCalibrationPoint(0);
                return;
            }

            finishMotionGainCalibration();
        }

        function finishMotionGainCalibration() {
            const averagedGains = averageMotionGainSets(motionGainCalibration.sets);
            const classifications = { easy: 0, hard: 0 };

            motionGains.clear();
            for (const [categoryName, gain] of Object.entries(averagedGains)) {
                motionGains.set(categoryName, gain);
                if (gain < 0.75) classifications.easy++;
                if (gain > 1.25) classifications.hard++;
            }

            resetMotionGainCalibration();
            calibrate.disabled = false;
            measureMotionGain.disabled = false;
            hideCalibrationGuide();
            status.textContent = `係数測定済み (${MOTION_GAIN_SET_COUNT}セット平均): 動きやすい ${classifications.easy}, 動きにくい ${classifications.hard}`;
        }

        function averageMotionGainSets(sets) {
            const valuesByName = new Map();

            for (const set of sets) {
                for (const [categoryName, gain] of Object.entries(set)) {
                    if (!Number.isFinite(gain)) continue;
                    const values = valuesByName.get(categoryName) ?? [];
                    values.push(gain);
                    valuesByName.set(categoryName, values);
                }
            }

            return Object.fromEntries([...valuesByName].map(([categoryName, values]) => [
                categoryName,
                roundGain(values.reduce((sum, value) => sum + value, 0) / values.length)
            ]));
        }

        function roundGain(value) {
            return Number(clamp(value, MOTION_GAIN_MIN, MOTION_GAIN_MAX).toFixed(4));
        }

        function median(values) {
            const sorted = [...values].sort((a, b) => a - b);
            const center = Math.floor(sorted.length / 2);
            return sorted.length % 2
                ? sorted[center]
                : (sorted[center - 1] + sorted[center]) / 2;
        }

        function signed(value) {
            return `${value >= 0 ? "+" : ""}${value.toFixed(4)}`;
        }

        function updateSpectrumFrame(categories, shapeCategories = categories) {
            const { width, height } = vizCanvas;
            const now = performance.now();
            const material = currentMaterial(now);
            const [cx, cy] = [width / 2, height * SHAPE_CENTER_Y_RATIO];
            const baseRadius = Math.min(width, height) * SHAPE_BASE_RADIUS_RATIO;
            const showCalibrationOutline = calibrationOutlineVisible();

            if (!categories.length && !shapeCategories.length) {
                if (showCalibrationOutline) {
                    const points = SHAPE_TEMPLATES.circle.map(point => ({
                        x: cx + point.x * baseRadius,
                        y: cy + point.y * baseRadius
                    }));
                    return { active: false, points, material, shapeName: "circle" };
                }
                return { active: false, points: [], material, shapeName: "circle" };
            }

            const maxSpike = Math.min(width, height) * MAX_VERTEX_DISPLACEMENT_RATIO;
            const calibrated = base.size > 0;
            const ordered = orderedSpectrumCategories(categories);
            const time = now * 0.001;
            const springStates = ordered.map(({ categoryName, score }) => {
                const rawValue = calibrated ? adjustedCalibratedScore(categoryName, score) : 0;
                const value = Math.abs(rawValue) < SPECTRUM_ZERO_THRESHOLD ? 0 : rawValue;
                const target = clamp(value * VERTEX_RESPONSE_GAIN * material.response, -1, 1);
                const previous = spectrum.get(categoryName) ?? 0;
                const velocity =
                    ((spectrumVelocity.get(categoryName) ?? 0) + (target - previous) * material.spring)
                    * material.damping;
                const phase = spectrumPhase.get(categoryName) ?? Math.random() * Math.PI * 2;

                spectrumVelocity.set(categoryName, velocity);
                spectrumPhase.set(categoryName, phase);
                return { categoryName, position: previous + velocity, velocity, phase };
            });
            const diffusedStates = springStates.map(({ categoryName, position, velocity, phase }, i) => {
                const left = springStates[(i - 1 + springStates.length) % springStates.length].position;
                const right = springStates[(i + 1) % springStates.length].position;
                const diffused = position + (left + right - position * 2) * material.diffusion;

                spectrum.set(categoryName, diffused);
                return { position: diffused, velocity, phase };
            });
            const surfaceStates = resampleCyclicStates(diffusedStates, SHAPE_POINT_COUNT);
            const shape = updateShapeMorph(shapeCategories, calibrated);
            const points = surfaceStates.map(({ position, velocity, phase }, i) => {
                const templatePoint = blendedTemplatePoint(i, shape.weights);
                const length = Math.hypot(templatePoint.x, templatePoint.y) || 1;
                const normal = { x: templatePoint.x / length, y: templatePoint.y / length };
                const angle = Math.atan2(templatePoint.y, templatePoint.x);
                const breathing = Math.sin(time * material.noiseSpeed * 0.75) * material.breathing;
                const surfaceMotion =
                    Math.sin(time * material.noiseSpeed + angle * 2 + phase) * material.noise
                    + Math.sin(time * material.noiseSpeed * 0.43 - angle * 3 + phase * 0.7) * material.noise * 0.58;
                const ripple =
                    Math.sin(time * (1.2 + material.noiseSpeed) + phase)
                    * Math.min(Math.abs(velocity) * material.ripple, 0.055);
                const deformation = clamp(position + breathing + surfaceMotion + ripple, -1, 1);
                const displacement = deformation * maxSpike;

                return {
                    x: cx + templatePoint.x * baseRadius + normal.x * displacement,
                    y: cy + templatePoint.y * baseRadius + normal.y * displacement
                };
            });

            return { active: calibrated, points, material, shapeName: shape.name };
        }

        function resampleCyclicStates(states, count) {
            if (!states.length) {
                return Array.from({ length: count }, (_, index) => ({
                    position: 0,
                    velocity: 0,
                    phase: index / count * Math.PI * 2
                }));
            }

            return Array.from({ length: count }, (_, index) => {
                const sourcePosition = index / count * states.length;
                const leftIndex = Math.floor(sourcePosition) % states.length;
                const rightIndex = (leftIndex + 1) % states.length;
                const amount = sourcePosition - Math.floor(sourcePosition);
                const left = states[leftIndex];
                const right = states[rightIndex];

                return {
                    position: left.position + (right.position - left.position) * amount,
                    velocity: left.velocity + (right.velocity - left.velocity) * amount,
                    phase: left.phase + (right.phase - left.phase) * amount
                };
            });
        }

        function updateShapeMorph(categories, calibrated) {
            const byName = new Map(categories.map(category => [category.categoryName, category.score]));
            const targets = new Map();

            for (const gesture of SHAPE_GESTURES) {
                const available = gesture.categories.filter(categoryName => byName.has(categoryName));
                const average = available.length
                    ? available.reduce((sum, categoryName) => {
                        const score = calibrated ? adjustedCalibratedScore(categoryName, byName.get(categoryName)) : 0;
                        return sum + Math.max(score, 0);
                    }, 0) / available.length
                    : 0;
                targets.set(
                    gesture.name,
                    smoothstep(clamp(average * gesture.strength, 0, 1)) * SHAPE_MORPH_AMOUNT
                );
            }

            const strongest = Math.max(0, ...targets.values());
            targets.set("circle", Math.max(0.1, 1 - strongest));

            for (const [name, target] of targets) {
                const previous = shapeWeights.get(name) ?? (name === "circle" ? 1 : 0);
                shapeWeights.set(name, previous * 0.86 + target * 0.14);
            }

            const total = [...shapeWeights.values()].reduce((sum, value) => sum + value, 0) || 1;
            const weights = new Map([...shapeWeights].map(([name, value]) => [name, value / total]));
            let candidate = { name: "circle", weight: weights.get("circle") ?? 0 };

            for (const gesture of SHAPE_GESTURES) {
                const weight = weights.get(gesture.name) ?? 0;
                if (weight > candidate.weight) candidate = { ...gesture, weight };
            }

            const currentWeight = weights.get(dominantShapeName) ?? 0;
            if (candidate.name === dominantShapeName || candidate.weight > currentWeight + 0.08) {
                dominantShapeName = candidate.name;
            }
            return { weights, name: dominantShapeName };
        }

        function blendedTemplatePoint(index, weights) {
            const point = { x: 0, y: 0 };

            for (const [name, weight] of weights) {
                const templatePoint = SHAPE_TEMPLATES[name][index];
                point.x += templatePoint.x * weight;
                point.y += templatePoint.y * weight;
            }

            return point;
        }

        function createShapeTemplates(pointCount) {
            const circle = Array.from({ length: pointCount }, (_, index) => {
                const angle = index / pointCount * Math.PI * 2 - Math.PI / 2;
                return { x: Math.cos(angle), y: Math.sin(angle) };
            });
            const starVertices = Array.from({ length: 10 }, (_, index) => {
                const angle = index / 10 * Math.PI * 2 - Math.PI / 2;
                const radius = index % 2 ? 0.43 : 1;
                return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
            });

            return {
                circle,
                star: samplePolygonPerimeter(starVertices, pointCount),
                triangle: samplePolygonPerimeter([
                    { x: 0, y: -1.05 },
                    { x: 0.96, y: 0.78 },
                    { x: -0.96, y: 0.78 }
                ], pointCount),
                trapezoid: samplePolygonPerimeter([
                    { x: 0, y: -0.72 },
                    { x: 0.62, y: -0.72 },
                    { x: 1, y: 0.72 },
                    { x: -1, y: 0.72 },
                    { x: -0.62, y: -0.72 }
                ], pointCount),
                diamond: samplePolygonPerimeter([
                    { x: 0, y: -1.08 },
                    { x: 0.9, y: 0 },
                    { x: 0, y: 1.08 },
                    { x: -0.9, y: 0 }
                ], pointCount),
                ellipse: circle.map(({ x, y }) => ({ x: x * 1.05, y: y * 0.48 })),
                pentagon: samplePolygonPerimeter(regularPolygonVertices(5), pointCount),
                square: samplePolygonPerimeter([
                    { x: 0, y: -0.82 },
                    { x: 0.82, y: -0.82 },
                    { x: 0.82, y: 0.82 },
                    { x: -0.82, y: 0.82 },
                    { x: -0.82, y: -0.82 }
                ], pointCount)
            };
        }

        function regularPolygonVertices(count) {
            return Array.from({ length: count }, (_, index) => {
                const angle = index / count * Math.PI * 2 - Math.PI / 2;
                return { x: Math.cos(angle), y: Math.sin(angle) };
            });
        }

        function samplePolygonPerimeter(vertices, pointCount) {
            const edges = vertices.map((start, index) => {
                const end = vertices[(index + 1) % vertices.length];
                return { start, end, length: Math.hypot(end.x - start.x, end.y - start.y) };
            });
            const perimeter = edges.reduce((sum, edge) => sum + edge.length, 0);

            return Array.from({ length: pointCount }, (_, pointIndex) => {
                let distance = pointIndex / pointCount * perimeter;
                let edge = edges[0];

                for (const candidate of edges) {
                    edge = candidate;
                    if (distance <= edge.length) break;
                    distance -= edge.length;
                }

                const amount = edge.length ? distance / edge.length : 0;
                return {
                    x: edge.start.x + (edge.end.x - edge.start.x) * amount,
                    y: edge.start.y + (edge.end.y - edge.start.y) * amount
                };
            });
        }

        function currentMaterial(now) {
            const startedAt = visualizeStartedAt || now;
            const elapsed = clamp((now - startedAt) / 1000, 0, EXPERIENCE_DURATION_SECONDS);
            let phaseIndex = 0;

            while (phaseIndex + 1 < MATERIAL_PHASES.length && elapsed >= MATERIAL_PHASES[phaseIndex + 1].start) {
                phaseIndex++;
            }

            const current = MATERIAL_PHASES[phaseIndex];
            if (!phaseIndex) return current;

            const previous = MATERIAL_PHASES[phaseIndex - 1];
            const transition = smoothstep(clamp((elapsed - current.start) / MATERIAL_TRANSITION_SECONDS, 0, 1));
            return interpolateMaterial(previous, current, transition);
        }

        function interpolateMaterial(from, to, amount) {
            const material = { name: to.name };

            for (const key of ["spring", "damping", "diffusion", "response", "breathing", "noise", "noiseSpeed", "ripple", "tension", "fill", "glow", "lineWidth"]) {
                material[key] = from[key] + (to[key] - from[key]) * amount;
            }
            for (const key of ["stroke", "fillColor", "background"]) {
                material[key] = from[key].map((value, index) => value + (to[key][index] - value) * amount);
            }

            return material;
        }

        function smoothstep(value) {
            return value * value * (3 - 2 * value);
        }

        function drawSpectrum({ active, points, material, shapeName }) {
            const { width, height } = vizCanvas;
            visualize.dataset.material = material.name;
            visualize.dataset.shape = shapeName;
            const backgroundAlpha = calibrationStage === "positioning" ? 0.32 : 0.9;
            visualize.style.backgroundColor = rgba(material.background, backgroundAlpha);
            experienceScorePanel.style.setProperty("--score-panel-color", rgba(material.stroke, 0.9));
            experienceScorePanel.style.setProperty("--score-panel-glow", rgba(material.stroke, 0.14));
            vizCtx.clearRect(0, 0, width, height);
            drawSpectrumPath(vizCtx, points, active, material);
        }

        function orderedSpectrumCategories(categories) {
            const byName = new Map(categories.map(category => [category.categoryName, category]));
            const known = spectrumOrder.filter(categoryName => byName.has(categoryName));
            const added = categories
                .map(({ categoryName }) => categoryName)
                .filter(categoryName => !known.includes(categoryName));
            const nextOrder = known.length ? [...known, ...shuffle(added)] : shuffle(categories.map(({ categoryName }) => categoryName));

            spectrumOrder = nextOrder;

            return nextOrder.map(categoryName => byName.get(categoryName)).filter(Boolean);
        }

        function shuffle(items) {
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function drawSpectrumPath(targetCtx, points, active, material) {
            if (points.length < 3) return;
            const showCalibrationOutline = calibrationOutlineVisible();

            targetCtx.save();
            targetCtx.lineWidth = showCalibrationOutline ? Math.max(material.lineWidth, 7) : material.lineWidth;
            targetCtx.lineJoin = "round";
            targetCtx.lineCap = "round";
            targetCtx.strokeStyle = showCalibrationOutline
                ? "rgba(47, 207, 131, 0.98)"
                : active ? rgba(material.stroke, 0.96) : rgba(material.stroke, 0.48);
            targetCtx.fillStyle = showCalibrationOutline
                ? "rgba(255, 255, 255, 0.06)"
                : active ? rgba(material.fillColor, material.fill) : rgba(material.fillColor, material.fill * 0.35);
            targetCtx.shadowColor = showCalibrationOutline
                ? "rgba(47, 207, 131, 0.72)"
                : active ? rgba(material.fillColor, 0.2) : "transparent";
            targetCtx.shadowBlur = showCalibrationOutline ? 22 : active ? material.glow : 0;
            targetCtx.beginPath();
            targetCtx.moveTo(points[0].x, points[0].y);

            for (let i = 0; i < points.length; i++) {
                const p0 = points[(i - 1 + points.length) % points.length];
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];
                const p3 = points[(i + 2) % points.length];
                const tension = material.tension;
                const cp1 = {
                    x: p1.x + (p2.x - p0.x) * tension / 6,
                    y: p1.y + (p2.y - p0.y) * tension / 6
                };
                const cp2 = {
                    x: p2.x - (p3.x - p1.x) * tension / 6,
                    y: p2.y - (p3.y - p1.y) * tension / 6
                };
                targetCtx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, p2.x, p2.y);
            }

            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.stroke();
            targetCtx.restore();
        }

        function rgba([red, green, blue], alpha) {
            return `rgba(${Math.round(red)}, ${Math.round(green)}, ${Math.round(blue)}, ${alpha})`;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(value, max));
        }

        function midpoint(a, b) {
            return {
                x: (a.x + b.x) / 2,
                y: (a.y + b.y) / 2
            };
        }

        function drawLandmarks(landmarks = []) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!currentPoseStable) return;

            const media = activeMode === "image-pair" ? sourceImage : video;
            const [sw, sh] = [
                media.videoWidth || media.naturalWidth || VW,
                media.videoHeight || media.naturalHeight || VH
            ];
            const scale = activeMode === "camera"
                ? Math.max(canvas.width / sw, canvas.height / sh)
                : Math.min(canvas.width / sw, canvas.height / sh);
            const [dx, dy] = [(canvas.width - sw * scale) / 2, (canvas.height - sh * scale) / 2];

            ctx.fillStyle = "green";
            ctx.beginPath();
            for (const p of landmarks) {
                const [x, y] = [p.x * sw * scale + dx, p.y * sh * scale + dy];
                ctx.moveTo(x, y);
                ctx.arc(x, y, 1.2, 0, Math.PI * 2);
            }
            ctx.fill();
        }
    </script>
