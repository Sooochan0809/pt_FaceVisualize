<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Face Visualize UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(24px, 3vw, 40px);
            background: #F0F0F0;
            color: #2f2250;
        }

        main {
            width: min(100%, 1200px);
            display: grid;
            gap: 30px;
            margin-inline: auto;
        }

        button {
            width: 100%;
            min-height: 112px;
            border: 0;
            border-radius: 28px;
            display: grid;
            place-items: center;
            padding: 16px 24px;
            background: #6251d6;
            box-shadow: 0 7px 0 rgb(47 34 80 / 18%);
            color: #fff;
            font: inherit;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgb(47 34 80 / 12%);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        #panelStart,
        .highlightDecision {
            width: min(100%, 520px);
            justify-self: center;
        }

        #panelStart {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(calc(100% - 48px), 520px);
            transform: translate(-50%, -50%);
        }

        #panelStart:active {
            transform: translate(-50%, calc(-50% + 3px));
        }

        [hidden] {
            display: none !important;
        }

        .highlightPanel {
            display: grid;
            gap: 16px;
            animation: highlightPanelIn 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .highlightPanel.is-loading {
            position: fixed;
            inset: 0;
            place-content: center;
            padding: clamp(24px, 3vw, 40px);
        }

        .highlightTitle {
            margin: 0;
            color: #2f2250;
            font-size: clamp(24px, 3.4vw, 38px);
            line-height: 1.35;
            text-align: center;
        }

        .highlightInstruction {
            margin: -8px 0 0;
            color: #756d88;
            font-size: clamp(16px, 2.2vw, 24px);
            line-height: 1.5;
            text-align: center;
        }

        .highlightGrid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: clamp(8px, 1.5vw, 18px);
        }

        .highlightCard {
            position: relative;
            overflow: hidden;
            margin: 0;
            border: clamp(3px, 0.45vw, 5px) solid #fff;
            border-radius: clamp(12px, 2vw, 20px);
            aspect-ratio: 3 / 4;
            background: #dedbe9;
            box-shadow: 0 5px 14px rgb(47 34 80 / 13%);
            animation: highlightCardIn 450ms cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: calc(var(--highlight-index) * 55ms);
            cursor: pointer;
            transition:
                border-color 160ms ease,
                box-shadow 160ms ease,
                transform 160ms ease;
        }

        .highlightCard.is-selected {
            border-color: #6251d6;
            box-shadow:
                0 0 0 3px rgb(98 81 214 / 20%),
                0 7px 16px rgb(47 34 80 / 20%);
            transform: translateY(-3px);
        }

        .highlightCard img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .highlightRank {
            position: absolute;
            top: clamp(4px, 0.8vw, 9px);
            left: clamp(4px, 0.8vw, 9px);
            min-width: clamp(22px, 3.4vw, 36px);
            height: clamp(22px, 3.4vw, 36px);
            border-radius: 999px;
            display: grid;
            place-items: center;
            padding-inline: clamp(5px, 0.8vw, 9px);
            background: rgb(47 34 80 / 88%);
            color: #fff;
            font-size: clamp(11px, 1.7vw, 18px);
            line-height: 1;
        }

        .highlightCard:not(.is-selected) .highlightRank {
            display: none;
        }

        .highlightDecision {
            min-height: 76px;
            border-radius: 22px;
            font-size: 22px;
        }

        .highlightConfirmation {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: clamp(24px, 4vw, 56px);
            background: rgb(47 34 80 / 42%);
            backdrop-filter: blur(8px);
        }

        .highlightConfirmationCard {
            width: min(100%, 720px);
            display: grid;
            gap: 28px;
            border-radius: 32px;
            padding: clamp(28px, 5vw, 48px);
            background: #f0f0f0;
            box-shadow: 0 18px 50px rgb(47 34 80 / 28%);
        }

        .highlightConfirmationText {
            margin: 0;
            color: #2f2250;
            font-size: clamp(18px, 3.4vw, 36px);
            line-height: 1.5;
            text-align: center;
            white-space: nowrap;
        }

        .highlightConfirmationActions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .highlightConfirmationActions button {
            min-height: 80px;
            border-radius: 22px;
            padding-inline: 14px;
            font-size: clamp(18px, 2.4vw, 25px);
        }

        .highlightReselect {
            background: #fff;
            color: #6251d6;
        }

        .highlightEmpty {
            margin: 0;
            border-radius: 20px;
            padding: 28px 18px;
            background: #fff;
            color: #756d88;
            text-align: center;
            line-height: 1.7;
        }

        @keyframes highlightPanelIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
        }

        @keyframes highlightCardIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .highlightPanel,
            .highlightCard {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <button id="panelStart" type="button" disabled>準備中...</button>
        <section id="highlightPanel" class="highlightPanel" aria-live="polite" hidden>
            <h1 id="highlightTitle" class="highlightTitle">ハイライト📸</h1>
            <p id="highlightInstruction" class="highlightInstruction">6枚選んでください（0/6）</p>
            <p id="highlightEmpty" class="highlightEmpty" hidden>画像を取得できませんでした</p>
            <div id="highlightGrid" class="highlightGrid"></div>
            <button id="highlightDecision" class="highlightDecision" type="button" disabled>決定</button>
        </section>
    </main>
    <section id="highlightConfirmation" class="highlightConfirmation" role="dialog" aria-modal="true"
        aria-labelledby="highlightConfirmationText" hidden>
        <div class="highlightConfirmationCard">
            <p id="highlightConfirmationText" class="highlightConfirmationText">本当にこの６枚でいいですか？</p>
            <div class="highlightConfirmationActions">
                <button id="highlightConfirmYes" type="button">はい</button>
                <button id="highlightReselect" class="highlightReselect" type="button">選びなおす</button>
            </div>
        </div>
    </section>
    <audio id="thumbnailMusic" src="./assets/audio/thumbnail.mp3" preload="auto" loop></audio>
    <audio id="workMusic" src="./assets/audio/work.mp3" preload="auto" loop></audio>
    <audio id="startSound" src="./assets/audio/start.mp3" preload="auto"></audio>
    <audio id="calibrationSound" src="./assets/audio/calibration.mp3" preload="auto"></audio>
    <audio id="finishSound" src="./assets/audio/finish.mp3" preload="auto"></audio>
    <script src="./lenticular-maker.js"></script>
    <script src="./facecard-archive.js"></script>

    <script>
        const panelStart = document.getElementById("panelStart");
        const thumbnailMusic = document.getElementById("thumbnailMusic");
        const workMusic = document.getElementById("workMusic");
        const startSound = document.getElementById("startSound");
        const calibrationSound = document.getElementById("calibrationSound");
        const finishSound = document.getElementById("finishSound");
        const highlightPanel = document.getElementById("highlightPanel");
        const highlightTitle = document.getElementById("highlightTitle");
        const highlightInstruction = document.getElementById("highlightInstruction");
        const highlightGrid = document.getElementById("highlightGrid");
        const highlightEmpty = document.getElementById("highlightEmpty");
        const highlightDecision = document.getElementById("highlightDecision");
        const highlightConfirmation = document.getElementById("highlightConfirmation");
        const highlightConfirmYes = document.getElementById("highlightConfirmYes");
        const highlightReselect = document.getElementById("highlightReselect");
        const targetOrigin = location.origin === "null" ? "*" : location.origin;
        const THUMBNAIL_MUSIC_VOLUME = 0.55;
        const WORK_MUSIC_VOLUME = 0.7;
        const EFFECT_SOUND_VOLUME = 0.6;
        const WORK_MUSIC_RATE_NORMAL = 1;
        const WORK_MUSIC_RATE_MIN = 0.5;
        const WORK_MUSIC_RATE_MAX = 2;
        const MUSIC_FADE_MS = 1200;
        const HIGHLIGHT_SELECTION_COUNT = 6;
        const HIGHLIGHT_DISPLAY_LIMIT = 10;
        const CARD_POPUP_FEATURES = "popup=yes,width=900,height=700,resizable=yes,scrollbars=yes";
        const ARCHIVE_COUNTER_STORAGE_KEY = "motion2FacecardArchiveCounter";
        const ARCHIVE_CARD_ART_URL = "./card/assets/card-art.png";
        const audioFadeTokens = new WeakMap();
        let highlightImages = [];
        let selectedHighlightIndexes = [];
        let cardWindow = null;
        let cardReady = false;
        let pendingCardPayload = null;
        let thumbnailReady = true;

        function playLoopMusic(audio, volume) {
            audioFadeTokens.set(audio, (audioFadeTokens.get(audio) ?? 0) + 1);
            audio.volume = volume;
            audio.play().catch(() => { });
        }

        function stopAudio(audio, restoreVolume) {
            audioFadeTokens.set(audio, (audioFadeTokens.get(audio) ?? 0) + 1);
            audio.pause();
            audio.currentTime = 0;
            audio.volume = restoreVolume;
        }

        function fadeOutAudio(audio, restoreVolume) {
            if (audio.paused) {
                stopAudio(audio, restoreVolume);
                return;
            }

            const token = (audioFadeTokens.get(audio) ?? 0) + 1;
            const startedAt = performance.now();
            const initialVolume = audio.volume;
            audioFadeTokens.set(audio, token);

            const updateVolume = now => {
                if (audioFadeTokens.get(audio) !== token) return;
                const progress = Math.min(1, (now - startedAt) / MUSIC_FADE_MS);
                audio.volume = initialVolume * (1 - progress);

                if (progress < 1) {
                    requestAnimationFrame(updateVolume);
                    return;
                }

                stopAudio(audio, restoreVolume);
            };

            requestAnimationFrame(updateVolume);
        }

        function unlockWorkMusic() {
            workMusic.volume = 0;
            workMusic.play()
                .then(() => stopAudio(workMusic, WORK_MUSIC_VOLUME))
                .catch(() => {
                    workMusic.volume = WORK_MUSIC_VOLUME;
                });
        }

        function playEffectSound(audio, volume = EFFECT_SOUND_VOLUME) {
            audio.currentTime = 0;
            audio.volume = volume;
            audio.play().catch(() => { });
        }

        function stopWorkMusic(fade = false) {
            const stop = fade ? fadeOutAudio : stopAudio;
            stop(workMusic, WORK_MUSIC_VOLUME);
            workMusic.playbackRate = WORK_MUSIC_RATE_NORMAL;
        }

        function send(action) {
            if (!window.opener || window.opener.closed) {
                setButton("スタート", false);
                return;
            }
            window.opener.postMessage({ source: "motion-control-panel", action }, targetOrigin);
        }

        function setButton(label, disabled) {
            panelStart.textContent = label;
            panelStart.disabled = disabled;
        }

        function isTrustedMessage(event, expectedSource, expectedChannel) {
            return event.source === expectedSource
                && event.data?.source === expectedChannel
                && (location.origin === "null" || event.origin === location.origin);
        }

        function clearHighlights() {
            highlightPanel.classList.remove("is-loading");
            highlightPanel.hidden = true;
            highlightEmpty.hidden = true;
            highlightGrid.replaceChildren();
            highlightImages = [];
            selectedHighlightIndexes = [];
            resetCardCreationControls();
            highlightConfirmation.hidden = true;
        }

        function showHighlightsLoading() {
            panelStart.hidden = true;
            highlightGrid.replaceChildren();
            highlightDecision.hidden = true;
            highlightTitle.textContent = "素敵な表情を選んでいます...";
            highlightInstruction.hidden = true;
            highlightEmpty.hidden = true;
            highlightPanel.classList.add("is-loading");
            highlightPanel.hidden = false;
        }

        function renderHighlights(images) {
            const selectedImages = images.slice(0, HIGHLIGHT_DISPLAY_LIMIT);
            highlightPanel.classList.remove("is-loading");
            panelStart.hidden = true;
            highlightDecision.hidden = false;
            highlightTitle.textContent = "ハイライト📸";
            highlightInstruction.hidden = false;
            highlightImages = selectedImages;
            selectedHighlightIndexes = [];
            highlightGrid.replaceChildren();
            updateHighlightSelection();
            highlightEmpty.textContent = "表情を取得できませんでした";
            highlightEmpty.hidden = selectedImages.length > 0;

            selectedImages.forEach((item, index) => {
                const card = document.createElement("figure");
                const image = document.createElement("img");
                const selectionBadge = document.createElement("figcaption");
                const time = Number(item.time);
                const frontal = Number(item.frontalScore);
                const emotionScore = Number(item.emotionScore);

                card.className = "highlightCard";
                card.style.setProperty("--highlight-index", index);
                image.src = item.imageUrl;
                image.alt = `特徴的な瞬間 ${index + 1}`;
                image.loading = "lazy";
                selectionBadge.className = "highlightRank";
                card.tabIndex = 0;
                card.setAttribute("role", "checkbox");
                card.setAttribute("aria-checked", "false");
                card.addEventListener("click", () => toggleHighlightSelection(index));
                card.addEventListener("keydown", event => {
                    if (event.key !== "Enter" && event.key !== " ") return;
                    event.preventDefault();
                    toggleHighlightSelection(index);
                });

                if (Number.isFinite(time)) {
                    card.title = `${item.emotion} / ${time.toFixed(1)}秒 / 正面度 ${Math.round(frontal * 100)}% / 感情度 ${Math.round(emotionScore * 100)}%`;
                }
                card.append(image, selectionBadge);
                highlightGrid.append(card);
            });

            highlightPanel.hidden = false;
        }

        function resetCardCreationControls() {
            highlightDecision.disabled = true;
            highlightDecision.textContent = "決定";
            highlightConfirmYes.disabled = false;
            highlightConfirmYes.textContent = "はい";
            highlightReselect.disabled = false;
        }

        function toggleHighlightSelection(index) {
            const selectedIndex = selectedHighlightIndexes.indexOf(index);
            if (selectedIndex >= 0) {
                selectedHighlightIndexes.splice(selectedIndex, 1);
            } else if (selectedHighlightIndexes.length < HIGHLIGHT_SELECTION_COUNT) {
                selectedHighlightIndexes.push(index);
            }
            updateHighlightSelection();
        }

        function updateHighlightSelection() {
            [...highlightGrid.children].forEach((card, index) => {
                const selectionIndex = selectedHighlightIndexes.indexOf(index);
                const selected = selectionIndex >= 0;
                card.classList.toggle("is-selected", selected);
                card.setAttribute("aria-checked", String(selected));
                const rank = card.querySelector(".highlightRank");
                if (rank) rank.textContent = selected ? String(selectionIndex + 1) : "";
            });

            const selectedCount = selectedHighlightIndexes.length;
            highlightInstruction.textContent =
                `${HIGHLIGHT_SELECTION_COUNT}枚選んでください（${selectedCount}/${HIGHLIGHT_SELECTION_COUNT}）`;
            highlightDecision.disabled = selectedCount !== HIGHLIGHT_SELECTION_COUNT;
        }

        function sendCardPayload() {
            if (!cardReady || !pendingCardPayload || !cardWindow || cardWindow.closed) return;
            cardWindow.postMessage(
                { source: "motion-control-panel", type: "lenticular-card", ...pendingCardPayload },
                targetOrigin
            );
            pendingCardPayload = null;
        }

        function nextArchiveId(now = new Date()) {
            const year = String(now.getFullYear());
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const dateKey = `${year}${month}${day}`;
            let count = 1;

            try {
                const saved = JSON.parse(
                    localStorage.getItem(ARCHIVE_COUNTER_STORAGE_KEY) ?? "null"
                );
                if (saved?.dateKey === dateKey && Number.isInteger(saved.count)) {
                    count = saved.count + 1;
                }
                localStorage.setItem(
                    ARCHIVE_COUNTER_STORAGE_KEY,
                    JSON.stringify({ dateKey, count })
                );
            } catch (error) {
                console.warn("アーカイブ連番を保存できませんでした", error);
                return `${month}${day}-${String(now.getTime()).slice(-6)}`;
            }
            return `${month}${day}-${String(count).padStart(3, "0")}`;
        }

        highlightDecision.onclick = () => {
            if (selectedHighlightIndexes.length !== HIGHLIGHT_SELECTION_COUNT) return;
            highlightConfirmation.hidden = false;
            highlightConfirmYes.focus();
        };

        highlightReselect.onclick = () => {
            highlightConfirmation.hidden = true;
            highlightDecision.focus();
        };

        highlightConfirmYes.onclick = async () => {
            cardReady = false;
            pendingCardPayload = null;
            highlightConfirmYes.disabled = true;
            highlightConfirmYes.textContent = "作成中...";
            highlightReselect.disabled = true;
            cardWindow = window.open(
                "./card/index.html",
                "motion2-print-card",
                CARD_POPUP_FEATURES
            );
            if (!cardWindow) {
                highlightConfirmation.hidden = true;
                highlightTitle.textContent = "印刷画面を開けませんでした";
                resetCardCreationControls();
                highlightDecision.disabled = false;
                return;
            }

            highlightDecision.disabled = true;
            highlightDecision.textContent = "作成中...";
            try {
                const selectedImages = selectedHighlightIndexes.map(
                    index => highlightImages[index]
                );
                const imageUrls = selectedImages.map(item => item.imageUrl);
                const result = await MotionLenticular.create(imageUrls);
                const archiveId = nextArchiveId();
                highlightTitle.textContent = "カードを保存しています...";
                const archive = await MotionFacecardArchive.create({
                    archiveId,
                    lenticular: result,
                    selectedImages,
                    cardArtUrl: ARCHIVE_CARD_ART_URL
                });
                MotionFacecardArchive.download(archive.blob, archive.fileName);
                pendingCardPayload = {
                    imageUrl: result.imageUrl,
                    archiveId
                };
                sendCardPayload();
            } catch (error) {
                console.error(error);
                if (cardWindow && !cardWindow.closed) cardWindow.close();
                cardWindow = null;
                highlightConfirmation.hidden = true;
                highlightTitle.textContent = "カードを保存できませんでした";
                resetCardCreationControls();
                highlightDecision.disabled = false;
            }
        };

        panelStart.onclick = () => {
            clearHighlights();
            thumbnailReady = false;
            setButton("体験中...", true);
            playEffectSound(startSound);
            unlockWorkMusic();
            send("camera");
        };

        function handleMainWindowMessage(data) {
            switch (data.type) {
                case "ready":
                    setButton("スタート", false);
                    break;
                case "error":
                    playLoopMusic(thumbnailMusic, THUMBNAIL_MUSIC_VOLUME);
                    setButton("スタート", false);
                    break;
                case "thumbnail-fade-out":
                    fadeOutAudio(thumbnailMusic, THUMBNAIL_MUSIC_VOLUME);
                    break;
                case "thumbnail-restored":
                    stopWorkMusic();
                    playLoopMusic(thumbnailMusic, THUMBNAIL_MUSIC_VOLUME);
                    thumbnailReady = true;
                    if (highlightPanel.hidden) panelStart.hidden = false;
                    setButton("スタート", false);
                    break;
                case "work-music-start":
                    playLoopMusic(workMusic, WORK_MUSIC_VOLUME);
                    break;
                case "work-music-stop":
                    stopWorkMusic(true);
                    break;
                case "work-music-rate": {
                    const playbackRate = Number(data.playbackRate);
                    if (
                        Number.isFinite(playbackRate)
                        && playbackRate >= WORK_MUSIC_RATE_MIN
                        && playbackRate <= WORK_MUSIC_RATE_MAX
                    ) {
                        workMusic.playbackRate = playbackRate;
                    }
                    break;
                }
                case "calibration-complete":
                    playEffectSound(calibrationSound);
                    break;
                case "feature-images-loading":
                    showHighlightsLoading();
                    break;
                case "feature-images":
                    renderHighlights(Array.isArray(data.images) ? data.images : []);
                    break;
                case "finish":
                    playEffectSound(finishSound);
                    break;
            }
        }

        function handleCardWindowMessage(data) {
            if (data.type === "card-ready") {
                cardReady = true;
                sendCardPayload();
            } else if (data.type === "card-received") {
                clearHighlights();
                if (thumbnailReady) {
                    panelStart.hidden = false;
                    setButton("スタート", false);
                }
            } else if (data.type === "card-error") {
                highlightConfirmation.hidden = true;
                highlightTitle.textContent = "印刷画像を準備できませんでした";
                resetCardCreationControls();
                highlightDecision.disabled = false;
            }
        }

        window.addEventListener("message", event => {
            if (isTrustedMessage(event, window.opener, "motion-main")) {
                handleMainWindowMessage(event.data);
            } else if (isTrustedMessage(event, cardWindow, "motion-card")) {
                handleCardWindowMessage(event.data);
            }
        });

        playLoopMusic(thumbnailMusic, THUMBNAIL_MUSIC_VOLUME);
        send("panel-ready");
    </script>
</body>

</html>
