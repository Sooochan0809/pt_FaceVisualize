<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FlashCut</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --bg: #f3f3f3;
            --panel: #fff;
            --ink: #222;
            --muted: #777;
            --line: #ddd;
            --accent: #3478d4;
            --danger: #b84638;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, "Yu Gothic", sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #f5f5f5;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .app {
            width: min(1900px, 100%);
            min-height: 100dvh;
            margin: auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 480px minmax(0, 1fr);
        }

        .preview,
        .controls {
            min-width: 0;
            padding: 18px;
        }

        .preview {
            display: grid;
            align-content: center;
            gap: 12px;
        }

        .controls {
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            background: #fafafa;
        }

        @media (min-width: 1101px) {

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .app {
                height: 100dvh;
                min-height: 0;
            }

            .preview {
                height: 100dvh;
                overflow: hidden;
            }

            .controls {
                height: 100dvh;
                overflow: auto;
                scrollbar-gutter: stable;
            }
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 1rem;
        }

        h2 {
            font-size: .82rem;
        }

        .readout,
        .status,
        .badge {
            color: var(--muted);
            font-size: .7rem;
        }

        .previewTitle {
            width: min(100%, 46.125dvh);
            margin: 0 auto;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 600;
            text-align: center;
        }

        .stage {
            width: min(100%, 46.125dvh);
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: #111;
            border-radius: 7px;
        }

        #outputCanvas,
        #rawCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #sourceVideo,
        #captureVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .transport {
            width: min(100%, 46.125dvh);
            margin: 0 auto;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .transport button {
            min-width: 88px;
        }

        .transport button.recording {
            border-color: var(--danger);
            background: var(--danger);
            color: #fff;
        }

        .previewFooter {
            width: min(100%, 46.125dvh);
            margin: 0 auto;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            color: var(--muted);
            font-size: .7rem;
        }

        .previewFooter .readout {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .panel {
            min-width: 0;
            margin-bottom: 12px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .panelHead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 13px;
        }

        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            background: #eee;
        }

        .badge.ready {
            background: #e7f1ff;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .analysisControls {
            grid-template-columns: 2fr 1fr;
        }

        .field {
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: .68rem;
        }

        input[type="number"],
        select {
            width: 100%;
            height: 36px;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
            color: var(--ink);
        }

        .grid>button {
            height: 36px;
            align-self: end;
        }

        #analysisChart {
            width: 100%;
            height: 150px;
            display: block;
            border: 1px solid var(--line);
            background: #fff;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 10px;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: .6rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .legend i {
            width: 12px;
            height: 3px;
            background: currentColor;
        }

        .legend .neutral {
            color: #7f8993;
        }

        .legend .emotion {
            color: #e06b4e;
        }

        .legend .mesh {
            color: var(--accent);
        }

        .legend .mix {
            color: var(--ink);
        }

        .rangeWrap {
            position: relative;
            height: 24px;
            margin: 2px 0 5px;
        }

        .rangeWrap input {
            position: absolute;
            inset: 0;
            margin: 0;
            pointer-events: none;
            background: transparent;
        }

        .rangeWrap input::-webkit-slider-thumb {
            pointer-events: auto;
        }

        .rangeWrap input::-moz-range-thumb {
            pointer-events: auto;
        }

        progress {
            width: 100%;
            height: 4px;
            border: 0;
            accent-color: var(--accent);
        }

        .status {
            min-height: 2.7em;
            margin-top: 8px;
            color: var(--muted);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-align: right;
        }

        .status.error {
            color: var(--danger);
        }

        .clipList {
            display: grid;
            gap: 8px;
        }

        .clipEmpty {
            width: 100%;
            min-height: 74px;
            display: grid;
            place-items: center;
            padding: 12px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .clipEmpty:hover {
            border-color: var(--accent);
            background: #f7faff;
        }

        .clipEmpty.drag {
            border-color: var(--accent);
            background: #f2f7ff;
        }

        .clipEmpty img {
            display: block;
            width: 48px;
            height: 48px;
        }

        .clipCard {
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .clipCard.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .clipTop {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }

        .clipName {
            overflow: hidden;
            font-size: .76rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipMeta {
            margin-top: 2px;
            color: var(--muted);
            font-size: .6rem;
        }

        .removeButton {
            width: 28px;
            min-height: 28px;
            padding: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .removeButton img {
            display: block;
            width: 80%;
            height: auto;
            margin: 0;
            position: static;
        }


        .clipEditorDisclosure {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        .clipEditorDisclosure>summary {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .7rem;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
        }

        .clipEditorDisclosure>summary::-webkit-details-marker {
            display: none;
        }

        .clipEditorDisclosure>summary::before {
            content: "›";
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            transition: transform .15s;
        }

        .clipEditorDisclosure[open]>summary::before {
            transform: rotate(90deg);
        }

        .clipEditorDisclosure>summary .badge {
            margin-left: auto;
            font-weight: 400;
        }

        .clipEditorBody {
            padding-top: 10px;
        }

        .analysisHint {
            display: block;
            margin: 6px 0 10px;
            color: var(--muted);
            font-size: .58rem;
        }

        .alignmentControls {
            margin: 0;
        }

        .alignmentControls button {
            width: 100%;
            margin-top: 12px;
        }

        .playbackSetting {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr) 64px;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: .7rem;
        }

        .playbackSetting output {
            text-align: right;
            white-space: nowrap;
        }

        .playbackSetting+.playbackSetting {
            margin-top: 12px;
        }

        .changeReadout {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: .65rem;
        }

        .changeReadout {
            margin-top: 14px;
        }

        .changeReadout output {
            margin-left: 5px;
            color: var(--ink);
        }

        #shapeWave {
            display: block;
            width: 100%;
            height: 82px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .batchActions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        @media (max-width: 1100px) {
            .app {
                display: block;
            }

            .controls {
                border-left: 0;
                border-right: 0;
                border-top: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
            }

            .stage {
                width: min(100%, 39.375dvh);
            }

            .previewTitle {
                width: min(100%, 39.375dvh);
            }

            .transport {
                width: min(100%, 39.375dvh);
            }

            .previewFooter {
                width: min(100%, 39.375dvh);
            }
        }

        @media (max-width: 560px) {

            .preview,
            .controls {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>
    <main class="app">
        <section class="preview">
            <div class="previewTitle">RAW</div>

            <div class="stage">
                <video id="sourceVideo" playsinline muted preload="auto"></video>
                <video id="captureVideo" playsinline muted preload="auto"></video>
                <canvas id="rawCanvas" width="720" height="1280"></canvas>
            </div>
            <div class="previewFooter">
                <span class="readout" id="movieMeta">動画未選択</span>
                <output id="rawTimeOutput">0.00s</output>
            </div>
        </section>

        <aside class="controls">
            <section class="panel">
                <div class="panelHead">
                    <h2>素材</h2><span class="badge" id="sourceBadge">0 clips</span>
                </div>
                <input id="fileInput" type="file" accept="video/*" multiple hidden>
                <div class="batchActions">
                    <button id="analyzeAllButton" class="primary" type="button" disabled>すべて解析</button>
                </div>
                <div class="clipList" id="clipList"></div>
                <details class="clipEditorDisclosure" id="clipEditor" open hidden>
                    <summary>個別解析・コマ抽出<span class="badge" id="analysisBadge">モデル読込中</span></summary>
                    <div class="clipEditorBody">
                        <div class="grid analysisControls">
                            <label class="field">対象の表情
                                <select id="emotionSelect">
                                    <option value="happy">喜び</option>
                                    <option value="sad">悲しみ</option>
                                    <option value="angry">怒り</option>
                                    <option value="fearful">恐れ</option>
                                    <option value="disgusted">嫌悪</option>
                                    <option value="surprised">驚き</option>
                                </select>
                            </label>
                            <button id="analyzeButton" class="primary" type="button" disabled>解析</button>
                        </div>
                        <small class="analysisHint">ファイル名の先頭（01_happy〜06_disgusted）から対象表情を自動判定</small>
                        <div class="legend">
                            <span class="neutral"><i></i>無表情</span>
                            <span class="emotion"><i></i>対象表情</span>
                            <span class="mesh"><i></i>顔形状変位</span>
                            <span class="mix"><i></i>合成進行度</span>
                        </div>
                        <canvas id="analysisChart"></canvas>
                        <div class="rangeWrap">
                            <input id="rangeStart" type="range" min="0" max="1" value="0" step="0.01" disabled
                                aria-label="コマ抽出開始">
                            <input id="rangeEnd" type="range" min="0" max="1" value="1" step="0.01" disabled
                                aria-label="コマ抽出終了">
                        </div>
                        <div class="grid" style="margin-top:12px">
                            <label class="field">発生（秒）<input id="onsetInput" type="number" min="0" step="0.01"
                                    disabled></label>
                            <label class="field">ピーク（秒）<input id="peakInput" type="number" min="0" step="0.01"
                                    disabled></label>
                            <label class="field">収束（秒）<input id="settleInput" type="number" min="0" step="0.01"
                                    disabled></label>
                        </div>
                        <div class="grid">
                            <label class="field">コマ抽出開始（秒）<input id="startInput" type="number" min="0" step="0.01"
                                    disabled></label>
                            <label class="field">コマ抽出終了（秒）<input id="endInput" type="number" min="0" step="0.01"
                                    disabled></label>
                            <button id="prepareButton" class="primary" type="button" disabled>切り出し</button>
                        </div>
                        <progress id="progress" max="1" value="0" hidden></progress>
                    </div>
                </details>
                <p class="status" id="status">モデルを読み込んでいます…</p>
            </section>
            <section class="panel">
                <div class="panelHead">
                    <h2>品質</h2>
                </div>
                <label class="playbackSetting resolutionSetting">解像度
                    <input id="outputResolution" type="range" min="360" max="2160" value="720" step="360">
                    <output id="resolutionOutput">720 × 1280</output>
                </label>
                <label class="playbackSetting">切替速度
                    <input id="flickerFps" type="range" min="2" max="60" value="10" step="1">
                    <output id="fpsOutput">10 fps</output>
                </label>
            </section>
            <section class="panel">
                <div class="panelHead">
                    <h2>位置合わせ</h2>
                </div>
                <div class="alignmentControls">
                    <label class="playbackSetting">横 位置
                        <input id="alignX" type="range" min="-25" max="25" value="0" step="1">
                        <output id="alignXOutput">0%</output>
                    </label>
                    <label class="playbackSetting">縦 位置
                        <input id="alignY" type="range" min="-25" max="25" value="5" step="1">
                        <output id="alignYOutput">5%</output>
                    </label>
                    <label class="playbackSetting">顔サイズ
                        <input id="alignScale" type="range" min="50" max="150" value="140" step="1">
                        <output id="alignScaleOutput">140%</output>
                    </label>
                    <button id="alignApplyButton" class="primary" type="button" disabled>反映</button>
                </div>
            </section>
            <section class="panel">
                <div class="panelHead">
                    <h2>変化周期</h2>
                </div>
                <div class="changeReadout">
                    <span>周期<output id="shapePeriodOutput">0.00s</output></span>
                    <span>最大形状差<output id="shapeReachOutput">100%</output></span>
                </div>
                <canvas id="shapeWave" aria-label="形状差の変化を示す正弦波"></canvas>
                <label class="playbackSetting">滑らかさ
                    <input id="shapeVariation" type="range" min="0" max="100" value="0" step="1">
                    <output id="shapeOutput">ランダム</output>
                </label>
                <label class="playbackSetting">周期上限
                    <input id="shapeMaxPeriod" type="range" min="15" max="30" value="30" step="5">
                    <output id="shapeMaxPeriodOutput">30s</output>
                </label>
                <label class="playbackSetting">形状差下限
                    <input id="shapeReachFloor" type="range" min="5" max="50" value="20" step="5">
                    <output id="shapeReachFloorOutput">20%</output>
                </label>
            </section>
        </aside>

        <section class="preview">
            <div class="previewTitle">OUTPUT</div>
            <div class="stage">
                <canvas id="outputCanvas" width="2160" height="3840"></canvas>
            </div>
            <div class="transport">
                <button id="playButton" type="button" disabled>再生</button>
                <button id="recordButton" type="button" disabled>録画</button>
            </div>
        </section>
    </main>

    <script type="module">
        const MODEL_URL = "../modules/faceAPI/models";
        const TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34";
        const WASM_URL = `${TASKS_URL}/wasm`;
        const FACE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
        const MEDIABUNNY_URL = "https://cdn.jsdelivr.net/npm/mediabunny@1.59.0/+esm";
        const SOURCE_FPS = 60;
        const EMOTIONS = ["neutral", "happy", "sad", "angry", "fearful", "disgusted", "surprised"];
        const LABELS = { neutral: "無表情", happy: "喜び", sad: "悲しみ", angry: "怒り", fearful: "恐れ", disgusted: "嫌悪", surprised: "驚き" };
        const FILE_EMOTION_PREFIXES = [["01_happy", "happy"], ["02_sad", "sad"], ["03_angry", "angry"], ["04_fearful", "fearful"], ["05_surprised", "surprised"], ["06_disgusted", "disgusted"]];
        const EXPRESSION_INDICES = [33, 46, 52, 53, 55, 61, 63, 65, 66, 70, 78, 80, 81, 82, 84, 87, 88, 91, 95, 101, 105, 107, 133, 144, 146, 153, 158, 160, 178, 181, 191, 205, 263, 276, 282, 283, 285, 291, 293, 295, 296, 300, 308, 310, 311, 312, 314, 317, 318, 321, 324, 330, 334, 336, 362, 373, 375, 380, 385, 387, 402, 405, 415, 425];
        const COLORS = { neutral: "#7f8993", emotion: "#ff6948", mesh: "#4877ff", mix: "#151515", onset: "#53a86d", peak: "#8a62d1", settle: "#8a62d1" };
        const $ = (id) => document.getElementById(id);
        const ids = ["sourceVideo", "captureVideo", "rawCanvas", "rawTimeOutput", "outputCanvas", "outputResolution", "resolutionOutput", "shapeVariation", "shapeOutput", "shapeMaxPeriod", "shapeMaxPeriodOutput", "shapeReachFloor", "shapeReachFloorOutput", "shapePeriodOutput", "shapeReachOutput", "shapeWave", "movieMeta", "playButton", "recordButton", "fileInput", "clipList", "clipEditor", "sourceBadge", "analysisBadge", "emotionSelect", "analyzeButton", "analyzeAllButton", "progress", "analysisChart", "onsetInput", "peakInput", "settleInput", "rangeStart", "rangeEnd", "startInput", "endInput", "alignX", "alignXOutput", "alignY", "alignYOutput", "alignScale", "alignScaleOutput", "alignApplyButton", "flickerFps", "fpsOutput", "prepareButton", "status"];
        const el = Object.fromEntries(ids.map((id) => [id, $(id)]));
        const ctx = el.outputCanvas.getContext("2d", { alpha: false });
        const rawContext = el.rawCanvas.getContext("2d", { alpha: false });
        const analysisCanvas = document.createElement("canvas");
        const analysisContext = analysisCanvas.getContext("2d", { alpha: false });
        const captureCanvas = document.createElement("canvas");
        const compositionCanvas = document.createElement("canvas");
        const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
        const num = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const formatTime = (value) => `${Math.max(0, num(value)).toFixed(2)}s`;
        const outputFrameRate = (speed = num(el.flickerFps.value, 20)) => speed <= 30 ? 30 : 60;
        const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: .35 });

        let clips = [];
        let selectedId = null;
        let nextId = 1;
        let modelsReady = false;
        let busy = false;
        let samples = [];
        let analysisSeries = [];
        let boundaries = null;
        let flickerFrames = [];
        const frameShapes = new WeakMap();
        const frameMetadata = new WeakMap();
        let frameHistory = [];
        let shapeCycleStartedAt = performance.now();
        let frameBuildId = 0;
        let animationId = 0;
        let nextCutAt = 0;
        let currentFrame = -1;
        let flickerPlaying = false;
        let recordingPlan = null;
        let rawPreviewRequest = 0;
        let rawPreviewTimer = 0;
        const alignment = { x: num(el.alignX.value), y: num(el.alignY.value), scale: num(el.alignScale.value, 100) };

        const mediabunny = import(MEDIABUNNY_URL);
        const models = Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
            import(TASKS_URL).then(async ({ FaceLandmarker, FilesetResolver }) => {
                const vision = await FilesetResolver.forVisionTasks(WASM_URL);
                return FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: FACE_MODEL_URL }, runningMode: "IMAGE", numFaces: 1,
                    minFaceDetectionConfidence: .35, minFacePresenceConfidence: .35
                });
            }),
            mediabunny
        ]);

        const selectedClip = () => clips.find((clip) => clip.id === selectedId) || null;

        function emotionFromFileName(fileName) {
            const normalized = fileName.trim().toLowerCase();
            return FILE_EMOTION_PREFIXES.find(([prefix]) => normalized.startsWith(prefix))?.[1] || "happy";
        }

        function escapeHtml(value) {
            const node = document.createElement("span");
            node.textContent = value;
            return node.innerHTML;
        }

        function refreshFrames() {
            flickerFrames = clips.flatMap((clip) => clip.frames);
            currentFrame = -1;
            frameHistory = [];
            shapeCycleStartedAt = performance.now();
            nextCutAt = 0;
        }

        function renderClipList() {
            el.sourceBadge.textContent = `${clips.length} clip${clips.length === 1 ? "" : "s"}`;
            const cards = clips.map((clip) => {
                const card = document.createElement("article");
                card.className = `clipCard${clip.id === selectedId ? " selected" : ""}`;
                card.dataset.id = clip.id;
                card.innerHTML = `<div class="clipTop">
                    <div><div class="clipName">${escapeHtml(clip.name)}</div><div class="clipMeta">${LABELS[clip.emotion]} · ${clip.width}×${clip.height} · ${formatTime(clip.duration)} · ${clip.frames.length} frames</div></div>
                    <button class="removeButton" data-action="remove" type="button" aria-label="削除"><img src="icon-clause.png" alt=""></button>
                </div>`;
                return card;
            });
            const add = document.createElement("label");
            add.className = "clipEmpty";
            add.htmlFor = "fileInput";
            add.setAttribute("aria-label", "動画を追加");
            add.innerHTML = '<img src="icon-plus.png" alt="">';
            el.clipList.replaceChildren(...cards, add);
            const selectedCard = cards.find((card) => Number(card.dataset.id) === selectedId);
            el.clipEditor.hidden = !selectedCard;
            if (selectedCard) selectedCard.append(el.clipEditor);
        }

        function setStatus(text, error = false) {
            el.status.textContent = text;
            el.status.classList.toggle("error", error);
        }

        function setBusy(value) {
            busy = value;
            updateControls();
        }

        function updateControls() {
            const loaded = !!selectedClip();
            const sourceLocked = busy || !!recordingPlan;
            el.fileInput.disabled = sourceLocked;
            el.outputResolution.disabled = sourceLocked;
            [el.flickerFps, el.shapeVariation, el.shapeMaxPeriod, el.shapeReachFloor].forEach((input) => input.disabled = busy);
            el.analyzeButton.disabled = sourceLocked || !loaded || !modelsReady;
            el.analyzeAllButton.disabled = sourceLocked || !clips.length || !modelsReady;
            [el.onsetInput, el.peakInput, el.settleInput].forEach((input) => input.disabled = sourceLocked || !loaded);
            [el.rangeStart, el.rangeEnd, el.startInput, el.endInput].forEach((input) => input.disabled = sourceLocked || !loaded);
            [el.alignX, el.alignY, el.alignScale].forEach((input) => input.disabled = sourceLocked);
            el.alignApplyButton.disabled = sourceLocked || !clips.some((clip) => clip.frames.length);
            el.prepareButton.disabled = sourceLocked || !loaded;
            el.playButton.disabled = busy || !flickerFrames.length;
            el.recordButton.disabled = recordingPlan ? false : busy || !flickerFrames.length;
        }

        function waitFor(video, event) {
            return new Promise((resolve, reject) => {
                const done = () => { cleanup(); resolve(); };
                const fail = () => { cleanup(); reject(new Error(video.error?.message || "動画を読み込めませんでした")); };
                const cleanup = () => { video.removeEventListener(event, done); video.removeEventListener("error", fail); };
                video.addEventListener(event, done, { once: true });
                video.addEventListener("error", fail, { once: true });
            });
        }

        async function seek(video, time) {
            if (Math.abs(video.currentTime - time) < .002) return;
            const ready = waitFor(video, "seeked");
            video.currentTime = time;
            await ready;
        }

        async function readMetadata(clip) {
            const video = document.createElement("video");
            video.preload = "metadata";
            const loaded = waitFor(video, "loadedmetadata");
            video.src = clip.url;
            await loaded;
            clip.duration = video.duration;
            clip.width = video.videoWidth;
            clip.height = video.videoHeight;
            clip.rangeStart = video.duration * .25;
            clip.rangeEnd = video.duration * .75;
        }

        function updateResolutionLimit(useSourceResolution = false) {
            const sourceLimit = clips.length
                ? Math.min(...clips.map((clip) => Math.min(clip.width, clip.height * 9 / 16)))
                : 2160;
            const rounded = Math.floor(sourceLimit / 360) * 360 || Math.floor(sourceLimit / 90) * 90;
            const max = clamp(rounded, 90, 2160);
            el.outputResolution.min = Math.min(360, max);
            el.outputResolution.max = max;
            if (useSourceResolution || num(el.outputResolution.value) > max) el.outputResolution.value = max;
            const width = num(el.outputResolution.value, max);
            el.resolutionOutput.textContent = `${width} × ${width * 16 / 9}`;
        }

        async function addFiles(fileList) {
            const files = [...fileList].filter((file) => file.type.startsWith("video/"));
            if (!files.length || busy) return;
            const firstImport = !clips.length;
            const additions = files.map((file) => ({
                id: nextId++, name: file.name, file, url: URL.createObjectURL(file), duration: 0, width: 0, height: 0,
                emotion: emotionFromFileName(file.name), samples: [], analysisSeries: [], boundaries: null, frames: [], rangeStart: 0, rangeEnd: 0
            }));
            setBusy(true);
            try {
                for (const clip of additions) await readMetadata(clip);
                clips.push(...additions);
                updateResolutionLimit(firstImport);
                renderClipList();
            } catch (error) {
                additions.forEach((clip) => URL.revokeObjectURL(clip.url));
                setStatus(error.message, true);
                return;
            } finally {
                setBusy(false);
            }
            await selectClip(additions[0].id);
            setStatus(`${additions.length}本を追加しました。個別または一括で解析できます`);
        }

        async function selectClip(id) {
            const clip = clips.find((item) => item.id === id);
            if (!clip || busy) return;
            clearTimeout(rawPreviewTimer);
            rawPreviewRequest += 1;
            selectedId = id;
            samples = clip.samples;
            analysisSeries = clip.analysisSeries;
            boundaries = clip.boundaries;
            refreshFrames();
            renderClipList();
            el.emotionSelect.value = clip.emotion;
            el.analysisBadge.textContent = clip.samples.length ? (clip.boundaries ? "解析済み" : "境界未検出") : (modelsReady ? "未解析" : "モデル読込中");
            el.analysisBadge.classList.toggle("ready", !!clip.boundaries);
            setBusy(true);
            try {
                const loaded = [waitFor(el.sourceVideo, "loadedmetadata"), waitFor(el.captureVideo, "loadedmetadata")];
                el.sourceVideo.src = clip.url;
                el.captureVideo.src = clip.url;
                await Promise.all(loaded);
                const duration = clip.duration;
                [el.rangeStart, el.rangeEnd].forEach((input) => input.max = duration);
                [el.onsetInput, el.peakInput, el.settleInput, el.startInput, el.endInput].forEach((input) => input.max = duration);
                setRange(clip.rangeStart, clip.rangeEnd, false);
                if (boundaries) renderBoundaries();
                else {
                    el.onsetInput.value = clip.rangeStart.toFixed(2);
                    el.peakInput.value = ((clip.rangeStart + clip.rangeEnd) / 2).toFixed(2);
                    el.settleInput.value = clip.rangeEnd.toFixed(2);
                }
                el.movieMeta.textContent = `${clip.name} · ${clip.width}×${clip.height} · ${formatTime(duration)}`;
                await previewRawAt(clip.rangeStart);
                drawChart();
                setStatus("コマ抽出範囲を設定するか、表情を解析してください");
            } catch (error) {
                setStatus(error.message, true);
            } finally {
                setBusy(false);
                updateTransport();
            }
        }

        function averagePoint(points, indices) {
            const valid = indices.map((index) => points[index]).filter(Boolean);
            if (!valid.length) return null;
            return valid.reduce((sum, point) => ({ x: sum.x + point.x / valid.length, y: sum.y + point.y / valid.length, z: sum.z + (point.z || 0) / valid.length }), { x: 0, y: 0, z: 0 });
        }

        function normalizeLandmarks(points) {
            if (!points || points.length < 426) return null;
            const left = averagePoint(points, [33, 133]);
            const right = averagePoint(points, [362, 263]);
            if (!left || !right) return null;
            const center = { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2, z: (left.z + right.z) / 2 };
            const dx = right.x - left.x;
            const dy = right.y - left.y;
            const scale = Math.hypot(dx, dy);
            if (scale < 1e-5) return null;
            const cos = dx / scale;
            const sin = dy / scale;
            return EXPRESSION_INDICES.flatMap((index) => {
                const point = points[index];
                const x = point.x - center.x;
                const y = point.y - center.y;
                return [(x * cos + y * sin) / scale, (-x * sin + y * cos) / scale, (((point.z || 0) - center.z) / scale) * .5];
            });
        }

        function eyePose(points) {
            if (!points || points.length < 363) return null;
            const left = averagePoint(points, [33, 133]);
            const right = averagePoint(points, [362, 263]);
            return left && right ? { left, right } : null;
        }

        function eyePoseFrom(sampleList, time) {
            if (!sampleList.length) return null;
            let nearest = 0;
            sampleList.forEach((sample, index) => {
                if (Math.abs(sample.time - time) < Math.abs(sampleList[nearest].time - time)) nearest = index;
            });
            const poses = sampleList.slice(Math.max(0, nearest - 2), nearest + 3).map((sample) => sample.eyePose).filter(Boolean);
            if (!poses.length) return null;
            const averageSide = (side) => poses.reduce((sum, pose) => ({ x: sum.x + pose[side].x / poses.length, y: sum.y + pose[side].y / poses.length }), { x: 0, y: 0 });
            return { left: averageSide("left"), right: averageSide("right") };
        }

        function landmarkShapeFrom(sampleList, time) {
            let nearest = null;
            sampleList.forEach((sample) => {
                if (sample.landmarks && (!nearest || Math.abs(sample.time - time) < Math.abs(nearest.time - time))) nearest = sample;
            });
            return nearest?.landmarks || null;
        }

        const averageVector = (vectors) => vectors.length ? vectors[0].map((_, i) => vectors.reduce((sum, vector) => sum + vector[i], 0) / vectors.length) : null;
        const vectorDistance = (a, b) => !a || !b || a.length !== b.length ? null : Math.sqrt(a.reduce((sum, value, i) => sum + (value - b[i]) ** 2, 0) / a.length);
        const equalBlend = (a, b) => a === null ? b ?? 0 : b === null ? a : (a + b) / 2;

        function prepareLandmarkDistances() {
            const shapes = samples.filter((sample) => sample.landmarks).map((sample) => sample.landmarks);
            if (shapes.length < 3) return samples.forEach((sample) => sample.landmarkDistance = null);
            const baseline = averageVector(shapes.slice(0, Math.max(3, Math.min(shapes.length, Math.round(shapes.length * .15)))));
            samples.forEach((sample, index) => {
                const nearby = samples.slice(Math.max(0, index - 2), index + 3).map((item) => item.landmarks).filter(Boolean);
                sample.landmarkDistance = vectorDistance(averageVector(nearby), baseline);
            });
        }

        function smoothedSamples() {
            return samples.map((sample, index) => {
                const window = samples.slice(Math.max(0, index - 2), index + 3);
                const expressions = window.filter((item) => item.detected);
                const landmarks = window.filter((item) => Number.isFinite(item.landmarkDistance));
                const smooth = expressions.length ? Object.fromEntries(EMOTIONS.map((emotion) => [emotion, expressions.reduce((sum, item) => sum + item.expressions[emotion], 0) / expressions.length])) : null;
                const landmarkMotion = landmarks.length ? landmarks.reduce((sum, item) => sum + item.landmarkDistance, 0) / landmarks.length : null;
                return { ...sample, smooth, landmarkMotion };
            });
        }

        function profile(values, minimumAmplitude) {
            const valid = values.filter(Number.isFinite);
            if (valid.length < 3) return { baseline: 0, amplitude: 0, usable: false };
            const count = Math.max(1, Math.min(valid.length, Math.round(valid.length * .15)));
            const baseline = valid.slice(0, count).reduce((sum, value) => sum + value, 0) / count;
            const amplitude = Math.max(...valid) - baseline;
            return { baseline, amplitude, usable: amplitude >= minimumAmplitude };
        }

        function crossing(items, level, direction, start, end) {
            for (let i = Math.max(1, start); i <= end; i += 1) {
                const a = items[i - 1], b = items[i];
                const hit = direction === "up" ? a.value <= level && b.value >= level : a.value >= level && b.value <= level;
                if (!hit) continue;
                const ratio = Math.abs(b.value - a.value) < 1e-6 ? 0 : clamp((level - a.value) / (b.value - a.value), 0, 1);
                return a.time + (b.time - a.time) * ratio;
            }
            return null;
        }

        function detectBoundaries() {
            prepareLandmarkDistances();
            const emotion = el.emotionSelect.value;
            const data = smoothedSamples().filter((sample) => sample.smooth || Number.isFinite(sample.landmarkMotion)).map((sample) => ({
                time: sample.time,
                emotionValue: sample.smooth ? sample.smooth[emotion] / Math.max(.0001, sample.smooth.neutral + sample.smooth[emotion]) : null,
                landmarkValue: sample.landmarkMotion
            }));
            if (data.length < 3) return null;
            const emotionProfile = profile(data.map((item) => item.emotionValue), .03);
            const landmarkProfile = profile(data.map((item) => item.landmarkValue), .003);
            if (!emotionProfile.usable && !landmarkProfile.usable) return null;
            data.forEach((item) => {
                const ep = emotionProfile.usable && Number.isFinite(item.emotionValue) ? clamp((item.emotionValue - emotionProfile.baseline) / emotionProfile.amplitude, 0, 1) : null;
                const lp = landmarkProfile.usable && Number.isFinite(item.landmarkValue) ? clamp((item.landmarkValue - landmarkProfile.baseline) / landmarkProfile.amplitude, 0, 1) : null;
                item.emotionProgress = ep;
                item.landmarkProgress = lp;
                item.value = equalBlend(lp, ep);
            });
            analysisSeries = data.map((item) => ({ time: item.time, landmark: item.landmarkProgress, progression: item.value }));
            let peakIndex = 0;
            data.forEach((item, index) => { if (item.value > data[peakIndex].value) peakIndex = index; });
            const duration = el.sourceVideo.duration;
            const onset = crossing(data, .08, "up", 1, peakIndex) ?? data[Math.max(0, peakIndex - 1)].time;
            const peak = crossing(data, .92, "up", 1, peakIndex) ?? data[peakIndex].time;
            const settle = crossing(data, .2, "down", peakIndex + 1, data.length - 1) ?? duration;
            return { onset: clamp(onset, 0, duration), peak: clamp(Math.max(onset + .01, peak), 0, duration), settle: clamp(Math.max(peak, settle), 0, duration) };
        }

        async function analyze() {
            const clip = selectedClip();
            if (busy || !clip || !modelsReady) return;
            el.sourceVideo.pause();
            setBusy(true);
            samples = [];
            analysisSeries = [];
            boundaries = null;
            clip.samples = samples;
            clip.analysisSeries = analysisSeries;
            clip.boundaries = null;
            el.progress.hidden = false;
            try {
                const [, , faceLandmarker, { Input, ALL_FORMATS, BlobSource, CanvasSink }] = await models;
                const input = new Input({ formats: ALL_FORMATS, source: new BlobSource(clip.file) });
                const track = await input.getPrimaryVideoTrack();
                if (!track || !(await track.canDecode())) throw new Error("この動画をデコードできません");
                const firstTimestamp = await track.getFirstTimestamp();
                const duration = await track.computeDuration();
                const sink = new CanvasSink(track, { width: 320, alpha: false, poolSize: 2 });
                for await (const wrapped of sink.canvases()) {
                    const time = wrapped.timestamp - firstTimestamp;
                    el.progress.value = clamp(time / Math.max(duration, .001), 0, 1);
                    setStatus(`${clip.name} の全フレームを解析中（${samples.length + 1}フレーム）`);
                    if (analysisCanvas.width !== wrapped.canvas.width || analysisCanvas.height !== wrapped.canvas.height) {
                        analysisCanvas.width = wrapped.canvas.width;
                        analysisCanvas.height = wrapped.canvas.height;
                    }
                    analysisContext.drawImage(wrapped.canvas, 0, 0);
                    const faceDetection = faceapi.detectSingleFace(analysisCanvas, detectorOptions).withFaceExpressions();
                    const mesh = faceLandmarker.detect(analysisCanvas).faceLandmarks?.[0];
                    const detection = await faceDetection;
                    samples.push({
                        time,
                        detected: Boolean(detection),
                        landmarks: normalizeLandmarks(mesh),
                        eyePose: eyePose(mesh),
                        expressions: Object.fromEntries(EMOTIONS.map((emotion) => [emotion, detection?.expressions[emotion] || 0]))
                    });
                    if (samples.length % 8 === 0) await new Promise(requestAnimationFrame);
                }
                if (!samples.length) throw new Error("映像フレームがありません");
                el.progress.value = 1;
                boundaries = detectBoundaries();
                clip.analysisSeries = analysisSeries;
                clip.boundaries = boundaries;
                if (!boundaries) throw new Error("十分な表情変化を検出できませんでした。対象表情を調整してください");
                renderBoundaries();
                setRange(boundaries.onset, boundaries.settle, false);
                el.analysisBadge.textContent = `${samples.length}f · 検出 ${Math.round(samples.filter((sample) => sample.landmarks).length / samples.length * 100)}%`;
                el.analysisBadge.classList.add("ready");
                setStatus(`発生 ${formatTime(boundaries.onset)} / ピーク ${formatTime(boundaries.peak)} / 収束 ${formatTime(boundaries.settle)}`);
                await prepareFrames();
            } catch (error) {
                el.analysisBadge.textContent = "解析失敗";
                el.analysisBadge.classList.remove("ready");
                setStatus(error.message, true);
            } finally {
                el.progress.hidden = true;
                setBusy(false);
                await previewRawAt(clip.rangeStart).catch(() => { });
                drawChart();
                renderClipList();
            }
        }

        async function analyzeAll() {
            if (busy || !clips.length || !modelsReady) return;
            const targets = [...clips];
            for (const clip of targets) {
                await selectClip(clip.id);
                await analyze();
            }
            const completed = targets.filter((clip) => clip.boundaries).length;
            setStatus(`${completed}/${targets.length}本をファイル名に合わせて解析しました`, completed !== targets.length);
        }

        function renderBoundaries() {
            if (!boundaries) return;
            const clip = selectedClip();
            if (clip) clip.boundaries = boundaries;
            el.onsetInput.value = boundaries.onset.toFixed(2);
            el.peakInput.value = boundaries.peak.toFixed(2);
            el.settleInput.value = boundaries.settle.toFixed(2);
            drawChart();
            updateControls();
        }

        function updateBoundaries() {
            if (!selectedClip()) return;
            const duration = el.sourceVideo.duration;
            const onset = clamp(num(el.onsetInput.value), 0, duration);
            const peak = clamp(num(el.peakInput.value, onset), onset, duration);
            const settle = clamp(num(el.settleInput.value, peak), peak, duration);
            boundaries = { onset, peak, settle };
            selectedClip().boundaries = boundaries;
            renderBoundaries();
        }

        function currentRange() {
            return { start: num(el.rangeStart.value), end: num(el.rangeEnd.value) };
        }

        function setRange(start, end, invalidate = true) {
            if (!selectedClip()) return;
            const duration = el.sourceVideo.duration;
            start = clamp(num(start), 0, Math.max(0, duration - .02));
            end = clamp(num(end, duration), start + .02, duration);
            el.rangeStart.value = start;
            el.rangeEnd.value = end;
            el.startInput.value = start.toFixed(2);
            el.endInput.value = end.toFixed(2);
            const clip = selectedClip();
            if (clip) {
                clip.rangeStart = start;
                clip.rangeEnd = end;
            }
            if (invalidate) setStatus("範囲が変わりました。「画像を切り出す」を押してください");
            drawChart();
        }

        async function prepareFrames() {
            const clip = selectedClip();
            if (!clip) return;
            if (busy && !samples.length) return;
            const ownsBusyState = !busy;
            if (ownsBusyState) setBusy(true);
            const buildId = ++frameBuildId;
            const { start, end } = currentRange();
            const width = Math.min(360, num(el.outputResolution.value, 720));
            const height = width * 16 / 9;
            const requestedCount = Math.max(8, Math.ceil((end - start) * Math.max(12, num(el.flickerFps.value, 18))));
            const count = Math.min(72, requestedCount);
            captureCanvas.width = width;
            captureCanvas.height = height;
            const captureCtx = captureCanvas.getContext("2d", { alpha: false });
            const fullWidth = num(el.outputResolution.max, 2160);
            const fullHeight = fullWidth * 16 / 9;
            const resizesFrame = width !== fullWidth;
            const renderCanvas = resizesFrame ? compositionCanvas : captureCanvas;
            renderCanvas.width = fullWidth;
            renderCanvas.height = fullHeight;
            const renderCtx = renderCanvas.getContext("2d", { alpha: false });
            const frames = [];
            const alignsFace = samples.some((sample) => sample.eyePose);
            el.progress.hidden = false;
            try {
                for (let i = 0; i < count; i += 1) {
                    if (buildId !== frameBuildId) return frames.forEach((frame) => frame.close?.());
                    const time = count === 1 ? start : start + (end - start) * i / (count - 1);
                    setStatus(`${clip.name} · ${alignsFace ? "顔位置を合わせながら" : ""}コマを準備中 ${i + 1} / ${count}`);
                    el.progress.value = (i + 1) / count;
                    await seek(el.captureVideo, Math.min(time, el.captureVideo.duration - .01));
                    drawAlignedFrame(renderCtx, el.captureVideo, eyePoseFrom(samples, time));
                    if (resizesFrame) {
                        captureCtx.imageSmoothingEnabled = true;
                        captureCtx.imageSmoothingQuality = "high";
                        captureCtx.drawImage(renderCanvas, 0, 0, width, height);
                    }
                    const frame = await createImageBitmap(captureCanvas);
                    frameShapes.set(frame, landmarkShapeFrom(samples, time));
                    frameMetadata.set(frame, { clipId: clip.id, time });
                    frames.push(frame);
                }
                if (buildId !== frameBuildId) return frames.forEach((frame) => frame.close?.());
                const oldFrames = clip.frames;
                clip.frames = frames;
                refreshFrames();
                oldFrames.forEach((frame) => frame.close?.());
                renderClipList();
                if (!flickerPlaying) drawFlicker(performance.now());
                setStatus(`プレビュー準備完了 ${width}×${height}${alignsFace ? "（顔位置調整済み）" : ""}`);
            } catch (error) {
                frames.forEach((frame) => frame.close?.());
                setStatus(`コマの準備に失敗しました: ${error.message}`, true);
            } finally {
                el.progress.hidden = true;
                if (ownsBusyState) setBusy(false);
            }
        }

        function drawCoverOn(context, canvas, source, width, height) {
            const scale = Math.max(canvas.width / width, canvas.height / height);
            const cropWidth = canvas.width / scale;
            const cropHeight = canvas.height / scale;
            context.drawImage(source, (width - cropWidth) / 2, (height - cropHeight) / 2, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
        }

        function clearCanvas(context) {
            context.fillStyle = "#090909";
            context.fillRect(0, 0, context.canvas.width, context.canvas.height);
        }

        function faceTarget(canvas) {
            return {
                x: canvas.width * (.5 + alignment.x / 100),
                y: canvas.height * (.36 + alignment.y / 100),
                eyeDistance: canvas.width * .34 * alignment.scale / 100
            };
        }

        function drawFaceGuide(context) {
            const { x, y, eyeDistance: size } = faceTarget(context.canvas);
            context.save();
            context.strokeStyle = "rgba(255,255,255,.62)";
            context.lineWidth = Math.max(1, context.canvas.width * .0015);
            context.setLineDash([context.lineWidth * 4, context.lineWidth * 3]);
            context.beginPath();
            context.ellipse(x, y + size * .72, size * 1.08, size * 1.42, 0, 0, Math.PI * 2);
            context.moveTo(x - size * .32, y);
            context.ellipse(x - size * .5, y, size * .18, size * .09, 0, 0, Math.PI * 2);
            context.moveTo(x + size * .68, y);
            context.ellipse(x + size * .5, y, size * .18, size * .09, 0, 0, Math.PI * 2);
            context.stroke();
            context.restore();
        }

        function drawAlignedFrame(context, video, pose) {
            const canvas = context.canvas;
            clearCanvas(context);
            if (!pose) return drawCoverOn(context, canvas, video, video.videoWidth, video.videoHeight);
            const left = { x: pose.left.x * video.videoWidth, y: pose.left.y * video.videoHeight };
            const right = { x: pose.right.x * video.videoWidth, y: pose.right.y * video.videoHeight };
            const dx = right.x - left.x;
            const dy = right.y - left.y;
            const eyeDistance = Math.hypot(dx, dy);
            if (eyeDistance < 1) return drawCoverOn(context, canvas, video, video.videoWidth, video.videoHeight);
            const target = faceTarget(canvas);
            const scale = clamp(target.eyeDistance / eyeDistance, .25, 4);
            context.save();
            context.translate(target.x, target.y);
            context.rotate(-Math.atan2(dy, dx));
            context.scale(scale, scale);
            context.drawImage(video, -(left.x + right.x) / 2, -(left.y + right.y) / 2);
            context.restore();
        }

        function drawCurrentFrame() {
            clearCanvas(ctx);
            const frame = flickerFrames[currentFrame];
            if (frame) {
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage(frame, 0, 0, el.outputCanvas.width, el.outputCanvas.height);
            }
            drawFaceGuide(ctx);
        }

        async function prepareAllFrames() {
            const width = Math.min(360, num(el.outputResolution.value, 720));
            if (busy || !clips.length) return;
            const originalId = selectedId;
            let completed = 0;
            for (const clip of [...clips]) {
                await selectClip(clip.id);
                await prepareFrames();
                if (clip.frames[0]?.width === width) completed += 1;
            }
            if (originalId !== selectedId) await selectClip(originalId);
            setStatus(`${completed}/${clips.length}本のプレビューを準備しました`, completed !== clips.length);
        }

        async function updateOutputResolution() {
            const width = num(el.outputResolution.value, 720);
            const height = width * 16 / 9;
            el.resolutionOutput.textContent = `${width} × ${height}`;
            if (clips.length) await prepareAllFrames();
            else setStatus(`切り出すコマの解像度を ${width}×${height} に設定しました`);
        }

        function drawRawSource() {
            if (!selectedClip() || el.sourceVideo.readyState < 2) return;
            rawContext.fillStyle = "#090909";
            rawContext.fillRect(0, 0, el.rawCanvas.width, el.rawCanvas.height);
            drawCoverOn(rawContext, el.rawCanvas, el.sourceVideo, el.sourceVideo.videoWidth, el.sourceVideo.videoHeight);
            el.rawTimeOutput.textContent = formatTime(el.sourceVideo.currentTime);
        }

        async function previewRawAt(time) {
            if (!selectedClip()) return;
            const request = ++rawPreviewRequest;
            await seek(el.sourceVideo, clamp(num(time), 0, Math.max(0, el.sourceVideo.duration - .01)));
            if (request === rawPreviewRequest) drawRawSource();
        }

        function scheduleRawPreview(time) {
            clearTimeout(rawPreviewTimer);
            rawPreviewTimer = setTimeout(() => previewRawAt(time).catch(() => { }), 35);
        }

        const randomFrom = (items) => items[Math.floor(Math.random() * items.length)];
        const allowedCandidateCount = (total, allowance) => Math.min(total, Math.max(2, Math.ceil(total * allowance)));
        const shapeSettings = (value = num(el.shapeVariation.value), maxPeriod = num(el.shapeMaxPeriod.value, 30), reachFloor = num(el.shapeReachFloor.value, 20)) => {
            const smoothness = clamp(value / 100, 0, 1);
            return { smoothness, period: smoothness * clamp(maxPeriod, 15, 30), reach: 1 - smoothness * (1 - clamp(reachFloor, 5, 50) / 100) };
        };
        const shapeAllowanceForSeconds = (seconds, settings = shapeSettings()) => {
            if (!settings.smoothness) return 1;
            const phase = (seconds % settings.period) / settings.period;
            return (1 - Math.cos(phase * Math.PI * 2)) / 2 * settings.reach;
        };
        console.assert(allowedCandidateCount(20, .25) === 5, "形状差の候補数が不正です");
        console.assert(shapeSettings(0).period === 0 && shapeSettings(0).reach === 1, "ランダム設定が不正です");
        console.assert(shapeSettings(100, 30, 10).period === 30 && Math.abs(shapeSettings(100, 30, 10).reach - .1) < 1e-9, "最大滑らかさ設定が不正です");
        console.assert(Math.abs(shapeSettings(50, 30, 30).reach - .65) < 1e-9, "形状差下限の計算が不正です");

        function chooseFrame(candidates, current, history, shapeAt, seconds) {
            const alternatives = candidates.map((_, index) => index).filter((index) => index !== current);
            if (!alternatives.length) return current < 0 ? 0 : current;
            const settings = shapeSettings();
            if (!settings.smoothness || current < 0) return randomFrom(alternatives);
            let available = alternatives;
            for (let depth = Math.min(8, history.length); depth > 0; depth -= 1) {
                const recent = new Set(history.slice(-depth));
                const filtered = alternatives.filter((index) => !recent.has(index));
                if (filtered.length) { available = filtered; break; }
            }
            const currentShape = shapeAt(current);
            if (!currentShape) return randomFrom(available);
            const ranked = available.map((index) => ({ index, distance: vectorDistance(currentShape, shapeAt(index)) }))
                .filter((candidate) => Number.isFinite(candidate.distance))
                .sort((a, b) => a.distance - b.distance);
            if (!ranked.length) return randomFrom(available);
            return randomFrom(ranked.slice(0, allowedCandidateCount(ranked.length, shapeAllowanceForSeconds(seconds, settings)))).index;
        }

        function rememberFrame(history, index) {
            history.push(index);
            if (history.length > 9) history.shift();
        }

        function proxyFrameFor(candidate) {
            let nearest = null;
            flickerFrames.forEach((frame, index) => {
                const metadata = frameMetadata.get(frame);
                if (metadata?.clipId !== candidate.clip.id) return;
                const distance = Math.abs(metadata.time - candidate.time);
                if (!nearest || distance < nearest.distance) nearest = { index, distance };
            });
            return nearest?.index ?? (currentFrame >= 0 ? currentFrame : 0);
        }

        function drawFlicker(now) {
            if (!flickerFrames.length) return;
            if (currentFrame >= 0 && now < nextCutAt) return;
            if (recordingPlan) {
                const seconds = Math.max(0, (now - recordingPlan.startedAt) / 1000);
                recordingPlan.frameRate = Math.max(recordingPlan.frameRate, outputFrameRate());
                recordingPlan.current = chooseFrame(
                    recordingPlan.candidates,
                    recordingPlan.current,
                    recordingPlan.history,
                    (index) => recordingPlan.candidates[index].shape,
                    seconds
                );
                rememberFrame(recordingPlan.history, recordingPlan.current);
                const candidate = recordingPlan.candidates[recordingPlan.current];
                recordingPlan.cuts.push({ time: recordingPlan.cuts.length ? seconds : 0, candidate });
                currentFrame = proxyFrameFor(candidate);
            } else {
                currentFrame = chooseFrame(
                    flickerFrames,
                    currentFrame,
                    frameHistory,
                    (index) => frameShapes.get(flickerFrames[index]),
                    (now - shapeCycleStartedAt) / 1000
                );
                rememberFrame(frameHistory, currentFrame);
            }
            nextCutAt = now + 1000 / num(el.flickerFps.value, 18);
            drawCurrentFrame();
        }

        function tick(now) {
            drawFlicker(now);
            drawShapeWave(now);
            if (flickerPlaying) animationId = requestAnimationFrame(tick);
        }

        function stopFlicker() {
            flickerPlaying = false;
            cancelAnimationFrame(animationId);
            updateTransport();
        }

        function togglePlay() {
            if (!flickerFrames.length) return;
            if (flickerPlaying) return stopFlicker();
            if (busy) return;
            flickerPlaying = true;
            shapeCycleStartedAt = performance.now();
            nextCutAt = 0;
            updateTransport();
            animationId = requestAnimationFrame(tick);
        }

        function updateTransport() {
            el.playButton.textContent = flickerPlaying ? "停止" : "再生";
            const recording = !!recordingPlan;
            el.recordButton.textContent = recording ? "録画停止" : "録画";
            el.recordButton.classList.toggle("recording", recording);
        }

        function downloadBlob(blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `flash-cut-${new Date().toISOString().replace(/[:.]/g, "-")}.mp4`;
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function sourceFrameCandidates() {
            return clips.flatMap((clip) => {
                const first = Math.ceil(clip.rangeStart * SOURCE_FPS);
                const last = Math.floor(Math.min(clip.rangeEnd, clip.duration - .001) * SOURCE_FPS);
                const frames = [];
                for (let index = first; index <= last; index += 1) {
                    const time = index / SOURCE_FPS;
                    frames.push({ clip, time, shape: landmarkShapeFrom(clip.samples, time) });
                }
                if (!frames.length) {
                    const time = (clip.rangeStart + clip.rangeEnd) / 2;
                    frames.push({ clip, time, shape: landmarkShapeFrom(clip.samples, time) });
                }
                return frames;
            });
        }

        async function createExportVideos() {
            const entries = await Promise.all(clips.map(async (clip) => {
                const video = document.createElement("video");
                video.preload = "auto";
                video.muted = true;
                const loaded = waitFor(video, "loadedmetadata");
                video.src = clip.url;
                await loaded;
                return [clip.id, video];
            }));
            return new Map(entries);
        }

        async function exportRecording(duration, plan, fileHandle) {
            const { Output, Mp4OutputFormat, BufferTarget, StreamTarget, CanvasSource, Quality, getFirstEncodableVideoCodec } = await mediabunny;
            const width = num(el.outputResolution.value, 720);
            const height = width * 16 / 9;
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const exportCtx = canvas.getContext("2d", { alpha: false });
            const fullWidth = num(el.outputResolution.max, 2160);
            const fullCanvas = width === fullWidth ? canvas : compositionCanvas;
            fullCanvas.width = fullWidth;
            fullCanvas.height = fullWidth * 16 / 9;
            const fullCtx = fullCanvas.getContext("2d", { alpha: false });
            const frameRate = plan.frameRate;
            const quality = new Quality({ bitrate: Math.max(2_000_000, Math.round(width * height * frameRate * .12)) });
            const codec = await getFirstEncodableVideoCodec(["avc", "vp9"], { width, height, frameRate, quality });
            if (!codec) throw new Error(`${width}×${height} / ${frameRate}fps を書き出せるコーデックがありません`);
            const target = fileHandle ? new StreamTarget(await fileHandle.createWritable()) : new BufferTarget();
            const output = new Output({ format: new Mp4OutputFormat(), target });
            const videoSource = new CanvasSource(canvas, { codec, quality });
            output.addVideoTrack(videoSource, { frameRate });
            await output.start();
            const videos = new Map();
            try {
                if (!plan.cuts.length) throw new Error("書き出せるコマがありません");
                (await createExportVideos()).forEach((video, id) => videos.set(id, video));
                const total = Math.max(1, Math.ceil(duration * frameRate));
                let cutIndex = -1;
                for (let index = 0; index < total; index += 1) {
                    const time = index / frameRate;
                    let changed = false;
                    while (cutIndex + 1 < plan.cuts.length && plan.cuts[cutIndex + 1].time <= time + 1e-9) {
                        cutIndex += 1;
                        changed = true;
                    }
                    if (changed) {
                        const candidate = plan.cuts[cutIndex].candidate;
                        const video = videos.get(candidate.clip.id);
                        await seek(video, Math.min(candidate.time, video.duration - .001));
                        drawAlignedFrame(fullCtx, video, eyePoseFrom(candidate.clip.samples, candidate.time));
                        if (fullCanvas !== canvas) {
                            exportCtx.imageSmoothingEnabled = true;
                            exportCtx.imageSmoothingQuality = "high";
                            exportCtx.drawImage(fullCanvas, 0, 0, width, height);
                        }
                    }
                    await videoSource.add(time, 1 / frameRate, { keyFrame: index % frameRate === 0 });
                    el.progress.value = (index + 1) / total;
                    if (index % 15 === 0 || index === total - 1) setStatus(`高品質書き出し中 ${index + 1} / ${total}`);
                }
                await output.finalize();
                if (!fileHandle) {
                    if (!target.buffer) throw new Error("書き出しデータを作成できませんでした");
                    downloadBlob(new Blob([target.buffer], { type: "video/mp4" }));
                }
            } catch (error) {
                if (output.state === "started") await output.cancel().catch(() => { });
                throw error;
            } finally {
                videos.forEach((video) => { video.removeAttribute("src"); video.load(); });
            }
        }

        async function toggleRecording() {
            if (!recordingPlan) {
                if (busy || !flickerFrames.length) return;
                const candidates = sourceFrameCandidates();
                if (!candidates.length) return setStatus("録画対象のコマがありません", true);
                recordingPlan = { candidates, cuts: [], current: -1, history: [], frameRate: outputFrameRate(), startedAt: performance.now() };
                if (!flickerPlaying) togglePlay();
                setStatus("録画中…停止すると元動画から高品質で書き出します");
                updateTransport();
                updateControls();
                return;
            }
            const plan = recordingPlan;
            const duration = Math.max(.25, (performance.now() - plan.startedAt) / 1000);
            recordingPlan = null;
            stopFlicker();
            setBusy(true);
            el.progress.hidden = false;
            updateTransport();
            try {
                const fileHandle = window.showSaveFilePicker ? await window.showSaveFilePicker({
                    suggestedName: `flash-cut-${new Date().toISOString().replace(/[:.]/g, "-")}.mp4`,
                    types: [{ description: "MP4動画", accept: { "video/mp4": [".mp4"] } }]
                }) : null;
                await exportRecording(duration, plan, fileHandle);
                setStatus(`高品質書き出し完了 ${duration.toFixed(2)}秒 / ${plan.frameRate}fps`);
            } catch (error) {
                if (error.name !== "AbortError") {
                    console.error(error);
                    setStatus(`書き出しに失敗しました: ${error.message}`, true);
                } else setStatus("書き出しをキャンセルしました");
            } finally {
                el.progress.hidden = true;
                setBusy(false);
                updateTransport();
            }
        }

        function drawShapeWave(now = performance.now()) {
            const canvas = el.shapeWave;
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return;
            const dpr = window.devicePixelRatio || 1;
            const style = getComputedStyle(document.documentElement);
            const settings = shapeSettings();
            const maxPeriod = clamp(num(el.shapeMaxPeriod.value, 30), 15, 30);
            const left = 30, right = rect.width - 6, top = 6, bottom = rect.height - 17;
            const elapsed = Math.max(0, (now - shapeCycleStartedAt) / 1000);
            const windowPhase = settings.smoothness ? elapsed % maxPeriod / maxPeriod : 0;
            const wave = (seconds) => shapeAllowanceForSeconds(seconds, settings);
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            const chart = canvas.getContext("2d");
            chart.setTransform(dpr, 0, 0, dpr, 0, 0);
            chart.clearRect(0, 0, rect.width, rect.height);
            chart.strokeStyle = style.getPropertyValue("--line");
            chart.beginPath();
            chart.moveTo(left, bottom);
            chart.lineTo(right, bottom);
            chart.stroke();
            chart.strokeStyle = style.getPropertyValue("--accent");
            chart.lineWidth = 2;
            chart.beginPath();
            for (let x = left; x <= right; x += 2) {
                const progress = (x - left) / (right - left);
                const y = bottom - wave(progress * maxPeriod) * (bottom - top);
                x === left ? chart.moveTo(x, y) : chart.lineTo(x, y);
            }
            chart.stroke();
            const markerX = left + windowPhase * (right - left);
            const markerY = bottom - wave(windowPhase * maxPeriod) * (bottom - top);
            chart.fillStyle = style.getPropertyValue("--accent");
            chart.beginPath();
            chart.arc(markerX, markerY, 4, 0, Math.PI * 2);
            chart.fill();
            chart.fillStyle = style.getPropertyValue("--muted");
            chart.font = "10px system-ui";
            chart.textAlign = "right";
            chart.fillText("100%", left - 4, top + 4);
            chart.fillText("0%", left - 4, bottom + 3);
            chart.fillText(`${maxPeriod}s`, right, bottom + 13);
        }

        function updateShapeControl() {
            const value = num(el.shapeVariation.value);
            const settings = shapeSettings(value);
            el.shapeOutput.textContent = value ? `${value}%` : "ランダム";
            el.shapeMaxPeriodOutput.textContent = `${el.shapeMaxPeriod.value}s`;
            el.shapeReachFloorOutput.textContent = `${el.shapeReachFloor.value}%`;
            el.shapePeriodOutput.textContent = `${settings.period.toFixed(2)}s`;
            el.shapeReachOutput.textContent = `${Math.round(settings.reach * 100)}%`;
            shapeCycleStartedAt = performance.now();
            frameHistory = [];
            nextCutAt = 0;
            drawShapeWave(shapeCycleStartedAt);
        }

        function updateAlignmentOutputs() {
            const signed = (value) => `${num(value) > 0 ? "+" : ""}${value}%`;
            el.alignXOutput.textContent = signed(el.alignX.value);
            el.alignYOutput.textContent = signed(el.alignY.value);
            el.alignScaleOutput.textContent = `${el.alignScale.value}%`;
        }

        function updateAlignment() {
            alignment.x = num(el.alignX.value);
            alignment.y = num(el.alignY.value);
            alignment.scale = num(el.alignScale.value, 100);
            updateAlignmentOutputs();
            if (!flickerPlaying && el.sourceVideo.readyState >= 2 && samples.some((sample) => sample.eyePose)) {
                drawAlignedFrame(ctx, el.sourceVideo, eyePoseFrom(samples, el.sourceVideo.currentTime));
                drawFaceGuide(ctx);
            } else drawCurrentFrame();
            setStatus("共通の顔ガイドを変更しました。「反映」で全クリップに適用します");
        }

        function drawChart() {
            const canvas = el.analysisChart;
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            const chart = canvas.getContext("2d");
            chart.setTransform(dpr, 0, 0, dpr, 0, 0);
            chart.clearRect(0, 0, rect.width, rect.height);
            const duration = num(el.sourceVideo.duration, 1);
            const pad = { x: 7, y: 8, bottom: 15 };
            const x = (time) => pad.x + time / duration * (rect.width - pad.x * 2);
            const y = (value) => pad.y + (1 - clamp(value, 0, 1)) * (rect.height - pad.y - pad.bottom);
            const range = selectedClip() ? currentRange() : { start: 0, end: 0 };
            chart.fillStyle = "rgba(255,105,72,.1)";
            chart.fillRect(x(range.start), pad.y, Math.max(0, x(range.end) - x(range.start)), rect.height - pad.y - pad.bottom);
            chart.strokeStyle = "#ece8df";
            [.25, .5, .75].forEach((value) => { chart.beginPath(); chart.moveTo(pad.x, y(value)); chart.lineTo(rect.width - pad.x, y(value)); chart.stroke(); });
            const data = smoothedSamples();
            [["neutral", COLORS.neutral], [el.emotionSelect.value, COLORS.emotion]].forEach(([emotion, color]) => {
                chart.strokeStyle = color; chart.lineWidth = 2; chart.beginPath(); let started = false;
                data.forEach((sample) => { if (!sample.smooth) return started = false; const px = x(sample.time), py = y(sample.smooth[emotion]); started ? chart.lineTo(px, py) : chart.moveTo(px, py); started = true; });
                chart.stroke();
            });
            [["landmark", COLORS.mesh, 2], ["progression", COLORS.mix, 2.5]].forEach(([key, color, width]) => {
                chart.strokeStyle = color; chart.lineWidth = width; chart.beginPath(); let started = false;
                analysisSeries.forEach((sample) => { if (!Number.isFinite(sample[key])) return started = false; const px = x(sample.time), py = y(sample[key]); started ? chart.lineTo(px, py) : chart.moveTo(px, py); started = true; });
                chart.stroke();
            });
            if (boundaries) [[boundaries.onset, COLORS.onset], [boundaries.peak, COLORS.peak], [boundaries.settle, COLORS.settle]].forEach(([time, color]) => {
                chart.strokeStyle = color; chart.setLineDash([4, 3]); chart.beginPath(); chart.moveTo(x(time), pad.y); chart.lineTo(x(time), rect.height - pad.bottom); chart.stroke(); chart.setLineDash([]);
            });
        }

        function removeClip(id) {
            if (busy || recordingPlan) return;
            const clip = clips.find((item) => item.id === id);
            if (!clip) return;
            clips = clips.filter((item) => item.id !== id);
            updateResolutionLimit();
            refreshFrames();
            clip.frames.forEach((frame) => frame.close?.());
            URL.revokeObjectURL(clip.url);
            if (!flickerFrames.length) stopFlicker();
            if (selectedId !== id) return renderClipList();
            selectedId = null;
            samples = [];
            analysisSeries = [];
            boundaries = null;
            if (clips.length) return void selectClip(clips[0].id);
            stopFlicker();
            el.sourceVideo.removeAttribute("src");
            el.captureVideo.removeAttribute("src");
            el.movieMeta.textContent = "動画未選択";
            el.rawTimeOutput.textContent = "0.00s";
            clearCanvas(rawContext);
            clearCanvas(ctx);
            renderClipList();
            updateControls();
        }

        function bindEvents() {
            el.fileInput.addEventListener("change", () => { addFiles(el.fileInput.files); el.fileInput.value = ""; });
            ["dragenter", "dragover"].forEach((event) => el.clipList.addEventListener(event, (e) => { e.preventDefault(); el.clipList.querySelector(".clipEmpty")?.classList.add("drag"); }));
            ["dragleave", "drop"].forEach((event) => el.clipList.addEventListener(event, (e) => { e.preventDefault(); el.clipList.querySelector(".clipEmpty")?.classList.remove("drag"); }));
            el.clipList.addEventListener("drop", (event) => addFiles(event.dataTransfer.files));
            el.clipList.addEventListener("click", (event) => {
                const card = event.target.closest(".clipCard");
                if (!card) return;
                const id = Number(card.dataset.id);
                if (event.target.closest('[data-action="remove"]')) removeClip(id);
                else if (id !== selectedId) selectClip(id);
            });
            el.analyzeButton.addEventListener("click", analyze);
            el.analyzeAllButton.addEventListener("click", analyzeAll);
            el.playButton.addEventListener("click", togglePlay);
            el.recordButton.addEventListener("click", toggleRecording);
            [el.rangeStart, el.rangeEnd].forEach((input) => input.addEventListener("input", () => {
                const start = Math.min(num(el.rangeStart.value), num(el.rangeEnd.value) - .02);
                const end = Math.max(num(el.rangeEnd.value), start + .02);
                setRange(start, end);
                scheduleRawPreview(input === el.rangeStart ? start : end);
            }));
            [el.startInput, el.endInput].forEach((input) => input.addEventListener("change", () => {
                setRange(el.startInput.value, el.endInput.value);
                scheduleRawPreview(input === el.startInput ? el.startInput.value : el.endInput.value);

            [el.onsetInput, el.peakInput, el.settleInput].forEach((input) => input.addEventListener("change", updateBoundaries));
            el.emotionSelect.addEventListener("change", () => {
                const clip = selectedClip();
                if (!clip) return;
                clip.emotion = el.emotionSelect.value;

                else {

            [el.shapeVariation, el.shapeMaxPeriod, el.shapeReachFloor].forEach((input) => input.addEventListener("input", updateShapeControl));
            [el.alignX, el.alignY, el.alignScale].forEach((input) => input.addEventListener("input", updateAlignment));
            el.alignApplyButton.addEventListener("click", prepareAllFrames);
            el.outputResolution.addEventListener("input", () => {
                const width = num(el.outputResolution.value, 720);
                el.resolutionOutput.textContent = `${width} × ${width * 16 / 9}`;
            });
            el.outputResolution.addEventListener("change", updateOutputResolution);
            el.prepareButton.addEventListener("click", prepareFrames);
            new ResizeObserver(drawChart).observe(el.analysisChart);
            new ResizeObserver(() => drawShapeWave()).observe(el.shapeWave);
            updateShapeControl();
            window.addEventListener("beforeunload", () => {
                clips.forEach((clip) => {
                    URL.revokeObjectURL(clip.url);
                    clip.frames.forEach((frame) => frame.close?.());
                });
            });
        }

        async function initialize() {
            bindEvents();
            renderClipList();
            drawCurrentFrame();
            clearCanvas(rawContext);
            try {
                await models;
                modelsReady = true;
                el.analysisBadge.textContent = "準備完了";
                setStatus("動画を追加してください");
            } catch (error) {
                console.error(error);
                el.analysisBadge.textContent = "読込失敗";
                setStatus("解析モデルの読み込みに失敗しました", true);

        }

        console.assert(Math.abs(crossing([{ time: 0, value: 0 }, { time: 1, value: 1 }], .5, "up", 1, 1) - .5) < 1e-9, "boundary interpolation");
        console.assert(emotionFromFileName("03_angry_take01.mp4") === "angry", "filename emotion detection");
        console.assert(equalBlend(.2, .8) === .5 && equalBlend(null, .8) === .8, "50:50 analysis blend");
        console.assert(outputFrameRate(30) === 30 && outputFrameRate(31) === 60, "output frame rate selection");
        console.assert(chooseFrame([{}], -1, [], () => null, 0) === 0, "single frame selection");
        initialize();
